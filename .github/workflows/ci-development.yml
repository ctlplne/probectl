name: ci-development

on:
  workflow_run:
    workflows: [ci]
    types: [in_progress]

permissions:
  contents: read

# No concurrency cancellation here: each notification keeps its own receipt.
jobs:
  coalesce:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      # workflow_run's SHA is trusted default-branch code, NOT upstream PR code.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Coalesce only superseded ordinary main CI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/ci_development.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-development/
          retention-days: 90
