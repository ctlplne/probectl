name: nightly

# U-054: the BLACK-BOX full-stack e2e (test/e2e) — the release control-plane
# image in session auth against a real Dex, the real compose dependencies,
# public interfaces only: two tenants' HTTPS writes and reads, a join token
# redeemed for a tenant-bound SVID, a real canary agent over mTLS, two tenants'
# fixture flows over Kafka, and the tenancy boundary both ways. TQ-03 moved the
# per-push copy into ci.yml's e2e job under verify-all; this scheduled run
# stays as the drift catch on quiet days (it builds the image itself).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Exact patch pin, in lockstep with go.work + go.mod (`go 1.26.11` /
# `toolchain go1.26.11`, SUPPLY-007) and ci.yml's GO_VERSION. A bare "1.26" let
# setup-go resolve a different patch on the runner than the toolchain the
# modules require — the skew that broke a build job; pin the patch everywhere.
env:
  GO_VERSION: "1.26.11"

jobs:
  e2e:
    name: e2e (black-box full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: browser-worker/package-lock.json
      - name: Install the pinned Chromium for release-source reporting
        # Reuse the exact browser payload tested by browser-worker and a11y.
        # Older Playwright ZIP extraction hangs on Node26 (upstream40724).
        # Copy only browser files; execution keeps setup-node's Node26/npm11.
        # The local CLI still installs OS dependencies and verifies that its
        # expected Chromium revision exists before any receipt can run.
        working-directory: browser-worker
        env:
          PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.55.1-noble@sha256:2f29369043d81d6d69a815ceb80760f55e85f5020371ad06a4d996f18503ad1c
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx --no-install playwright install-deps chromium
          export PLAYWRIGHT_BROWSERS_PATH="$(mktemp -d "$RUNNER_TEMP/probectl-browsers.XXXXXX")"
          browser_container="$(docker create "$PLAYWRIGHT_IMAGE")"
          trap 'docker rm "$browser_container" >/dev/null' EXIT
          docker cp "$browser_container:/ms-playwright/." "$PLAYWRIGHT_BROWSERS_PATH/"
          node --input-type=module -e 'import fs from "node:fs"; import { chromium } from "playwright"; fs.accessSync(chromium.executablePath(), fs.constants.X_OK); console.log("Verified pinned Chromium:", chromium.executablePath());'
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
      - name: full-stack e2e (release image → Dex SSO → two-tenant HTTPS API → mTLS canary → tenancy)
        run: make e2e

  discover-fuzz-targets:
    name: discover fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - id: targets
        name: Build fuzz target matrix
        run: scripts/list_fuzz_targets.sh --github-output >> "$GITHUB_OUTPUT"
      - name: Log discovered fuzz targets
        run: scripts/list_fuzz_targets.sh

  fuzz:
    name: fuzz ${{ matrix.name }} (TEST-013 nightly)
    # The per-PR fuzz-smoke is seconds-long; this runs each untrusted-input
    # fuzz target for a real budget every night. TEST-003 shards by discovered
    # target, so every target gets its budget (a calibrated count, else 10m)
    # without one job trying to spend target_count * 10m inside a 15m timeout.
    needs: discover-fuzz-targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-fuzz-targets.outputs.matrix) }}
    env:
      FUZZ_NIGHTLY_FUZZTIME: "10m"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # G6: a calibrated target runs a count budget (docs/fuzz/nightly_budget.tsv,
      # about 8 minutes each) instead of a wall-clock one, which sidesteps the Go
      # fuzz engine's deadline race (golang/go#76901). An uncalibrated target
      # keeps FUZZ_NIGHTLY_FUZZTIME.
      - name: Long-budget fuzz target
        env:
          FUZZ_PKG: ${{ matrix.pkg }}
          FUZZ_NAME: ${{ matrix.name }}
          FUZZ_COUNT_BUDGET: ${{ matrix.fuzztime }}
        run: |
          set -euo pipefail
          budget="${FUZZ_COUNT_BUDGET:-${FUZZ_NIGHTLY_FUZZTIME}}"
          echo "fuzzing ${FUZZ_PKG} ${FUZZ_NAME} (${budget})"
          go test "${FUZZ_PKG}" -run '^$' -fuzz "^${FUZZ_NAME}$" -fuzztime "${budget}"
      # Only the crashers this run wrote (untracked files), not the committed
      # seed corpora, under a per-target name so matrix legs never collide.
      - name: Collect new fuzz crashers
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p fuzz-crashers
          git ls-files --others --exclude-standard -- '*/testdata/fuzz/*' |
            while IFS= read -r f; do mkdir -p "fuzz-crashers/$(dirname "$f")"; cp "$f" "fuzz-crashers/$f"; done
          find fuzz-crashers -type f | sed 's/^/new crasher: /'
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: failure()
        with:
          name: fuzz-crashers-${{ matrix.name }}
          path: fuzz-crashers/
          if-no-files-found: ignore

  ingest-bench:
    name: ingest-bench (Sprint 14 — feeds the Sprint 17 scale baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Consumer hot-path benchmarks
        run: go test -bench=BenchmarkIngest -benchmem -count=3 -run '^$' ./internal/pipeline/... | tee ingest-bench.txt
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ingest-bench
          path: ingest-bench.txt

  scale-gate-m:
    name: scale-gate-m (Sprint 17 — M-profile SLO regression guard)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: M-profile scale gate (results + flow planes; SLO violations fail)
        run: make scale-gate-m
      - name: M-tier FULL-STACK regression (real Kafka + Prometheus + ClickHouse)
        run: |
          set -euo pipefail
          docker compose -f deploy/compose/dev.yml up -d --wait kafka prometheus clickhouse
          # DECLARE the stack present so the gates RUN against it (TQ-04): with
          # these set, a declared-but-unreachable dependency FAILS the step
          # instead of skipping — a step that brought the stack up must never
          # pass vacuously. Without them both gates skipped and the step was a
          # green check that proved nothing.
          PROBECTL_RUN_FULLSTACK_LOAD=1 \
          PROBECTL_SCALE_TIER=M \
          PROBECTL_TEST_KAFKA=localhost:9092 \
          PROBECTL_PROM_URL=http://localhost:9090 \
          PROBECTL_FLOWSTORE_URL=http://probectl:probectl@localhost:8123 \
            go test -tags=integration -count=1 -v -timeout 20m \
            -run '^TestFullStack(Load|Flow)Gate$' ./internal/perf/ | tee fullstack-regression.log
          # Fail closed if the stack was declared present yet a gate SKIPPED, or
          # if either gate left no RESULT ROW verdict — both are the vacuity
          # TQ-04 removed. (set -o pipefail already propagates a gate FAIL.)
          if grep -q "RESULT ROW: SKIP" fullstack-regression.log; then
            echo "TQ-04: a full-stack gate SKIPPED though the stack was declared present — vacuous run" >&2
            exit 1
          fi
          rows=$(grep -c "RESULT ROW" fullstack-regression.log || true)
          if [ "$rows" -lt 2 ]; then
            echo "TQ-04: expected a RESULT ROW for BOTH full-stack gates, found $rows" >&2
            exit 1
          fi
