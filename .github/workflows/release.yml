name: release

# Cut a release by pushing a semver tag: `git tag -a v0.1.0 -m "Phase 1 GA" &&
# git push origin v0.1.0`. This builds + publishes multi-arch images (cosign
# signed by digest, with SLSA provenance + SBOM attestations), cross-compiled
# binaries + SHA-256 checksums, and a GitHub release. See docs/releasing.md.
on:
  push:
    tags:
      - "v*"
  # DPR-166: a release can fail for a reason OUTSIDE the repository — a billing
  # hold stopped every job of v0.6.0 before it started — and a tag push fires
  # once. Without this, retrying meant deleting and re-pushing a published tag
  # to work around an account setting.
  #
  # DISPATCH AGAINST THE TAG, not a branch: the "Run workflow" ref selector
  # lists tags, and `gh workflow run release.yml --ref v0.6.0` does the same.
  # Every job below reads github.ref_name and github.sha, so choosing the tag
  # makes them the tag and its commit exactly as a push would — which is why
  # this needs no other change, and why dispatching from a branch would build a
  # release named after the branch. The guard below refuses that.
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  packages: write # push images to GHCR
  id-token: write # SLSA provenance / keyless attestation
  actions: read # require-green-ci reads the ci workflow's runs (U-083)

env:
  GO_VERSION: "1.26.7"
  IMAGE_PREFIX: ghcr.io/ctlplne

jobs:
  # U-022/U-083: a tag ships nothing unless the FULL ci workflow concluded
  # green on the exact tagged commit. Tag pushes don't trigger ci, so this
  # gate looks up (and, if still running, waits for) the ci run for
  # github.sha — a tag on an untested/red commit fails here and no artifact
  # is built. Branch protection on main is the second layer (docs/ops/
  # branch-protection.md); this gate holds even for tags cut off-branch.
  require-green-ci:
    name: require green ci on the tagged sha
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # DPR-166: a manual dispatch can name any ref. Everything downstream
      # versions artifacts from github.ref_name, so a branch dispatch would
      # publish a release called "main". Refuse before anything is built.
      - name: the ref must be a tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/tags/${GITHUB_REF_NAME}" ]; then
            echo "::error::release must run against a TAG ref, got '${GITHUB_REF}'. Re-dispatch with the tag selected (gh workflow run release.yml --ref vX.Y.Z)."
            exit 1
          fi
          echo "releasing tag ${GITHUB_REF_NAME}"
      - name: ci workflow must be green for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "tag ${GITHUB_REF_NAME} -> commit ${GITHUB_SHA}"
          for attempt in $(seq 1 60); do # up to ~30 minutes for an in-flight run
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "none none" else "\(.status) \(.conclusion)" end')"
            read -r status conclusion <<<"${run}"
            case "${status}/${conclusion}" in
              completed/success)
                echo "ci is green on ${GITHUB_SHA}"; exit 0 ;;
              completed/*)
                echo "::error::ci concluded '${conclusion}' on ${GITHUB_SHA} — refusing to release an untested/red commit (U-083)."; exit 1 ;;
              none/*)
                echo "::error::no ci run exists for ${GITHUB_SHA}. Tag a commit that ran ci (push it to main first)."; exit 1 ;;
              *)
                echo "ci run is '${status}' (attempt ${attempt}/60); waiting 30s..."; sleep 30 ;;
            esac
          done
          echo "::error::timed out waiting for ci to complete on ${GITHUB_SHA}."
          exit 1

  # CL-001: ordinary CI validates and renders an honest inventory even while
  # declared not-done gaps remain. A release is stricter: no image, binary, or
  # package may be published until every shipped capability has 100% spine
  # coverage (concrete proof or genuine none-by-design).
  #
  # DPR-253, decision D-15 (2026-09-20): docs/quality/completeness.md reserves
  # the strict form for a FINAL release, and this job used to apply it to every
  # tag — so v0.6.4 cleared all three entry gates and then published nothing,
  # while publish-chart, deb/rpm and the air-gap bundle went on rotting unrun.
  # The split: the gate ALWAYS runs and its full row-by-row refusal always lands
  # in this log, a `v0.*` tag publishes a GitHub PRE-RELEASE that states the gap
  # count, and any other tag is still refused outright. The oracle itself is
  # untouched — `make completeness-release-gate` is the same command with the
  # same verdict, and 0.x is the only version range where that verdict does not
  # block. `gaps` and `prerelease` are read by the binaries job, so a release
  # carrying acknowledged gaps cannot be published without saying so.
  completeness-release-gate:
    name: capability ledger 100% complete
    needs: require-green-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      gaps: ${{ steps.ledger.outputs.gaps }}
      prerelease: ${{ steps.ledger.outputs.prerelease }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Reject every acknowledged completeness gap
        id: ledger
        run: bash scripts/release_completeness_verdict.sh

  # TEST-011: the docs-vs-CI contradiction recurs the moment the Makefile grows
  # a binary that nobody adds here. This gate makes the published set cover the
  # Makefile's BINARIES plus the analyzer/browser runtime images — drift fails the
  # release instead of silently shipping an incomplete set.
  components-match-makefile:
    name: published components complete
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Assert every Makefile binary is a published component
        run: |
          set -euo pipefail
          expected="$({ grep -E '^BINARIES[[:space:]]*:=' Makefile | cut -d= -f2- | tr ' ' '\n'; printf '%s\n' probectl-bgp-analyzer probectl-browser-agent; } | grep . | sort -u)"
          # The full set this workflow publishes: the images matrix plus the
          # special-image includes (eBPF + analyzer). Keep in lockstep
          # with the matrix above — this list is the single assertion point.
          published="$(printf '%s\n' \
            probectl-control probectl-agent probectl-endpoint \
            probectl-flow-agent probectl-device-agent probectl-cloud-metrics terraform-provider-probectl probectl \
            probectl-ebpf-agent probectl-bgp-analyzer probectl-browser-agent | sort -u)"
          if ! diff <(echo "$expected") <(echo "$published"); then
            echo "::error::release.yml published components drift from Makefile BINARIES + special runtime images (TEST-011). Update the images matrix."
            exit 1
          fi
          echo "all $(echo "$expected" | wc -l | tr -d ' ') release components are published"

  # DPR-001: a release that carries no license trust anchor ships control
  # planes that refuse every commercial license file. Fail closed before any
  # artifact is built. Anchors are the committed internal/license/trusted_keys/*.pub
  # files plus the optional PROBECTL_LICENSE_PUBKEYS_B64 repository variable.
  license-trust-anchor:
    name: license trust anchor present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: At least one valid Ed25519 license public key must ship
        env:
          PROBECTL_LICENSE_PUBKEYS_B64: ${{ vars.PROBECTL_LICENSE_PUBKEYS_B64 }}
        run: |
          set -euo pipefail
          bash scripts/check_license_trust_anchor.sh SELFTEST
          bash scripts/check_license_trust_anchor.sh --release

  images:
    name: images (${{ matrix.component }})
    needs: [require-green-ci, completeness-release-gate, components-match-makefile, license-trust-anchor]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # All Go binaries ship as images + signed downloads; eBPF, BGP, and the
        # rendered-browser agent use their special Dockerfiles below.
        component:
          - probectl-control
          - probectl-agent
          - probectl-endpoint
          - probectl-flow-agent
          - probectl-device-agent
          - probectl-cloud-metrics
          - terraform-provider-probectl
          - probectl
        dockerfile: [deploy/docker/Dockerfile]
        include:
          # EBPF-004: the SHIPPED ebpf-agent image is the LIVE (-tags ebpf)
          # build — the generic Dockerfile would ship the fixture-only
          # replayer (dev/test mode). ci.yml's ebpf-image-live job asserts
          # the binary records the tag.
          - component: probectl-ebpf-agent
            dockerfile: deploy/docker/Dockerfile.ebpf
          - component: probectl-bgp-analyzer
            dockerfile: deploy/docker/Dockerfile.bgp-analyzer
          - component: probectl-browser-agent
            dockerfile: deploy/docker/Dockerfile.browser-agent
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}
          # DPR-257: metadata-action has TWO routes to `latest` and gating one is
          # not gating it. The `flavor` default is `latest=auto`, which adds it
          # for any semver tag push regardless of the tags list — so v0.6.5
          # published `latest` on all eleven components while the raw entry below
          # correctly rendered `enable=false`. Pinning the flavor off makes the
          # gated entry the ONLY route, which is the whole point of naming it.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            # D-15: a pre-release must not become the image everyone pulls by
            # default. `latest` moves only when the capability ledger is
            # complete; a 0.x tag that ships acknowledged gaps still gets its
            # immutable {{version}} tag, so `docs/install.md`'s digest pin works
            # exactly as documented, and nothing silently recommends it.
            type=raw,value=latest,enable=${{ needs.completeness-release-gate.outputs.prerelease != 'true' }}
      - id: build
        name: Build + push multi-arch image (with provenance + SBOM)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            COMPONENT=${{ matrix.component }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            LICENSE_PUBKEYS_B64=${{ vars.PROBECTL_LICENSE_PUBKEYS_B64 }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      # SUPPLY-002: sign the immutable multi-arch image digest. Helm already
      # refuses tag-only privileged eBPF-agent deploys; this signature is what
      # the shipped admission policy verifies at cluster admission time.
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Sign and self-verify image digest (cosign keyless)
        env:
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_REF}"
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/" \
            "${IMAGE_REF}"

  compose-image-anonymous-pull:
    name: compose image anonymous pull smoke
    # OPS-002: if the repository is configured to promise anonymous GHCR pulls,
    # prove that the exact image pinned by deploy/compose/probectl.yml can be
    # pulled without credentials after the image publish job completes.
    if: vars.PROBECTL_COMPOSE_IMAGE_PUBLIC == 'true'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Anonymous pull exact compose image
        env:
          PROBECTL_COMPOSE_IMAGE_ANONYMOUS_PULL: "1"
        run: bash scripts/check_compose_image_contract.sh

  binaries:
    name: binaries + checksums + release
    needs: [require-green-ci, completeness-release-gate, license-trust-anchor]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Cross-compile release binaries in pinned eBPF toolchain
        env:
          # DPR-001: link-time license trust anchor (on top of the committed
          # internal/license/trusted_keys/*.pub files); passed through
          # scripts/run-ebpf-toolchain.sh into the build container.
          PROBECTL_LICENSE_PUBKEYS_B64: ${{ vars.PROBECTL_LICENSE_PUBKEYS_B64 }}
        run: |
          set -euo pipefail
          # SUPPLY-003: probectl-ebpf-agent downloads are produced inside the
          # same digest-pinned, snapshot-pinned clang/llvm/bpftool stage as the
          # live image. The receipt is placed in dist/ and signed below.
          VERSION="${GITHUB_REF_NAME}" \
            COMMIT="${GITHUB_SHA}" \
            DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            bash scripts/run-ebpf-toolchain.sh bash scripts/build-release-binaries.sh
          test -s "dist/probectl_${GITHUB_REF_NAME}_ebpf-toolchain.txt"
      - name: Assert the shipped control plane carries a license trust anchor (DPR-001)
        run: |
          set -euo pipefail
          bin="dist/probectl-control_${GITHUB_REF_NAME}_linux_amd64"
          chmod +x "$bin"
          out="$("$bin" version)"
          echo "$out"
          grep -Eq 'license trust anchors: [1-9][0-9]*' <<<"$out" \
            || { echo "::error::release probectl-control carries no license trust anchor — it would refuse every license file (DPR-001)"; exit 1; }
      # U-068: publish the SBOM as a real release artifact (SPDX JSON via
      # syft over the source tree + go.mod/lockfiles). It is written into
      # dist/ BEFORE the signing loop below, so it ships signed and
      # self-verified like every other artifact. The container images carry
      # their own buildx-attested SBOMs (see the images job).
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9
        with:
          path: .
          format: spdx-json
          output-file: dist/probectl_${{ github.ref_name }}_sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false # released via the dist/* glob, signed
      # U-006: keyless (Sigstore/Fulcio) signatures over every released binary
      # and the checksum manifest. The OIDC identity baked into each .pem is
      # THIS repository's release workflow — verifiers pin it (see
      # docs/ops/verify-artifacts.md). id-token: write is already granted.
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Sign artifacts (cosign keyless)
        run: |
          set -euo pipefail
          cd dist
          for f in *; do
            case "$f" in *.sig|*.pem) continue;; esac
            cosign sign-blob --yes               --output-signature "${f}.sig"               --output-certificate "${f}.pem"               "$f"
          done
      - name: Verify own signatures (the gate proves the release is verifiable)
        run: |
          set -euo pipefail
          cd dist
          for f in *; do
            case "$f" in *.sig|*.pem) continue;; esac
            cosign verify-blob               --certificate "${f}.pem"               --signature "${f}.sig"               --certificate-oidc-issuer "https://token.actions.githubusercontent.com"               --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/"               "$f"
          done
          echo "all artifacts verify"
      # D-15: a release that ships with acknowledged capability gaps says so on
      # its own page, in the notes, with the count -- and is flagged a
      # pre-release so every downstream consumer that reads that flag (GitHub's
      # "Latest release", gh release list, dependency tooling) sees it too. When
      # the ledger is complete this block reduces to an ordinary release.
      - name: Compose the completeness note
        id: notes
        env:
          GAPS: ${{ needs.completeness-release-gate.outputs.gaps }}
          PRERELEASE: ${{ needs.completeness-release-gate.outputs.prerelease }}
        run: |
          set -euo pipefail
          {
            if [ "${PRERELEASE}" = "true" ]; then
              echo "> **Pre-release.** probectl's capability ledger records **${GAPS} acknowledged evidence gap(s)**"
              echo "> at this tag, so this build is published as a pre-release under decision D-15."
              echo "> Every gap is a declared not-done cell in \`capabilities.yaml\`, not an unknown: run"
              echo "> \`make completeness-release-gate\` on this tag for the row-by-row list, or read the"
              echo "> \`capability-completeness-ledger\` artifact on this run. Artifact signing and"
              echo "> verification are unaffected -- see docs/ops/verify-artifacts.md."
            else
              echo "> probectl's capability ledger is **100% complete** at this tag: every shipped"
              echo "> capability has concrete proof or an approved none-by-design disposition for all"
              echo "> ten wiring-spine cells."
            fi
          } > release-note.md
          cat release-note.md
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.completeness-release-gate.outputs.prerelease == 'true' }}
          body_path: release-note.md
          files: |
            dist/*

  publish-chart:
    name: publish helm chart (OCI)
    # OPS-001: a chart that lags the app version is the
    # 0.1.0-chart-deploys-a-control-plane-that-refuses-v0.4.0-agents trap. Assert
    # the chart's appVersion matches the release tag before publishing, and push
    # the chart as an OCI artifact to GHCR alongside the images.
    needs: [require-green-ci, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: appVersion must match the release tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          appv="$(grep -E '^appVersion:' deploy/helm/probectl/Chart.yaml | awk '{print $2}' | tr -d '"')"
          if [ "$appv" != "$tag" ]; then
            echo "::error::Chart.yaml appVersion ($appv) != release tag ($tag) — bump the chart before tagging (OPS-001)."
            exit 1
          fi
          echo "chart appVersion matches tag $tag"
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Helm login + push (OCI to GHCR)
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          chart_pkg="probectl-${tag}.tgz"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/probectl --version "${tag}" --app-version "${tag}"
          cosign sign-blob --yes \
            --output-signature "${chart_pkg}.sig" \
            --output-certificate "${chart_pkg}.pem" \
            "${chart_pkg}"
          cosign verify-blob \
            --certificate "${chart_pkg}.pem" \
            --signature "${chart_pkg}.sig" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/" \
            "${chart_pkg}"
          # DPR-258: helm writes "Pushed:" and "Digest:" to STDERR, so the
          # stdout-only capture that used to be here left the digest unparseable
          # and v0.6.5 published this chart and then failed reading its own
          # output. scripts/helm_push_digest.sh owns that read and carries the
          # planted self-test for it (make helm-gate runs it on every push).
          chart_digest="$(bash scripts/helm_push_digest.sh "${chart_pkg}" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts")"
          case "$chart_digest" in
            sha256:*) ;;
            *) echo "::error::helm push did not report an immutable chart digest"; exit 1 ;;
          esac
          chart_ref="ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/probectl@${chart_digest}"
          printf '%s\n' "$chart_ref" > "probectl-${tag}.chart-digest.txt"
          cosign sign --yes "$chart_ref"
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/" \
            "$chart_ref"
          echo "chart package and OCI digest verify"
      - name: Attach signed chart package evidence to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            probectl-*.tgz
            probectl-*.tgz.sig
            probectl-*.tgz.pem
            probectl-*.chart-digest.txt

  packages:
    name: deb/rpm packages (${{ matrix.agent }})
    # OPS-004: build a signed deb + rpm per agent type via nfpm and attach them
    # to the release. The binaries job produces the cross-compiled static
    # binaries this consumes; the signed apt/yum repo publish is a follow-on
    # step against the org's package repositories.
    needs: [require-green-ci, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    strategy:
      matrix:
        agent: [agent, ebpf-agent, flow-agent, device-agent, endpoint]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Fetch release binaries
        run: |
          set -euo pipefail
          binary="probectl-${{ matrix.agent }}_${GITHUB_REF_NAME}_linux_${{ matrix.arch }}"
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "${binary}" \
            --pattern "${binary}.sig" \
            --pattern "${binary}.pem" \
            --dir dist
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify release binary package input
        run: |
          set -euo pipefail
          binary="dist/probectl-${{ matrix.agent }}_${GITHUB_REF_NAME}_linux_${{ matrix.arch }}"
          for artifact in "${binary}" "${binary}.sig" "${binary}.pem"; do
            test -s "$artifact" || { echo "::error::missing signed package input: ${artifact}"; exit 1; }
          done
          cosign verify-blob \
            --certificate "${binary}.pem" \
            --signature "${binary}.sig" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/" \
            "${binary}"
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.0
      - name: Assert packaged eBPF binary is live
        if: matrix.agent == 'ebpf-agent'
        run: |
          set -euo pipefail
          bin="dist/probectl-ebpf-agent_${GITHUB_REF_NAME}_linux_${{ matrix.arch }}"
          go version -m "$bin" | tee buildinfo.txt
          grep -E '\bbuild\s+-tags=.*\bebpf\b' buildinfo.txt \
            || { echo "::error::downloadable probectl-ebpf-agent package input is NOT the -tags ebpf live build (TEST-002)"; exit 1; }
      - name: Build deb + rpm
        env:
          AGENT: ${{ matrix.agent }}
          ARCH: ${{ matrix.arch }}
          FILE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # OPS-002: FILE_TAG (v-prefixed) matches the binary on disk
          # (probectl-<agent>_v0.2.0_linux_<arch>); PKG_VERSION (numeric) is the
          # deb/rpm package version. Conflating the two broke every package build.
          PKG_VERSION="${FILE_TAG#v}"
          export AGENT ARCH FILE_TAG PKG_VERSION
          # OPS-002: nfpm does NOT expand ${VAR} in contents.src, so render the
          # config with envsubst first (scoped to our 4 vars so no stray $ is
          # touched). Without this, nfpm globbed a literal '${AGENT}' path and
          # built nothing.
          rendered="$(mktemp)"
          envsubst '${AGENT} ${ARCH} ${FILE_TAG} ${PKG_VERSION}' \
            < deploy/packaging/nfpm.yaml > "$rendered"
          for pkg in deb rpm; do
            nfpm package -f "$rendered" -p "$pkg" -t dist/
          done
      - name: Sign packages (cosign keyless)
        run: |
          set -euo pipefail
          cd dist
          for f in *.deb *.rpm; do
            [ -e "$f" ] || continue
            cosign sign-blob --yes --output-signature "${f}.sig" --output-certificate "${f}.pem" "$f"
          done
      - name: Verify own package signatures (SUPPLY-004 — mirror the binaries gate)
        run: |
          set -euo pipefail
          cd dist
          for f in *.deb *.rpm; do
            [ -e "$f" ] || continue
            cosign verify-blob \
              --certificate "${f}.pem" \
              --signature "${f}.sig" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/" \
              "$f"
          done
          echo "all packages verify"
      - name: Attach to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.sig
            dist/*.pem

  airgap-bundle:
    name: verified air-gap bundle
    # OPS-003: assemble only after every constituent exists and has passed its
    # own signing/self-verification job. The builder re-verifies each blob and
    # immutable image digest before it writes the offline archive.
    needs: [images, binaries, publish-chart, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Download the signed release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist
      - name: Assemble from verified images, chart, binaries, and packages
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          VERSION="$version" \
            DIST=dist \
            OUT="probectl-airgap-${version}" \
            IMAGE_PREFIX="${IMAGE_PREFIX}" \
            PROBECTL_COSIGN_IDENTITY_REGEXP="^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/release\\.yml@refs/tags/" \
            bash scripts/airgap-bundle.sh
          test -s "probectl-airgap-${version}.tar.gz"
      - name: Sign and self-verify the outer archive
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="probectl-airgap-${version}.tar.gz"
          cosign sign-blob --yes \
            --output-signature "${archive}.sig" \
            --output-certificate "${archive}.pem" \
            "$archive"
          cosign verify-blob \
            --certificate "${archive}.pem" \
            --signature "${archive}.sig" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/" \
            "$archive"
      - name: Attach the verified offline kit to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            probectl-airgap-*.tar.gz
            probectl-airgap-*.tar.gz.sig
            probectl-airgap-*.tar.gz.pem
