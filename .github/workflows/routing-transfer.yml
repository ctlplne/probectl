name: routing-transfer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routing-transfer-main
  cancel-in-progress: false

jobs:
  stock-routing-transfer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROBECTL_TEST_REQUIRE_SERVICES: "1"
      PROBECTL_TEST_KAFKA: localhost:9092
      PROBECTL_TEST_CLICKHOUSE_URL: http://probectl:probectl@localhost:8123
      PROBECTL_PROM_URL: http://localhost:9090
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            browser-worker/package-lock.json
      - name: Embed the bundle required by the shipped harness
        run: |
          npm --prefix web ci
          npm --prefix web run build
          cp -R web/dist/. internal/webui/dist/
      - name: Prepare the shipped harness browser
        working-directory: browser-worker
        env:
          PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.55.1-noble@sha256:2f29369043d81d6d69a815ceb80760f55e85f5020371ad06a4d996f18503ad1c
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          bash ../scripts/ci_apt_transport.sh
          npx --no-install playwright install-deps chromium
          export PLAYWRIGHT_BROWSERS_PATH="$(mktemp -d "$RUNNER_TEMP/probectl-browsers.XXXXXX")"
          browser_container="$(docker create "$PLAYWRIGHT_IMAGE")"
          trap 'docker rm "$browser_container" >/dev/null' EXIT
          docker cp "$browser_container:/ms-playwright/." "$PLAYWRIGHT_BROWSERS_PATH/"
          node --input-type=module -e 'import fs from "node:fs"; import { chromium } from "playwright"; fs.accessSync(chromium.executablePath(), fs.constants.X_OK);'
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
      - name: Start TLS PostgreSQL and Dex
        run: |
          mkdir -p "$RUNNER_TEMP/routing-transfer"
          echo "PROBECTL_TEST_TRANSFER_ARTIFACTS=$RUNNER_TEMP/routing-transfer" >> "$GITHUB_ENV"
          ./scripts/ci_pg_tls.sh
          ./scripts/ci_dex.sh .ci-dex
      - name: Start the existing lab stores and bus
        run: docker compose -f deploy/compose/dev.yml up -d --wait kafka clickhouse prometheus
      - name: Prepare the runner's capture and probe tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y tcpdump
          gid="$(id -g)"
          sudo sysctl -w "net.ipv4.ping_group_range=$gid $gid"
      - name: Run the stock routing-transfer test three times
        run: |
          set -o pipefail
          root=TestFRRRoutingTransferUsesStockEgressAndIndependentSignedCounters
          result=0
          go test -json -tags=integration -count=3 -timeout=20m -run "^${root}$" ./internal/bgp \
            | tee "$PROBECTL_TEST_TRANSFER_ARTIFACTS/go-test.jsonl" || result=1
          python3 - "$root" "$PROBECTL_TEST_TRANSFER_ARTIFACTS/go-test.jsonl" <<'PY' || result=1
          import json
          import sys
          root, path = sys.argv[1:]
          with open(path, encoding="utf-8") as events:
              results = [event["Action"] for event in map(json.loads, events)
                         if event.get("Test") == root and event["Action"] in ("pass", "fail", "skip")]
          if results != ["pass"] * 3:
              raise SystemExit(f"Expected three completed passes of {root}; observed {results}")
          PY
          exit "$result"
      - name: Upload owned routing lab diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: routing-transfer-${{ github.run_attempt }}
          path: ${{ runner.temp }}/routing-transfer
          if-no-files-found: warn
          retention-days: 7
