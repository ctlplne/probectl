name: security-scan

# U-069: scheduled, EVIDENCED dependency-CVE scanning. Both diligence runs
# found the CVE posture unverifiable because no scheduled scan left
# artifacts. This workflow runs weekly (and on demand), uploads every
# scanner's raw output as a build artifact (the evidence trail), and FAILS
# on High/Critical findings — the same failure a PR would hit in ci.yml's
# dependency-scan, so a new serious CVE in an unchanged repo still goes red.

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC (off the top-of-hour stampede)
  workflow_dispatch:

permissions:
  contents: read
  # DPR-245: read the repository's own code-scanning analyzes, to prove CodeQL is
  # still looking at the product and not only at the workflows.
  security-events: read

# Exact patch pin, in lockstep with go.work + go.mod (`go 1.26.7` /
# `toolchain go1.26.7`, SUPPLY-007) and ci.yml's GO_VERSION. govulncheck's
# stdlib attribution is only honest when it scans against the SAME patch the
# release toolchain ships; a bare "1.26" could scan a different stdlib than we
# build, reporting CVEs we don't ship or hiding ones we do.
env:
  GO_VERSION: "1.26.7"

jobs:
  # DPR-245: FIRST, because the rest of this workflow is meaningless if the
  # repository's static analysis has quietly stopped covering the product. On
  # 2026-09-19 CodeQL's last Go analysis was 79 days old and only
  # /language:actions was still running; the open alert list was a July snapshot,
  # and a local run of the same suite on current code found two high-severity rule
  # classes GitHub had never reported. Nothing caught it because the language list
  # lives in repo settings, where no diff can show it changing.
  #
  # This job is deliberately in security-scan.yml and not in ci.yml: it fails while
  # the coverage gap is open (decisions-needed D-14, a settings change), and a
  # weekly evidence run is the right place for a standing truth, not the push path.
  codeql-coverage:
    name: codeql coverage (product languages are actually analysed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Coverage staleness gate (SUPPLY-007)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SELFTEST=1 ./scripts/check_codeql_coverage.sh
          ./scripts/check_codeql_coverage.sh

  govulncheck:
    name: govulncheck (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # DPR-269: this ran through golang/govulncheck-action, which performs its OWN
      # nested actions/checkout@v4.1.1. That nested checkout began failing with
      # "fatal: unable to access 'https://github.com/ctlplne/probectl/': The
      # requested URL returned error: 400", so the job went red BEFORE scanning
      # anything -- a vulnerability gate reporting an infrastructure fault, with no
      # scan behind the verdict either way. Running the tool directly removes the
      # nested checkout entirely and matches how every other Go tool in this repo is
      # installed: an exact version, never a floating one.
      - name: Install govulncheck (exact version, no floating install)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      # The sarif pass is EVIDENCE and always exits 0; the text pass below is the
      # gate. Keeping them separate means a non-reachable finding is recorded
      # without failing the build, and a reachable one fails it.
      - name: Evidence artifact (sarif, never the gate)
        run: govulncheck -format sarif ./... > govulncheck.sarif
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: govulncheck-${{ github.run_id }}
          path: govulncheck.sarif
      - name: Gate on reachable vulnerabilities
        run: |
          set -o pipefail
          govulncheck ./... | tee govulncheck.txt
          # A scan that produced no symbol verdict did not happen; do not let an
          # empty or truncated run read as a clean bill of health.
          grep -q 'Your code is affected by' govulncheck.txt || {
            echo "::error::govulncheck produced no symbol verdict — the scan did not run"; exit 1; }

  npm-audit:
    name: npm audit (web + browser-worker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Audit web (exact, expiring exceptions only)
        working-directory: web
        run: |
          node ../scripts/check_web_router_mode.mjs --root ..
          npm audit --json > ../npm-audit-web.json || true
          node ../scripts/check_npm_audit_policy.mjs \
            --workspace web \
            --audit ../npm-audit-web.json \
            --lock package-lock.json \
            --policy ../docs/security/npm-audit-policy.json
      - name: Audit browser-worker (no high/critical advisories)
        if: always()
        working-directory: browser-worker
        run: |
          npm audit --json > ../npm-audit-browser-worker.json || true
          node ../scripts/check_npm_audit_policy.mjs \
            --workspace browser-worker \
            --audit ../npm-audit-browser-worker.json \
            --lock package-lock.json \
            --policy ../docs/security/npm-audit-policy.json
      - name: Evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-audit-${{ github.run_id }}
          path: npm-audit-*.json

  trivy-fs:
    name: trivy fs (lockfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Trivy filesystem scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln # secrets are the gitleaks secret-scan job's responsibility (it owns the allowlist)
          format: json
          output: trivy-fs.json
          exit-code: "0" # the gate is the second pass; this one is evidence
      - name: Evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-fs-${{ github.run_id }}
          path: trivy-fs.json
      - name: Gate on High and Critical
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln # secrets are the gitleaks secret-scan job's responsibility (it owns the allowlist)
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
