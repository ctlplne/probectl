# gitleaks config for the secret-scan CI gate (Sprint 1 / CODE-006).
#
# The scan runs against the full git graph (`gitleaks git --log-opts=--all`),
# not just the working tree at HEAD. A deleted secret is still in the repository
# history until history is rewritten, so the gate treats historical findings as
# blocking unless this file names a tightly-scoped false positive.
#
# Allowlist policy: ONLY deliberate fake secrets inside redaction/no-secrets
# TESTS (the tests exist to prove these strings get masked) and named
# false-positive patterns. Never allowlist a real credential path.

[extend]
useDefault = true

[allowlist]
description = "Deliberate test fixtures + named false positives"
paths = [
  # These tests PLANT fake secrets to prove support bundles / diagnostics
  # redact them. The strings are the test's input, not credentials.
  '''internal/control/diagnostics_test\.go''',
  '''internal/support/support_test\.go''',
  # The AI redaction test plants a dummy PEM block to prove masking.
  '''internal/ai/redact_test\.go''',
  # The AI egress-gate redactor test plants fake PII + a dummy Stripe-style
  # key (the literal lives only inside that test) to prove redactText() masks
  # them (AIRCA-002). The strings are the test's INPUT, not credentials.
  '''internal/ai/egressgate_test\.go''',
  # DPR-003: the shared redaction-pattern parity corpus and the AI boundary
  # test plant a fake PEM block, bearer token, and api_key= pairs to prove the
  # SAME shapes are masked on every egress path. Test INPUT, not credentials.
  '''internal/redactpat/parity_test\.go''',
  '''internal/ai/redact_boundary_test\.go''',
  # KEYS-003: this test plants a literal "fake" EC PRIVATE KEY PEM to prove
  # sealCAKey REFUSES a plaintext CA key (the bytes inside the block are
  # literally "fake"). The string is the test's INPUT, not a credential.
  '''internal/enroll/seal_test\.go''',
  # KEYS-001: this integration test plants a fake webhook secret, then asserts
  # the stored alert channel is envelope-sealed and never contains the raw
  # value. The string is the test's INPUT, not a credential.
  '''internal/control/alerts_integration_test\.go''',
]
regexes = [
  # gosnmp protocol constants (e.g. AuthenticationProtocol = gosnmp.SHA512)
  # trip the generic-api-key rule; they are enum identifiers, not secrets.
  '''gosnmp\.(SHA|MD5|AES|DES|NoAuth|NoPriv)[0-9A-Za-z]*''',
  # DPR-003 (matched against the detected secret): the IR attribution
  # key-derivation DOMAIN label is public protocol vocabulary, not a key.
  '''^probectl-ir-attribution-v1$''',
  # DPR-003: the ClickHouse CI service container's stock default account,
  # used by ci.yml health probes against a throwaway, job-local database.
  '''^default:probectl$''',
]

[[rules]]
id = "private-key"

[[rules.allowlists]]
description = "Historical throwaway OIDC test fixture removed by 425143b; commit+path must both match."
condition = "AND"
commits = ['''95d313bd9d706c69b513fba2e36b071b4ac3d380''']
paths = ['''internal/auth/testdata/oidc_test_key\.pem''']

[[rules.allowlists]]
description = "Committed planted full-history self-test fixture; fake PEM bytes in the scanner wrapper only."
condition = "AND"
commits = ['''8b979f278c094f34fb4c52b9475baa111d96e032''']
paths = ['''scripts/check_secret_scan_history\.sh''']

[[rules]]
id = "stripe-access-token"

[[rules.allowlists]]
description = "Historical changelog mention of the dummy Stripe-style AI redaction fixture; commit+path must both match."
condition = "AND"
commits = [
  '''a78802d3ea4dcce2362eb132749b086ffea7045b''',
  '''4fa7ffba4a2e9773085d03a4bfff33a9504dbda6''',
]
paths = ['''CHANGELOG\.md''']

[[rules.allowlists]]
description = "Historical known-risks mention of the dummy Stripe-style AI redaction fixture; commit+path must both match."
condition = "AND"
commits = ['''4fa7ffba4a2e9773085d03a4bfff33a9504dbda6''']
paths = ['''docs/diligence/known-risks\.md''']

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Historical CI compose-render fixture: exact commits + path + documented 64-byte throwaway value must all match."
condition = "AND"
commits = [
  '''6894913f378e2e69adb43375aac59abdc490dc00''',
  '''658753e0e362a90038eab5d2b0034633fa8f3b27''',
]
paths = ['''\.github/workflows/ci\.yml''']
regexTarget = "line"
regexes = ["PROBECTL_SESSION_HMAC_KEY:\\s*0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef\\s*$"]

[[rules.allowlists]]
description = "Historical all-compose render fixture: exact W35 commit + workflow path + documented throwaway value must all match."
condition = "AND"
commits = ['''1dadbc56716b91eee24acb6ff5017ec182018efa''']
paths = ['''\.github/workflows/ci\.yml''']
regexTarget = "line"
regexes = ['''export PROBECTL_SESSION_HMAC_KEY="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"''']

[[rules.allowlists]]
description = "Historical e2e envelope fixture (the base64 of the literal 0123456789abcdef0123456789abcdef). Commit + path must both match. DPR-210: this entry also carried a regex on that literal and therefore matched NOTHING - gitleaks redacts the line before an allowlist regex is applied, so the entry never suppressed its own finding and secret-scan stayed red. The commit and the path are the narrow part."
condition = "AND"
commits = ['''ac217d7ac307a1380c4ca7c7352e22104ccfe839''']
paths = ['''test/e2e/e2e_test\.go''']

[[rules.allowlists]]
description = "DPR-003: the local upgrade/rollback drill exports the SAME documented throwaway KEK and session pepper as the e2e/compose fixtures; path + exact literal must both match."
paths = ['''scripts/upgrade_rollback_drill\.sh''']
regexTarget = "line"
regexes = [
  '''PROBECTL_ENVELOPE_KEY="MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="''',
  '''PROBECTL_SESSION_HMAC_KEY="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"''',
]

[[rules.allowlists]]
description = "DPR-087: the compose env preflight self-test planted the SAME documented throwaway 64-hex pepper (and a 48-hex slice of it as the Postgres password) in one historical commit; commit + path + exact literal must all match. The fixture no longer uses key-shaped values."
condition = "AND"
commits = ['''2d7d7703b39cfc2733d485c1e2423c99408be6b5''']
paths = ['''scripts/compose_env_preflight\.sh''']
regexTarget = "line"
regexes = [
  '''POSTGRES_PASSWORD=0123456789abcdef0123456789abcdef0123456789abcdef\s*$''',
  '''PROBECTL_SESSION_HMAC_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef\s*$''',
  '''PROBECTL_SESSION_HMAC_KEY=zz23456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef\|'\s*$''',
]

[[rules.allowlists]]
description = "DPR-210: prose about DESIGN tokens, not credentials. The design-principles receipt reads 'focus, selection, layer, duration, and easing tokens are contrast-tested', and generic-api-key fires on the word 'tokens' next to high-entropy prose. Commit + path must both match."
condition = "AND"
commits = ['''442911f2d82683f0cca0e742d1deb4bb32346a2c''']
paths = ['''docs/ux/design-principles\.md''']
