source_catalog: docs/claims/release-catalog.json

# The independent completeness-denominator policy fixes every ID that must be
# kind=capability in the canonical release catalog and appear exactly once
# below. The exact none-by-design policy separately approves every excluded
# cell in both directions. A spine cell is concrete repository-checked
# evidence, a governed none-by-design disposition, or an acknowledged not-done
# gap on a row whose evidence_status is partial. Gaps never count as coverage.
# The gate resolves references offline.
