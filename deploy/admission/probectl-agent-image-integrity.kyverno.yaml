# Standalone (GitOps) form of the probectl-agent chart's image-integrity policy.
# The chart renders the same verifier with imageReferences DERIVED from its
# image.repository; this static copy only knows the upstream path. If you pull
# the agent from a mirror whose path differs (anything not matching the two
# patterns below), render the policy from the chart instead
#   helm template <release> deploy/helm/probectl-agent -n <ns> <your values> \
#     --show-only templates/image-integrity-policy.yaml
# or add your mirror's `<registry>/<path>/probectl-ebpf-agent*` here — an
# unmatched reference is NOT verified (RTO-12). Apply it, and wait for
# `kubectl wait --for=condition=Ready clusterpolicy/probectl-agent-image-integrity`,
# BEFORE the agent DaemonSet exists.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: probectl-agent-image-integrity
  annotations:
    policies.kyverno.io/title: Verify probectl eBPF agent image signatures
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    probectl.dev/finding: SUPPLY-001
spec:
  background: false
  # An unreachable Kyverno refuses admission; it never admits unverified.
  failurePolicy: Fail
  rules:
    - name: verify-probectl-ebpf-agent-signature-and-digest
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        # RTO-12: match the agent image under ANY registry that keeps the
        # upstream path, not just ghcr.io. verifyImages only verifies refs that
        # MATCH imageReferences; anything unmatched is skipped and admitted
        # UNVERIFIED.
        - imageReferences:
            - ghcr.io/ctlplne/probectl-ebpf-agent*
            - "*/ctlplne/probectl-ebpf-agent*"
          # RTO-12: per-rule action; Kyverno deprecated the spec-level
          # validationFailureAction.
          failureAction: Enforce
          required: true
          mutateDigest: false
          verifyDigest: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subjectRegExp: ^https://github.com/ctlplne/probectl/\.github/workflows/release\.yml@refs/tags/.*
                    # RTO-12: pin the transparency log so keyless verification is
                    # deterministic (the GitHub Actions keyless signature is
                    # Rekor-logged); without this the tlog endpoint is implicit.
                    rekor:
                      url: https://rekor.sigstore.dev
