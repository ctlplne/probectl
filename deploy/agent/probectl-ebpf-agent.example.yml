# Example probectl-ebpf-agent configuration.
#
#   probectl-ebpf-agent -config /etc/probectl/ebpf-agent.yml
#
# The eBPF agent captures L3/L4 flows and builds a service map — observe-only
# (docs/guardrails.md G7-8). The CO-RE loader is compiled in only with
# `-tags ebpf` on Linux (clang + a BTF kernel + CAP_BPF; see docs/ebpf-agent.md).
# On any build without it, set fixture_path to replay recorded flows (the
# no-kernel path). Every key below is overridable via PROBECTL_EBPF_* env vars.

# Tenant the agent's flows belong to (F50). In production, derive this from the
# agent's SPIFFE client-cert identity (like probectl-agent); the explicit field is
# for the lightweight / single-tenant deploy.
apiVersion: probectl.io/ebpf-agent/v1
tenant_id: "00000000-0000-0000-0000-000000000001"
# agent_id: the collector identity this tenant registered for the host
# (register-collector -plane ebpf / POST /v1/collectors/register). Every record
# carries it and the control plane verifies it against the tenant's registry
# before accepting a batch (TENANT-101); unset falls back to host, which only
# the single-node lightweight mode (no registry binding) accepts. (DPR-051)
# agent_id: "e1b3987a-3dbf-4458-8726-9db9224c7af6"
# host: defaults to the OS hostname.

bus:
  mode: memory # memory | kafka
  # brokers: ["kafka:9092"]    # required for kafka mode
  # namespace: t-<tenant-slug> # the tenant's bus lane printed by the registration (DPR-049)

# Replay recorded flows instead of loading eBPF (CI / macOS / unprivileged).
# Leave empty in production to use the live CO-RE source (requires -tags ebpf).
# fixture_path: /etc/probectl/flows.json

# Replay recorded L7 events for L7 visibility without a kernel (S21). Live L7
# capture (TLS uprobes / socket parsing) otherwise requires -tags ebpf.
# l7_fixture_path: /etc/probectl/l7.json

proc_root: /proc # procfs root for process/cgroup enrichment
flush_interval: 10s # how often flows + the service map are emitted
ring_buffer_bytes: 16777216 # 16 MiB L4 kernel ring buffer (live source only)
l7_ring_buffer_bytes: 16777216 # 16 MiB TLS/plaintext L7 chunk ring (live source only)

# --- TLS-plaintext (L7) capture: OFF by default, TRIPLE-gated (U-003 + EBPF-001).
# Capture reads application plaintext on this host via OpenSSL-compatible and
# GnuTLS library uprobes, so it requires ALL THREE explicit statements;
# host-wide capture is not expressible.
# l7_capture_enabled: true
# l7_capture_consent_tenant: "00000000-0000-0000-0000-000000000001" # must equal tenant_id exactly
# l7_capture_scope:               # the opted-in workloads — enforced IN the kernel:
#   - exe:/usr/sbin/nginx         #   every process of this binary (re-resolved 10s)
#   - cgroup:/sys/fs/cgroup/system.slice/myapp.service # a container/pod IS a cgroup
#   - pid:1234                    #   one exact process
# l7_capture_redaction: metadata  # metadata (default: method, templated route, status, sizes) | headers (opt-in; tenant floor must allow) | length (no payload bytes) | full (consented debugging)
#
# D-43: the mTLS policy channel. The agent fetches its tenant's L7 redaction
# floor here and refuses capture when l7_capture_redaction is looser. Consented
# live capture REQUIRES this channel (D-43): without it capture is refused.
# Policy only — flows go to the bus. cert_file/key_file must be writable: the
# agent rotates them in place.
# control_plane:
#   grpc_addr: control.example.internal:9443
#   cert_file: /var/lib/probectl-ebpf-agent/identity/cert.pem   # the collector's SVID
#   key_file: /var/lib/probectl-ebpf-agent/identity/key.pem     # never leaves this host
#   ca_file: /var/lib/probectl-ebpf-agent/identity/server-ca.pem
#   rotate_url: https://control.example.internal:8080  # the API: the certificate is renewed here before it expires (D-43 R2)
#   # identity_seed_dir: /etc/probectl/identity-seed   # optional: a read-only registered identity that seeds cert_file/key_file
#   policy_interval: 5m
# l7_capture_kernel_window: 1024  # max plaintext bytes/chunk that may transit the kernel ring (headers mode; 128-4095)
# l7_capture_identity_header_fragments: # extra identity-like header-name fragments whose values are zeroed
#   - member
#   - viewer
# l7_capture_hash_all_header_values: false # hash every non-denied header value in headers mode; secret/identity values stay zeroed
