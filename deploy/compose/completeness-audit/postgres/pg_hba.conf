# CL-002 disposable audit: TCP is TLS-only; local socket access is for the
# container entrypoint and scoped audit probes.
local   all             all                                     trust
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::/0                    scram-sha-256
