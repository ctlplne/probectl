# Rendered-browser evaluation agent mounted by eval-synthetic.yml.
apiVersion: probectl.io/agent/v1

control_plane:
  grpc_addr: "127.0.0.1:9443"

tls:
  cert_file: /var/lib/probectl/identity/cert.pem
  key_file: /var/lib/probectl/identity/key.pem
  ca_file: /certs/ca.crt
  server_name: "localhost"

identity:
  server: "https://127.0.0.1:8443"

agent:
  capabilities: ["browser-rendered"]
  labels:
    region: eval
    site: local-browser
  heartbeat_interval: 30s

buffer:
  dir: /var/lib/probectl/buffer

artifact_store:
  dir: /var/lib/probectl/objects

browser:
  driver: browser
  worker:
    command: node
    path: /worker/worker.mjs
    step_timeout: 15s

# Central tests (G9): this canary also pulls its tenant's signed test set over
# the same mTLS connection; enroll-on-boot writes testsync.pub, which turns it
# on. See docs/configuration.md "Central tests".
test_sync:
  # D-57: this evaluation stack is a single-tenant (sovereign) install. Its
  # control plane runs the default PROBECTL_DEPLOYMENT_PROFILE=single, and the
  # operator owns both ends (this control plane and this agent), so the agent
  # may run central tests whose audited per-test exception targets private or
  # loopback addresses, such as onboarding's 127.0.0.1 first test. The agent
  # default stays false, and MSP-hosted (multi-tenant/regulated) agent configs
  # keep false, so a hosted control plane cannot make a customer's agent probe
  # that customer's internal network.
  allow_private_targets: true

canaries:
  - type: browser
    target: "https://example.com/"
    interval: 60s
    timeout: 60s
    params:
      browser_driver: browser
      script: '{"name":"render-example","start_url":"https://example.com/","steps":[{"name":"open","action":"goto"},{"name":"title","action":"assert_text","value":"Example Domain"}]}'
