# Rendered-browser evaluation agent mounted by eval-synthetic.yml.
apiVersion: probectl.io/agent/v1

control_plane:
  grpc_addr: "127.0.0.1:9443"

tls:
  cert_file: /identity/cert.pem
  key_file: /identity/key.pem
  ca_file: /certs/ca.crt
  server_name: "localhost"

identity:
  server: "https://127.0.0.1:8443"

agent:
  capabilities: ["browser-rendered"]
  labels:
    region: eval
    site: local-browser
  heartbeat_interval: 30s

buffer:
  dir: /var/lib/probectl-agent/buffer

artifact_store:
  dir: /var/lib/probectl-agent/objects

browser:
  driver: browser
  worker:
    command: node
    path: /worker/worker.mjs
    step_timeout: 15s

canaries:
  - type: browser
    target: "https://example.com/"
    interval: 60s
    timeout: 60s
    params:
      browser_driver: browser
      script: '{"name":"render-example","start_url":"https://example.com/","steps":[{"name":"open","action":"goto"},{"name":"title","action":"assert_text","value":"Example Domain"}]}'
