# Safety override for disposable integration/e2e projects. dev.yml gives its
# network the stable developer-facing name "probectl-dev"; an isolated runner
# must replace that explicit name so teardown cannot touch or join the shared
# development network.
networks:
  probectl:
    name: ${PROBECTL_ISOLATED_NETWORK:?set PROBECTL_ISOLATED_NETWORK to a disposable network name}
