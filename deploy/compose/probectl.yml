# probectl — shipped all-in-one deployment (HTTPS-by-default).
#
# Brings up the control plane behind TLS with a Postgres backing store. The API
# is exposed ONLY over HTTPS (port 8443) — there is no plaintext listener
# (docs/guardrails.md G7-12). A self-signed certificate is generated on first
# boot by `probectl-control gen-cert` (the `certgen` one-shot) for an immediate
# quickstart; production operators bring a CA-issued certificate by setting
# PROBECTL_TLS_DIR in .env to a directory holding tls.crt, tls.key and the
# issuing chain as ca.crt (DPR-008). certgen keeps a complete bundle untouched.
#
#   cp deploy/compose/.env.example deploy/compose/.env   # then edit
#   make compose-prod-up   # runs the image preflight before docker compose up
#   curl --cacert ./certs/ca.crt https://localhost:8443/readyz   # see docs/install.md
#
# This is the production-shaped stack. The local *dependency* stack for developing
# the control plane from source is deploy/compose/dev.yml.
name: probectl

services:
  postgres:
    image: postgres:16@sha256:4b7183ac05f8ef417db21fd72d71047a4238340c261d3cc3ddb6d579ab5071ae # digest-pinned (U-061)
    depends_on:
      certgen:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: probectl
      # SEC-006: REQUIRED — compose refuses to start without an operator-set
      # password (no shipped default). Set it in .env (openssl rand -base64 24).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (no default ships — SEC-006)}
      POSTGRES_DB: probectl
    # TLS on the Postgres listener (U-039): reuse the certgen-provisioned cert
    # (sslmode=require encrypts without verifying, so the self-signed quickstart
    # cert works; operators with a CA-issued cert get it automatically). The
    # key is install'ed postgres-owned 0600 as the server requires.
    command: >
      bash -c "install -o postgres -g postgres -m 600 /certs/tls.key /var/lib/postgresql/server.key
      && install -o postgres -g postgres -m 644 /certs/tls.crt /var/lib/postgresql/server.crt
      && exec docker-entrypoint.sh postgres -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${PROBECTL_TLS_DIR:-certs}:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probectl -d probectl"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks: [probectl]
    # No host port: only the control plane reaches Postgres (in-network).
    restart: unless-stopped

  # One-shot: generate a self-signed TLS cert into the shared `certs` volume if
  # one is not already present. Idempotent — re-running leaves an existing cert.
  certgen:
    # SUPPLY-001: production Compose fails closed unless the operator supplies
    # an immutable digest ref, e.g.
    # ghcr.io/ctlplne/probectl-control:v0.6.5@sha256:<release-digest>.
    # Tag-only local/mirror refs require PROBECTL_ALLOW_TAG_IMAGE.
    image: "${PROBECTL_IMAGE:?set PROBECTL_IMAGE to a digest-pinned probectl-control image ref}"
    command: ["gen-cert", "--if-missing", "/certs"]
    environment:
      PROBECTL_CERT_HOSTS: ${PROBECTL_TLS_HOSTS:-localhost,127.0.0.1}
    volumes:
      # A named volume by default; an operator certificate directory when
      # PROBECTL_TLS_DIR is set (gen-cert --if-missing leaves a complete
      # tls.crt/tls.key/ca.crt bundle untouched).
      - ${PROBECTL_TLS_DIR:-certs}:/certs
    networks: [probectl]
    restart: "no"

  # One-shot: apply schema migrations as the PRIVILEGED owner login (they do
  # CREATE SCHEMA/ROLE/EXTENSION). TEN-01: the serving control plane must NOT run
  # as this superuser — migrations and serving use different logins.
  migrate:
    image: "${PROBECTL_IMAGE:?set PROBECTL_IMAGE to a digest-pinned probectl-control image ref}"
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROBECTL_DATABASE_URL: postgres://probectl:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (no default ships — SEC-006)}@postgres:5432/probectl?sslmode=require
      PROBECTL_LOG_FORMAT: json
    networks: [probectl]
    restart: "no"

  # One-shot: provision the least-privilege runtime LOGIN role the control plane
  # serves as (TEN-01). It is NOSUPERUSER NOBYPASSRLS and a member of
  # probectl_app (created by the migrations above), so RLS is enforced on every
  # path — a superuser/BYPASSRLS serve login would silently disable tenant
  # isolation. Idempotent; runs after migrate so probectl_app exists.
  pg-appuser:
    image: postgres:16@sha256:4b7183ac05f8ef417db21fd72d71047a4238340c261d3cc3ddb6d579ab5071ae # digest-pinned (U-061)
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (no default ships — SEC-006)}
      # The least-privilege runtime DB login's password (TEN-01). Passed to psql
      # as a client variable and safe-quoted by :'app_password' in the SQL file,
      # so it is never interpolated into the SQL text.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set in .env (openssl rand -hex 24, URL-safe) — the least-privilege runtime DB login (TEN-01)}
    entrypoint:
      - bash
      - -c
      - exec psql "host=postgres user=probectl dbname=probectl sslmode=require" -v ON_ERROR_STOP=1 -v app_password="$$POSTGRES_APP_PASSWORD" -f /provision-app-login.sql
    volumes:
      - ./provision-app-login.sql:/provision-app-login.sql:ro
    networks: [probectl]
    restart: "no"

  control:
    image: "${PROBECTL_IMAGE:?set PROBECTL_IMAGE to a digest-pinned probectl-control image ref}" # SUPPLY-001: digest required, never a mutable default
    # DPR-010: any other PROBECTL_* key from docs/configuration.md (provider
    # bootstrap token, deployment profile, log level, bus/store settings, …)
    # goes in deploy/compose/control.env — an optional, operator-owned file that
    # is never committed. The explicit keys below always win over it.
    env_file:
      - path: ./control.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      certgen:
        condition: service_completed_successfully
      # TEN-01: migrations (privileged) and the runtime login are provisioned by
      # the one-shots above before the control plane serves as the least-priv role.
      pg-appuser:
        condition: service_completed_successfully
    environment:
      # HTTPS only. TLS cert/key make the listener serve TLS; HSTS is on.
      PROBECTL_HTTP_ADDR: ":8443"
      PROBECTL_TLS_CERT_FILE: /certs/tls.crt
      PROBECTL_TLS_KEY_FILE: /certs/tls.key
      PROBECTL_HSTS_ENABLED: "true"
      # TEN-01: the SERVE login is probectl_runtime — NOSUPERUSER NOBYPASSRLS, so
      # RLS is the enforced tenant boundary on every path (a superuser serve login
      # bypasses RLS and boot now fails closed). Migrations ran as the privileged
      # owner in the `migrate` one-shot, so the control plane does not migrate on
      # boot. sslmode=require (U-039): encrypted to the in-network Postgres above.
      PROBECTL_DATABASE_URL: postgres://probectl_runtime:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set in .env (openssl rand -hex 24, URL-safe) — the least-privilege runtime DB login (TEN-01)}@postgres:5432/probectl?sslmode=require
      PROBECTL_MIGRATE_ON_BOOT: "false"
      # At-rest encryption is ON BY DEFAULT (SEC-002): when PROBECTL_ENVELOPE_KEY
      # is unset, the control plane GENERATES a KEK at the key-file path on
      # first boot and persists it on the controldata volume (0600). Back that
      # volume up like key material. Provide PROBECTL_ENVELOPE_KEY explicitly
      # (e.g. from a KMS/secret manager) to override — it always wins.
      PROBECTL_ENVELOPE_KEY: ${PROBECTL_ENVELOPE_KEY:-}
      PROBECTL_ENVELOPE_KEY_FILE: ${PROBECTL_ENVELOPE_KEY_FILE:-/var/lib/probectl/envelope.key}
      # Tenant artifacts (browser screenshots/waterfalls, future object blobs)
      # live under the same operator-owned persistent volume. Lifecycle
      # export/erase inventories and deletes this exact tenant-prefixed store.
      PROBECTL_OBJECTSTORE_DIR: ${PROBECTL_OBJECTSTORE_DIR:-/var/lib/probectl/objects}
      # Stable Ed25519 identity for immutable incident evidence packages. The
      # key is generated once at 0600 on the persistent control volume.
      PROBECTL_EVIDENCE_SIGNING_KEY_FILE: ${PROBECTL_EVIDENCE_SIGNING_KEY_FILE:-/var/lib/probectl/evidence-signing-ed25519.pem}
      # Fail closed (TENANT-106): refuse to start rather than silently write
      # plaintext if no key resolves.
      PROBECTL_REQUIRE_AT_REST_ENCRYPTION: ${PROBECTL_REQUIRE_AT_REST_ENCRYPTION:-true}
      # Secure default: "session" (OIDC SSO + PROBECTL_OIDC_*) — unauthenticated
      # requests are refused. "dev" (all-access, NO auth) is an explicit opt-in
      # for local evaluation only and logs a loud startup warning.
      PROBECTL_AUTH_MODE: ${PROBECTL_AUTH_MODE:-session}
      # Session-token hashes are keyed server-side. This pepper is required in
      # the production-shaped compose stack; generate with: openssl rand -hex 32.
      PROBECTL_SESSION_HMAC_KEY: ${PROBECTL_SESSION_HMAC_KEY:?PROBECTL_SESSION_HMAC_KEY must be set in .env (openssl rand -hex 32)}
      PROBECTL_OIDC_ISSUER: ${PROBECTL_OIDC_ISSUER:-}
      PROBECTL_OIDC_CLIENT_ID: ${PROBECTL_OIDC_CLIENT_ID:-}
      PROBECTL_OIDC_CLIENT_SECRET: ${PROBECTL_OIDC_CLIENT_SECRET:-}
      PROBECTL_OIDC_REDIRECT_URL: ${PROBECTL_OIDC_REDIRECT_URL:-}
      PROBECTL_SECURITY_CONTACT: ${PROBECTL_SECURITY_CONTACT:-}
      PROBECTL_LOG_FORMAT: json
    ports:
      - "8443:8443" # HTTPS ONLY — no plaintext API port is published.
    volumes:
      - ${PROBECTL_TLS_DIR:-certs}:/certs:ro
      - controldata:/var/lib/probectl
    networks: [probectl]
    restart: unless-stopped

volumes:
  pgdata: {}
  certs: {}
  # Holds the generated at-rest envelope key (SEC-002) — back it up.
  controldata: {}

networks:
  probectl: {}
