#
# NATS + JetStream for the durable production Compose profile
# (deploy/compose/probectl.prod.yml, beta gate G2). The control plane talks to
# it with PROBECTL_BUS_MODE=nats over tls://nats:4222 (DPR-119): records live
# on disk in /data (the `natsdata` named volume) and consumer positions survive
# a restart.
#
# No secret is written here. The password arrives through the container
# environment as NATS_AUTH_PASSWORD, which the overlay passes already wrapped
# in double quotes so the NATS config parser always reads it as a string (an
# unquoted hex value such as 1e5... would otherwise parse as a number).

server_name: probectl-nats

# Client port: TLS-only (docs/guardrails.md G7-12). There is no allow_non_tls,
# so a plaintext client is refused at the handshake.
listen: "0.0.0.0:4222"

# Health endpoint for the container healthcheck only. It binds loopback INSIDE
# the NATS container's own network namespace, so nothing on the Compose network
# (or the host) can reach it; it carries health status, never telemetry.
http: "127.0.0.1:8222"

jetstream {
  store_dir: "/data"
}

tls {
  cert_file: "/run/probectl-nats/tls.crt"
  key_file: "/run/probectl-nats/tls.key"
  timeout: 5
}

authorization {
  user: "probectl"
  password: $NATS_AUTH_PASSWORD
  timeout: 5
}
