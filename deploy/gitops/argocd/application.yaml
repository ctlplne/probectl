# ArgoCD Application for probectl (S35). Point repoURL at the repo holding the chart
# (this repo, or your config repo that vendors it) and customize the host. Secrets
# are NOT inlined here: pre-create the Secret (Sealed Secrets / External Secrets
# Operator) and reference it via secrets.existingSecret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: probectl
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # SUP-23: deploy the SIGNED, immutable OCI chart the release workflow
  # publishes (oci://ghcr.io/ctlplne/charts/probectl), pinned to a released
  # version — never a moving git branch. Enforce the chart's keyless cosign
  # signature cluster-side with a sigstore policy-controller / Kyverno rule (or
  # the manual `cosign verify` in docs/ops/verify-artifacts.md) that admits only
  # the release.yml tagged-workflow identity; ArgoCD has no inline chart-verify.
  source:
    repoURL: ghcr.io/ctlplne/charts
    chart: probectl
    targetRevision: 0.6.5
    helm:
      # Pick the sizing profile (small | medium | large), and/or the provider one.
      valueFiles:
        - values-medium.yaml
      parameters:
        - name: ingress.host
          value: probectl.example.com
        - name: ingress.tlsSecretName
          value: probectl-tls
        # ingress-nginx proxy-ssl Secret in the destination namespace; include
        # tls.crt, tls.key, and ca.crt for the control listener's issuer.
        - name: ingress.backendTLS.trustSecret
          value: probectl-backend-ca
        - name: ingress.backendTLS.serverName
          value: probectl.example.com
        # AUTHZ-04: the ingress controller's pod CIDR (and any L4 LB) whose
        # forwarded client address the auth throttle keys on. Without it the
        # chart refuses to render behind the bundled ingress.
        - name: control.trustedProxies[0]
          value: 10.244.0.0/16
        # Operator-managed kubernetes.io/tls Secret; reused for pod-listener TLS.
        - name: control.tls.existingSecret
          value: probectl-tls
        # Resolve this from the signed release or approved internal mirror.
        - name: image.digest
          value: sha256:REPLACE_WITH_64_HEX_RELEASE_DIGEST
        # A Secret you manage out-of-band (envelope key, session HMAC key, DB DSN, OIDC secret).
        - name: secrets.existingSecret
          value: probectl-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: probectl
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
