# Flux HelmRelease for probectl (S35). Reconciles the signed OCI chart from the OCIRepository (SUP-23).
# Secrets are referenced via secrets.existingSecret (manage the Secret with Sealed
# Secrets / External Secrets Operator), never inlined here.
# Required keys: PROBECTL_ENVELOPE_KEY, PROBECTL_SESSION_HMAC_KEY,
# PROBECTL_DATABASE_URL, and optionally PROBECTL_OIDC_CLIENT_SECRET.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: probectl
  namespace: probectl
spec:
  interval: 10m
  releaseName: probectl
  chartRef:
    kind: OCIRepository
    name: probectl
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Merge the sizing profile + your overrides. The values below are the minimum;
  # to use a full size preset, copy values-medium.yaml here or reference it via
  # valuesFrom a ConfigMap.
  values:
    replicaCount: 3
    podDisruptionBudget:
      enabled: true
      minAvailable: 2
    ingress:
      host: probectl.example.com
      tlsSecretName: probectl-tls
      backendTLS:
        # Pre-create this proxy-ssl Secret with tls.crt, tls.key, and ca.crt.
        trustSecret: probectl-backend-ca
        serverName: probectl.example.com
    control:
      # AUTHZ-04: behind the bundled ingress every client arrives as the ingress
      # controller's pod IP, so the authentication throttle must key on the
      # forwarded client. Set this to the controller's pod CIDR (and any L4 load
      # balancer in front of it); the chart refuses to render without it.
      trustedProxies:
        - 10.244.0.0/16
      tls:
        existingSecret: probectl-tls
    image:
      # Resolve this from the signed release or approved internal mirror.
      digest: sha256:REPLACE_WITH_64_HEX_RELEASE_DIGEST
    secrets:
      existingSecret: probectl-secrets
