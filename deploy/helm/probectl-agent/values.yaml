# probectl-agent (eBPF host agent) — secure-by-default DaemonSet values.
# The privilege contract is documented in deploy/agent/README.md (U-052) and
# docs/ebpf-agent.md; this chart declares it explicitly (U-016).

image:
  repository: ghcr.io/ctlplne/probectl-ebpf-agent
  # REQUIRED for this privileged DaemonSet: pin the release tag AND digest,
  # e.g. tag: "0.4.0@sha256:<64 hex chars>". The chart refuses tag-only images
  # unless image.allowTagOnly=true is set as an explicit break-glass.
  tag: ""
  allowTagOnly: false
  pullPolicy: IfNotPresent

# SUPPLY-001 / RTO-12: privileged eBPF-agent installs render the cluster-side
# image verifier by default, not as a separate optional manifest the operator
# may forget. Kyverno must already be installed in the cluster; disabling this
# policy requires an explicit accepted-risk note and is intended only for dev or
# a replacement admission controller with equivalent cosign checks.
#
# What the policy enforces (a policies.kyverno.io/v1 ImageValidatingPolicy —
# Kyverno 1.17 or later; Kyverno 1.19 deprecates the kyverno.io/v1
# ClusterPolicy verifyImages form this chart used to render — with
# failurePolicy Fail): every Pod (and, through Kyverno's autogen, every
# DaemonSet/Deployment/... template) whose container, initContainer or
# ephemeral-container image matches `<image.repository>*` or one of
# additionalImageReferences is admitted only if the reference carries a digest
# (verifyDigest) AND that digest carries a signature from the attestor below.
# An unsigned image, a signature from another key or identity, or a tag-only
# reference is refused at admission.
#
# Install order (RTO-12): the policy must be live and Ready BEFORE the
# DaemonSet's first pod is admitted, so a chart install is two steps — apply
# this release's policy, wait for Kyverno to report it Ready, then install. See
# docs/deploying-agents.md "Image-integrity admission". Helm hooks are NOT used:
# Helm re-creates a hook object on every upgrade (delete, then create), which
# opens a window with no enforcing policy, and it never waits for a hook
# policy to become Ready.
admission:
  imageIntegrity:
    enabled: true
    acceptedRisk: ""
    policyName: probectl-agent-image-integrity
    # Enforce renders validationActions [Deny]; Audit renders [Audit] (the
    # deprecated ClusterPolicy validationFailureAction is never rendered).
    # Enforce is the default and the regulated posture. Audit admits and only
    # reports; the chart allows it only when acceptedRisk also names the
    # replacement control or approved dev exception.
    failureAction: Enforce
    background: false
    # The policy always verifies `<image.repository>*`, derived from the image
    # this chart deploys, so a mirrored or air-gapped repository
    # (registry.corp.example/mirror/probectl-ebpf-agent) is checked exactly
    # like ghcr.io. image.repository must therefore name its registry host
    # explicitly. These patterns are verified IN ADDITION (`*` matches any
    # characters, `/` included; each pattern is matched against both the raw
    # image string and its Docker-normalized form): the default catches the
    # agent image pulled from any registry that keeps the upstream path.
    additionalImageReferences:
      - "*/ctlplne/probectl-ebpf-agent*"
    # Keyless attestor (default): the tagged release.yml workflow's GitHub OIDC
    # identity, logged in the Rekor transparency log.
    issuer: https://token.actions.githubusercontent.com
    subjectRegExp: ^https://github.com/ctlplne/probectl/\.github/workflows/release\.yml@refs/tags/.*
    # Pin the transparency log so verification is deterministic.
    rekorURL: https://rekor.sigstore.dev
    # Key attestor: a PEM cosign public key. When set it REPLACES the keyless
    # attestor — for a mirror that verifies upstream, then re-signs the digest
    # with its own key (pass it with --set-file). Never a private key.
    publicKey: ""
    # Only with publicKey: accept signatures that were not uploaded to a
    # transparency log (an air-gapped signer that cannot reach Rekor). The
    # signature itself is still verified against publicKey.
    ignoreTlog: false
    # Ordering gate. lookup (default): on a real `helm install`/`helm upgrade`
    # against a cluster that serves policies.kyverno.io/v1, rendering refuses
    # unless the policy this release renders (matched by its
    # probectl.dev/policy-sha256 annotation) is already in the cluster, Kyverno
    # reports it Ready (conditionStatus.ready + WebhookConfigured), and
    # Kyverno's validating webhook serves it with failurePolicy Fail.
    # external: your deploy tool orders it instead (Argo CD sync-wave -1 plus the
    # ImageValidatingPolicy health check shipped in
    # deploy/gitops/argocd/argocd-cm-kyverno-health.yaml, Flux dependsOn +
    # healthChecks); name that
    # mechanism in externalOrdering. Needed for renderers that never contact
    # the cluster but advertise its API versions (Argo CD).
    readinessGate: lookup
    externalOrdering: ""
    # RTO-12 continuous detection, observe-only. Kyverno DELETES its own
    # resource webhooks when its admission controller is scaled to zero; from
    # then on nothing is verified while the policy still reads Ready, and the
    # readiness gate above only looks at rollout time. This CronJob runs
    # `probectl-ebpf-agent admission-check` from the agent image itself (signed,
    # digest-pinned, verified by the policy) and FAILS — a failed Job, plus one
    # ERROR log line naming the problem — when the policy is missing, stale or
    # not Ready, or no failurePolicy=Fail Kyverno webhook serves it. Alert on
    # kube_job_status_failed{job_name=~"<release>-probectl-agent-admission-check.*"}
    # (kube-state-metrics). Read-only RBAC on exactly the policy and the webhook
    # configuration; it never repairs anything.
    webhookCheck:
      enabled: true
      schedule: "*/5 * * * *"
      # Kyverno's validating resource webhook configuration (also read by the
      # readiness gate).
      kyvernoWebhookConfiguration: kyverno-resource-validating-webhook-cfg
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 64Mi }
  # EBPF-007: background/admission audit for the agent's capability posture.
  # This does not block the explicit legacy SYS_ADMIN break-glass by default;
  # it creates Kyverno policy reports when a pod runs legacy or gains any
  # capability outside the modern BPF+PERFMON pair.
  capabilityPosture:
    enabled: true
    policyName: probectl-agent-capability-posture
    # Per-rule failureAction on the validate rule: Audit reports, never blocks.
    failureAction: Audit
    background: true

# REQUIRED: the tenant every flow from these nodes belongs to (guardrail 1).
tenantID: ""

# REQUIRED: the collector identity this tenant registered for these nodes
# (DPR-051) — the agent_id printed by `register-collector -plane ebpf`,
# POST /v1/collectors/register, or Admin & Settings > Agents > Register
# collector. Every record the DaemonSet publishes carries it, and the control
# plane verifies the (tenant, agent_id) pair against the tenant's registry
# before accepting a batch (TENANT-101): an unregistered identity means every
# batch is rejected. One release = one registered collector; the node name
# still rides along as each record's host.
agentID: ""

bus:
  # kafka is the production mode. The agent REFUSES plaintext kafka unless
  # allowPlaintext is set (U-010).
  mode: kafka
  brokers: []  # REQUIRED for kafka mode, e.g. ["kafka.probectl.svc:9093"]
  # The tenant's bus lane, `t-<tenant-slug>`, printed by the registration
  # (DPR-049). Required wherever the control plane refuses the shared lane
  # (PROBECTL_INGEST_STRICT_TENANT_LANES: the multi-tenant and regulated
  # profiles); empty publishes on the shared pooled topic.
  namespace: ""
  tls:
    enabled: true
    # Secret with ca.crt for the brokers' CA (+ tls.crt/tls.key when
    # clientAuth is on).
    existingSecret: ""
    # Present the Secret's tls.crt/tls.key to the brokers (broker mTLS).
    clientAuth: false
  # SASL client authentication (plain | scram-sha-256 | scram-sha-512), the
  # user and password read from an existing Secret — never from values.
  sasl:
    mechanism: ""
    existingSecret: ""
    userKey: username
    passwordKey: password
  # Dev-only escape hatch: lab clusters without bus TLS must opt in
  # EXPLICITLY; production kafka requires TLS.
  allowPlaintext: false

# The node's tracefs, mounted read-only at the same path: attaching the
# sock:inet_sock_set_state tracepoint reads its event id there, and a container
# does not see the host's tracefs on its own (DPR-054). The legacy
# /sys/kernel/debug/tracing works for kernels that only expose it there.
tracefs:
  hostPath: /sys/kernel/tracing

# L4 kernel ring buffer. L7 TLS/plaintext chunks have their own ring under
# l7Capture.ringBufferBytes, because L4 flow bursts and L7 chunk bursts are
# separate kernel queues.
ringBufferBytes: 16777216

# Per-record bound (bytes) for one published FlowBatch. The service map is a
# CUMULATIVE snapshot that travels with every flush, so an unbounded record
# outgrows Kafka's 1 MiB message limit on a busy host within minutes — after
# which the broker rejects every flush while the agent logs "emitted" (DPR-071).
# A flush above the bound is split into several records; keep the value under
# the broker's message.max.bytes (default 1048588) with headroom.
maxBatchBytes: 786432

# TLS-plaintext L7 capture stays OFF unless enable, per-tenant consent naming
# this agent's tenant, and explicit workload scope are all set (U-003/EBPF-002).
l7Capture:
  enabled: false
  consentTenant: ""
  # Scope entries: pid:<n>, exe:/abs/path, or cgroup:/abs/cgroup-dir.
  # Host-wide capture is not expressible; the template fails when enabled
  # without at least one scoped workload.
  scope: []
  # DPR-124: TLS uprobes attach to an INODE, and this agent image is distroless
  # — it carries no libssl and no ldconfig of its own, so in-container discovery
  # finds nothing and the documented "attaches to the system TLS libraries"
  # capability is unreachable. hostRoot is the in-pod mount point for the node's
  # library tree (mounted read-only from hostLibraryPaths below), so discovery
  # resolves the node's real libssl. Set "" only for a host-installed agent.
  # Mounted ONLY when l7Capture.enabled — an agent without TLS capture consent
  # gets no view of the node filesystem at all.
  hostRoot: /host
  # Node directories mounted read-only under hostRoot. Narrow by design: the
  # uprobe target is the shared-library tree, never the whole root filesystem.
  # Trim this on a node that lacks one of them (each is mounted type:Directory,
  # so a missing path would keep the pod unscheduled).
  hostLibraryPaths:
    - /usr/lib
    - /lib
  # headers = keep protocol metadata but zero bodies + secret-bearing header
  # values and identity-like header values; length = no payload bytes; full =
  # consented debugging only.
  redaction: headers
  # Max plaintext bytes/chunk that may transit the kernel ring in headers mode.
  # 0 lets the agent default to 1024; valid explicit range is 128..4095.
  kernelWindow: 1024
  # L7 TLS chunk ring buffer size (tls_chunks). Rounded up to a valid
  # power-of-two page multiple by the agent; capped at 256 MiB.
  ringBufferBytes: 16777216
  # Extra header-name fragments whose values are identity-like and must be
  # zeroed in headers mode. Built-ins already cover user, email, subject,
  # employee, account, customer, session, and person.
  identityHeaderFragments: []
  # Replace every non-denied header value with a length-preserving sha256
  # fingerprint. Secret and identity-like header values are still zeroed.
  hashAllHeaderValues: false

# Kernel capability matrix (deploy/agent/README.md):
#   modern — kernels >= 5.8: CAP_BPF + CAP_PERFMON (the minimal pair).
#   legacy — explicit break-glass: CAP_SYS_ADMIN only when the runtime probe
#     can still prove BTF + BPF ring buffer support but the cluster cannot
#     grant the split CAP_BPF/CAP_PERFMON pair. Generic <5.8 kernels remain
#     unsupported because the agent requires BPF ring-buffer support.
capabilityMode: modern
legacyKernelRingBufferAck: ""

seccomp:
  # EBPF-003: this is a PRIVILEGED, kernel-touching agent, so the strict
  # default-deny profile (U-052) is the DEFAULT — parity with the deb/rpm
  # systemd unit's SystemCallFilter. The chart installs the profile onto each
  # node itself (installProfile, below) so Localhost works out of the box with
  # no manual node bootstrap.
  #
  # Set type: RuntimeDefault for the portable baseline (e.g. managed clusters
  # that forbid hostPath installs or pin a node-managed profile).
  type: Localhost
  localhostProfile: probectl/seccomp.json
  # installProfile runs a privileged initContainer (per node, via the
  # DaemonSet) that writes the bundled profile to the kubelet seccomp root
  # before the agent starts. Disable it if your nodes already ship the profile
  # or you manage seccomp out-of-band.
  #
  # RTO-12: the initContainer runs the AGENT image (`install-seccomp-profile`),
  # the same signed, digest-pinned image the image-integrity policy verifies;
  # there is no separate installer image to pin, mirror or trust. (The former
  # busybox default has no cosign signature, so it ran unverified;
  # seccomp.installerImage now fails the render.)
  installProfile: true
  # kubeletSeccompRoot is the node directory the kubelet resolves Localhost
  # profiles against; localhostProfile is relative to it.
  kubeletSeccompRoot: /var/lib/kubelet/seccomp

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi


# SUP-19: explicit requests+limits for the install-seccomp-profile init step.
initResources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { cpu: 250m, memory: 128Mi }
logLevel: info
logFormat: json

nodeSelector:
  kubernetes.io/os: linux
tolerations: []
priorityClassName: ""

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 10%

# OPS-001/WIRE-004: liveness/readiness probes. The secure default is exec mode:
# the agent writes state files and Kubernetes probes them with the binary, so no
# plaintext listener is opened. HTTP mode is compatibility-only and requires the
# explicit plaintext acknowledgment below.
health:
  enabled: true
  mode: exec # exec | http
  stateDir: /var/run/probectl-ebpf-agent
  port: 9090
  allowPlaintextHTTP: false

# H6: tenant-agnostic agent RED/USE metrics. The process always has a
# loopback-only listener; enabling chart scraping moves it onto the pod network
# and therefore requires TLS. The secret must contain tls.crt and tls.key.
metrics:
  enabled: false
  bindAddress: "0.0.0.0"
  port: 9467
  path: /metrics
  tls:
    existingSecret: ""
