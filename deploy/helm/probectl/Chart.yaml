apiVersion: v2
name: probectl
description: >-
  Self-hosted, multi-tenant, OpenTelemetry-native network observability control
  plane. HTTPS-by-default on the control listener and ingress, with HSTS and no
  plaintext API hop. Ships single-tenant and multi-tenant/provider references.
type: application
# Chart version (independent of the app). Bump on chart changes.
version: 0.6.4
# The probectl version this chart targets; release metadata uses this appVersion.
# OPS-008: this MUST equal the repo-root VERSION file (the single source of
# version truth) and the compose image pin — enforced by the version-consistency
# gate (cmd/probectl-control/version_consistency_test.go + scripts/check_version_consistency.sh).
appVersion: "0.6.4"
keywords:
  - observability
  - network
  - opentelemetry
  - multi-tenant
home: https://github.com/ctlplne/probectl
sources:
  - https://github.com/ctlplne/probectl
maintainers:
  - name: probectl
