{{- if .Values.backup.enabled }}
{{- if and (or .Values.backup.postgres.enabled .Values.backup.objectStore.enabled) (not .Values.backup.encryption.enabled) (ne .Values.backup.plaintextAck "allow-plaintext-tenant-backup") }}
{{- fail "plaintext Postgres/object-store backups require backup.plaintextAck=allow-plaintext-tenant-backup when backup.encryption.enabled=false" }}
{{- end }}
{{- if and .Values.backup.clickhouse.enabled (ne .Values.backup.clickhouse.encryptedTargetAck "encrypted-clickhouse-backup-target") }}
{{- fail "backup.clickhouse writes server-side .zip artifacts and requires backup.clickhouse.encryptedTargetAck=encrypted-clickhouse-backup-target" }}
{{- end }}
# DPR-091: every job script runs under bash with pipefail. Under `sh -ec` a
# failed producer (pg_dump refused, clickhouse-client error, tar error) piped
# into backup-seal still exited 0, so the CronJob sealed nothing and reported
# a successful backup. The pinned postgres/clickhouse images ship bash.
# OPS-009/H8: chart-managed PG + CH + object-store/WORM backup CronJobs (folded in from
# deploy/backup/, U-030). Behind backup.enabled — off by default; an operator
# opts in and supplies the backups PVC + db-credentials secret (or lets the
# chart create the PVC via backup.persistence).
{{- if .Values.backup.persistence.create }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "probectl.fullname" . }}-backups
  labels:
    {{- include "probectl.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size }}
  {{- with .Values.backup.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
{{- if .Values.backup.persistence.bind }}
# DPR-090: bind the backups claim now. Storage classes that bind on first
# consumer leave a chart-created claim Pending until the first CronJob run, and
# `helm --wait` fails the release on a Pending claim. This one-shot Job mounts
# the claim once per release revision; the control-plane image's `version`
# command needs no database and no shell.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "probectl.fullname" . }}-backups-bind-{{ .Release.Revision }}
  labels:
    {{- include "probectl.labels" . | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bind
          image: {{ include "probectl.image" . }}
          command: ["/usr/local/bin/app"]
          args: ["version"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - { name: backups, mountPath: /backups }
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: {{ include "probectl.fullname" . }}-backups
---
{{- end }}
{{- end }}
{{- if .Values.backup.postgres.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "probectl.fullname" . }}-postgres-backup
  labels:
    {{- include "probectl.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.postgres.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999 # the postgres image's postgres uid
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          {{- if .Values.backup.encryption.enabled }}
          # OPS-002: stage the probectl-control binary so the dump can be
          # piped straight through envelope encryption — plaintext never
          # touches the backups volume.
          initContainers:
            - name: stage-probectl
              image: {{ include "probectl.image" . }}
              securityContext:
                {{- include "probectl.jobContainerSecurityContext" . | nindent 16 }}
              command: ["/usr/local/bin/app"]
              args: ["stage-binary", "/tools/probectl-control"]
              volumeMounts:
                - { name: tools, mountPath: /tools }
          {{- end }}
          containers:
            - name: pg-dump
              image: {{ .Values.backup.postgres.image | quote }}
              securityContext:
                {{- include "probectl.jobContainerSecurityContext" . | nindent 16 }}
              command: ["/bin/bash", "-euo", "pipefail", "-c"]
              args:
                - |
                  {{- if .Values.backup.encryption.enabled }}
                  out="/backups/postgres-probectl-$(date -u +%Y%m%dT%H%M%SZ).dump.pbk"
                  trap 'rm -f "$out.tmp"' EXIT
                  pg_dump -h {{ .Values.backup.postgres.host }} -U "$PGUSER" -d {{ .Values.backup.postgres.database }} --format=custom --no-owner \
                    | /tools/probectl-control backup-seal --key-file=/keys/envelope.key > "$out.tmp"
                  test -s "$out.tmp"
                  mv "$out.tmp" "$out"
                  {{- else }}
                  out="/backups/postgres-probectl-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  echo "WARNING writing PLAINTEXT tenant backup under explicit break-glass ack backup.plaintextAck=allow-plaintext-tenant-backup / PROBECTL_PLAINTEXT_BACKUP_ACK=allow-plaintext-tenant-backup" >&2
                  pg_dump -h {{ .Values.backup.postgres.host }} -U "$PGUSER" -d {{ .Values.backup.postgres.database }} --format=custom --no-owner > "$out"
                  {{- end }}
                  sha256sum "$out" > "$out.sha256"
                  echo "wrote $out"
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: { name: {{ .Values.backup.credentialsSecret }}, key: username }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: {{ .Values.backup.credentialsSecret }}, key: password }
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - { name: backups, mountPath: /backups }
                {{- if .Values.backup.encryption.enabled }}
                - { name: tools, mountPath: /tools, readOnly: true }
                - { name: envelope-key, mountPath: /keys, readOnly: true }
                {{- end }}
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ .Values.backup.persistence.claimName | default (printf "%s-backups" (include "probectl.fullname" .)) }}
            {{- if .Values.backup.encryption.enabled }}
            - name: tools
              emptyDir: {}
            - name: envelope-key
              secret:
                secretName: {{ .Values.backup.encryption.keySecret }}
                items:
                  - { key: {{ .Values.backup.encryption.keySecretKey }}, path: envelope.key }
            {{- end }}
---
{{- end }}
{{- if .Values.backup.clickhouse.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "probectl.fullname" . }}-clickhouse-backup
  labels:
    {{- include "probectl.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.clickhouse.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 101 # the clickhouse image's clickhouse uid
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          {{- if .Values.backup.encryption.enabled }}
          initContainers:
            - name: stage-probectl
              image: {{ include "probectl.image" . }}
              securityContext:
                {{- include "probectl.jobContainerSecurityContext" . | nindent 16 }}
              command: ["/usr/local/bin/app"]
              args: ["stage-binary", "/tools/probectl-control"]
              volumeMounts:
                - { name: tools, mountPath: /tools }
          {{- end }}
          containers:
            - name: ch-backup
              image: {{ .Values.backup.clickhouse.image | quote }}
              securityContext:
                {{- include "probectl.jobContainerSecurityContext" . | nindent 16 }}
              command: ["/bin/bash", "-euo", "pipefail", "-c"]
              args:
                - |
                  # OPS-002/CRYPTO-001: ClickHouse BACKUP TO File runs
                  # SERVER-SIDE first. This job mounts the same encrypted
                  # server-visible backup PVC path, streams the resulting .zip
                  # through probectl-control backup-seal, and removes the raw
                  # staging .zip. The encrypted-target ack below is still
                  # required because that staging path briefly contains tenant
                  # telemetry.
                  name="clickhouse-probectl-$(date -u +%Y%m%dT%H%M%SZ).zip"
                  server_backup_path="{{ required "backup.clickhouse.serverBackupPath is required" .Values.backup.clickhouse.serverBackupPath }}"
                  echo "ACK encrypted ClickHouse backup target backup.clickhouse.encryptedTargetAck=encrypted-clickhouse-backup-target; artifact contains tenant telemetry" >&2
                  clickhouse-client --host {{ .Values.backup.clickhouse.host }} \
                    --user "$CH_USER" --password "$CH_PASSWORD" \
                    --query "BACKUP DATABASE {{ .Values.backup.clickhouse.database }} TO File('${server_backup_path}/$name')"
                  {{- if .Values.backup.encryption.enabled }}
                  out="${server_backup_path}/${name}.pbk"
                  cat "${server_backup_path}/${name}" \
                    | /tools/probectl-control backup-seal --key-file=/keys/envelope.key > "${out}.tmp"
                  test -s "${out}.tmp"
                  mv "${out}.tmp" "${out}"
                  rm -f "${server_backup_path}/${name}"
                  sha256sum "${out}" > "${out}.sha256"
                  echo "wrote sealed ${out}"
                  {{- else }}
                  sha256sum "${server_backup_path}/${name}" > "${server_backup_path}/${name}.sha256"
                  echo "wrote raw ${server_backup_path}/${name} under encrypted-target acknowledgement"
                  {{- end }}
              env:
                - name: CH_USER
                  valueFrom:
                    secretKeyRef: { name: {{ .Values.backup.credentialsSecret }}, key: ch-username }
                - name: CH_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: {{ .Values.backup.credentialsSecret }}, key: ch-password }
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: backups
                  mountPath: {{ required "backup.clickhouse.serverBackupPath is required" .Values.backup.clickhouse.serverBackupPath | quote }}
                {{- if .Values.backup.encryption.enabled }}
                - { name: tools, mountPath: /tools, readOnly: true }
                - { name: envelope-key, mountPath: /keys, readOnly: true }
                {{- end }}
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ .Values.backup.persistence.claimName | default (printf "%s-backups" (include "probectl.fullname" .)) }}
            {{- if .Values.backup.encryption.enabled }}
            - name: tools
              emptyDir: {}
            - name: envelope-key
              secret:
                secretName: {{ .Values.backup.encryption.keySecret }}
                items:
                  - { key: {{ .Values.backup.encryption.keySecretKey }}, path: envelope.key }
            {{- end }}
{{- end }}
{{- if .Values.backup.objectStore.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "probectl.fullname" . }}-objectstore-backup
  labels:
    {{- include "probectl.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.objectStore.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            fsGroup: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          {{- if .Values.backup.encryption.enabled }}
          initContainers:
            - name: stage-probectl
              image: {{ include "probectl.image" . }}
              securityContext:
                {{- include "probectl.jobContainerSecurityContext" . | nindent 16 }}
              command: ["/usr/local/bin/app"]
              args: ["stage-binary", "/tools/probectl-control"]
              volumeMounts:
                - { name: tools, mountPath: /tools }
          {{- end }}
          containers:
            - name: objectstore-backup
              image: {{ .Values.backup.objectStore.image | default .Values.backup.postgres.image | quote }}
              securityContext:
                {{- include "probectl.jobContainerSecurityContext" . | nindent 16 }}
              command: ["/bin/bash", "-euo", "pipefail", "-c"]
              args:
                - |
                  bad="$(find {{ .Values.backup.objectStore.mountPath | quote }} -mindepth 1 \( -type l -o \( ! -type d ! -type f \) \) -print -quit)"
                  test -z "$bad" || { echo "refusing symlink/special object-store entry: $bad" >&2; exit 1; }
                  {{- if .Values.backup.encryption.enabled }}
                  out="/backups/objectstore-$(date -u +%Y%m%dT%H%M%SZ).tar.pbk"
                  tar -C {{ .Values.backup.objectStore.mountPath | quote }} -cf - . \
                    | /tools/probectl-control backup-seal --key-file=/keys/envelope.key > "${out}.tmp"
                  test -s "${out}.tmp"
                  mv "${out}.tmp" "${out}"
                  {{- else }}
                  out="/backups/objectstore-$(date -u +%Y%m%dT%H%M%SZ).tar"
                  echo "WARNING writing PLAINTEXT object-store/WORM backup under explicit backup.plaintextAck=allow-plaintext-tenant-backup" >&2
                  tar -C {{ .Values.backup.objectStore.mountPath | quote }} -cf "${out}" .
                  {{- end }}
                  sha256sum "${out}" > "${out}.sha256"
                  echo "wrote ${out}"
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: objectstore
                  mountPath: {{ .Values.backup.objectStore.mountPath | quote }}
                  readOnly: true
                - { name: backups, mountPath: /backups }
                {{- if .Values.backup.encryption.enabled }}
                - { name: tools, mountPath: /tools, readOnly: true }
                - { name: envelope-key, mountPath: /keys, readOnly: true }
                {{- end }}
          volumes:
            - name: objectstore
              persistentVolumeClaim:
                claimName: {{ required "backup.objectStore.sourceClaim is required" .Values.backup.objectStore.sourceClaim | quote }}
            - name: backups
              persistentVolumeClaim:
                claimName: {{ .Values.backup.persistence.claimName | default (printf "%s-backups" (include "probectl.fullname" .)) }}
            {{- if .Values.backup.encryption.enabled }}
            - name: tools
              emptyDir: {}
            - name: envelope-key
              secret:
                secretName: {{ .Values.backup.encryption.keySecret }}
                items:
                  - { key: {{ .Values.backup.encryption.keySecretKey }}, path: envelope.key }
            {{- end }}
{{- end }}
{{- end }}
