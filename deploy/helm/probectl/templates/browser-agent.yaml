{{- if .Values.browserAgent.enabled }}
{{- $digest := required "browserAgent.image.digest is required when browserAgent.enabled=true" .Values.browserAgent.image.digest -}}
{{- $configSecret := required "browserAgent.configSecret is required when browserAgent.enabled=true" .Values.browserAgent.configSecret -}}
{{- if not .Values.browserAgent.networkPolicy.enabled -}}
{{- fail "browserAgent.networkPolicy.enabled must remain true when browserAgent is enabled" -}}
{{- end -}}
{{- $image := printf "%s@%s" .Values.browserAgent.image.repository $digest -}}
{{- /* SUP-02 / D-36: the agent and the Chromium worker run as SEPARATE containers
       and talk over a shared-volume UNIX socket. The agent holds the mTLS SVID;
       the renderer does not. */ -}}
{{- $workerSocket := "/run/browser-worker/worker.sock" -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "probectl.fullname" . }}-browser-agent
  labels:
    {{- include "probectl.labels" . | nindent 4 }}
    app.kubernetes.io/component: browser-agent
spec:
  selector:
    matchLabels:
      {{- include "probectl.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: browser-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        {{- include "probectl.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: browser-agent
    spec:
      serviceAccountName: {{ include "probectl.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        {{- if $.Values.assignNumericUIDs }}
        # DPR-062: pwuser in the pinned Playwright base (v1.55.1-noble) is uid
        # 1001 — noble's default user takes 1000. Run as the image's own user so
        # HOME, the browser cache and the worker files line up. SUP-11: dropped
        # when assignNumericUIDs=false so an OpenShift SCC assigns the uid.
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.browserAgent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.browserAgent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # SUP-02 / D-36: the AGENT container holds the agent's mTLS identity
        # (cert.pem / key.pem / ca.pem, via browser-config) and drives the
        # Chromium worker over the shared UNIX socket. It does NOT run a browser,
        # so a renderer compromise cannot reach this container's identity key.
        - name: browser-agent
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.browserAgent.image.pullPolicy }}
          args: ["-config", "/etc/probectl-browser/agent.yml"]
          env:
            - name: HOME
              value: /tmp/probectl-browser-home
            - name: PROBECTL_AGENT_BROWSER_DRIVER
              value: browser
            # Drive the worker over the sidecar socket (SUP-02/D-36), never as a
            # local child process. The empty command/path override the image's
            # single-container defaults so the agent cannot fall back to spawning
            # a renderer inside this identity-bearing container.
            - name: PROBECTL_AGENT_BROWSER_WORKER_SOCKET
              value: {{ $workerSocket | quote }}
            - name: PROBECTL_AGENT_BROWSER_WORKER_COMMAND
              value: ""
            - name: PROBECTL_AGENT_BROWSER_WORKER_PATH
              value: ""
            {{- range $name, $value := .Values.browserAgent.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          securityContext:
            runAsNonRoot: true
            {{- if $.Values.assignNumericUIDs }}
            runAsUser: 1001
            runAsGroup: 1001
            {{- end }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The SVID lives here — mounted ONLY in the agent container.
            - name: browser-config
              mountPath: /etc/probectl-browser
              readOnly: true
            - name: browser-worker-ipc
              mountPath: /run/browser-worker
            - name: agent-tmp
              mountPath: /tmp
            {{- with .Values.browserAgent.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        # SUP-02 / D-36: the WORKER container runs headless Chromium over
        # UNTRUSTED web content and holds NO agent identity — browser-config
        # (cert.pem / key.pem / ca.pem) is deliberately NOT mounted here, so a
        # browser RCE cannot exfiltrate the agent's mTLS key. It reaches the agent
        # only over the shared socket. Chromium's own sandbox stays disabled
        # (the hardened pod forbids the privileges it needs — see worker.mjs);
        # this container's locked-down securityContext is the isolation boundary.
        - name: browser-worker
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.browserAgent.image.pullPolicy }}
          command: ["node", "/worker/worker.mjs"]
          env:
            - name: HOME
              value: /tmp/probectl-browser-home
            - name: PROBECTL_BROWSER_WORKER_SOCKET
              value: {{ $workerSocket | quote }}
          resources:
            {{- toYaml .Values.browserAgent.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            {{- if $.Values.assignNumericUIDs }}
            # SUP-11: pwuser is uid 1001 in the pinned Playwright base; uid 1000
            # there is `ubuntu` (groups adm, sudo). Match the pod's 1001 so the
            # worker runs as pwuser, not the sudo-capable default user. Dropped
            # when assignNumericUIDs=false (OpenShift SCC assigns it).
            runAsUser: 1001
            runAsGroup: 1001
            {{- end }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: browser-worker-ipc
              mountPath: /run/browser-worker
            - name: browser-tmp
              mountPath: /tmp
            - name: browser-shm
              mountPath: /dev/shm
      volumes:
        - name: browser-config
          secret:
            secretName: {{ $configSecret | quote }}
            items:
              - key: {{ .Values.browserAgent.configKey | quote }}
                path: agent.yml
              - key: cert.pem
                path: cert.pem
              - key: key.pem
                path: key.pem
                # Projected Secrets are owned by root; fsGroup=1001 makes this
                # group-readable by the non-root agent without making it public.
                mode: 0440
              - key: ca.pem
                path: ca.pem
        # SUP-02/D-36: the agent↔worker IPC socket — shared between the two
        # containers, holds no identity, never leaves the pod.
        - name: browser-worker-ipc
          emptyDir: {}
        - name: agent-tmp
          emptyDir: {}
        - name: browser-tmp
          emptyDir: {}
        - name: browser-shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        {{- with .Values.browserAgent.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
