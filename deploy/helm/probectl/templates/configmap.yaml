{{- $extraEnv := .Values.control.extraEnv | default dict -}}
{{- $reservedControlEnv := list
  "PROBECTL_REQUIRE_AT_REST_ENCRYPTION"
  "PROBECTL_PUBLIC_TLS"
  "PROBECTL_ALLOW_PLAINTEXT_HTTP"
  "PROBECTL_HTTP_ADDR"
  "PROBECTL_TLS_CERT_FILE"
  "PROBECTL_TLS_KEY_FILE"
  "PROBECTL_HSTS_ENABLED"
  "PROBECTL_HSTS_MAX_AGE"
  "PROBECTL_LOG_FORMAT"
  "PROBECTL_LOG_LEVEL"
  "PROBECTL_AUTH_MODE"
  "PROBECTL_SECURITY_CONTACT"
  "PROBECTL_OBJECTSTORE_DIR"
  "PROBECTL_OIDC_ISSUER"
  "PROBECTL_OIDC_CLIENT_ID"
  "PROBECTL_OIDC_REDIRECT_URL"
  "PROBECTL_ENVELOPE_KEY"
  "PROBECTL_SESSION_HMAC_KEY"
  "PROBECTL_DATABASE_URL"
  "PROBECTL_OIDC_CLIENT_SECRET"
  "PROBECTL_WORM_SIGNING_KEY"
  "PROBECTL_IR_UNLOCK_KEY"
-}}
{{- range $envName := $reservedControlEnv -}}
{{- if hasKey $extraEnv $envName -}}
{{- fail (printf "control.extraEnv.%s is reserved; configure it through the chart's typed value or Secret" $envName) -}}
{{- end -}}
{{- end -}}
{{- $wormDirValue := get $extraEnv "PROBECTL_AUDIT_WORM_DIR" -}}
{{- if $wormDirValue -}}
{{- $wormDir := printf "%v" $wormDirValue -}}
{{- $objectStoreMount := printf "%v" .Values.objectStore.mountPath -}}
{{- if not .Values.objectStore.enabled -}}
{{- fail "PROBECTL_AUDIT_WORM_DIR requires objectStore.enabled=true so signed audit segments have a mounted durable store (CONFIG-09e06212)" -}}
{{- end -}}
{{- if not (trim .Values.objectStore.existingClaim) -}}
{{- fail "PROBECTL_AUDIT_WORM_DIR requires a non-empty objectStore.existingClaim; emptyDir is never durable WORM storage (CONFIG-09e06212)" -}}
{{- end -}}
{{- if or (not (isAbs $wormDir)) (ne (clean $wormDir) $wormDir) -}}
{{- fail "PROBECTL_AUDIT_WORM_DIR must be an absolute, canonical, traversal-free path (CONFIG-09e06212)" -}}
{{- end -}}
{{- if or (not (isAbs $objectStoreMount)) (ne (clean $objectStoreMount) $objectStoreMount) -}}
{{- fail "objectStore.mountPath must be an absolute, canonical, traversal-free path when WORM export is enabled (CONFIG-09e06212)" -}}
{{- end -}}
{{- if and (ne $wormDir $objectStoreMount) (not (hasPrefix (printf "%s/" $objectStoreMount) $wormDir)) -}}
{{- fail "PROBECTL_AUDIT_WORM_DIR must equal objectStore.mountPath or be contained beneath it (CONFIG-09e06212)" -}}
{{- end -}}
{{- $haWorm := gt (int .Values.replicaCount) 1 -}}
{{- if and .Values.autoscaling.enabled (gt (int .Values.autoscaling.maxReplicas) 1) -}}
{{- $haWorm = true -}}
{{- end -}}
{{- if $haWorm -}}
{{- if not (trim .Values.secrets.existingSecret) -}}
{{- fail "multi-replica WORM export requires secrets.existingSecret with a shared PROBECTL_WORM_SIGNING_KEY (CONFIG-09e06212)" -}}
{{- end -}}
{{- if get $extraEnv "PROBECTL_WORM_SIGNING_KEY_FILE" -}}
{{- fail "multi-replica WORM export forbids PROBECTL_WORM_SIGNING_KEY_FILE; inject one shared PROBECTL_WORM_SIGNING_KEY through secrets.existingSecret (CONFIG-09e06212)" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $profile := default "single" (get $extraEnv "PROBECTL_DEPLOYMENT_PROFILE") -}}
{{- if or (eq $profile "multi-tenant") (eq $profile "regulated") -}}
{{- $databaseURL := default "" .Values.database.url -}}
{{- if not (regexMatch "[?&]sslmode=(require|verify-ca|verify-full)(&|$)" $databaseURL) -}}
{{- fail (printf "PROBECTL_DEPLOYMENT_PROFILE=%s requires database.url with PostgreSQL TLS sslmode=require, verify-ca, or verify-full (WIRE-001)" $profile) -}}
{{- end -}}
{{- with (get $extraEnv "PROBECTL_DATABASE_READ_URL") -}}
{{- $readURL := printf "%v" . -}}
{{- if and $readURL (not (regexMatch "[?&]sslmode=(require|verify-ca|verify-full)(&|$)" $readURL)) -}}
{{- fail (printf "PROBECTL_DEPLOYMENT_PROFILE=%s requires PROBECTL_DATABASE_READ_URL with PostgreSQL TLS sslmode=require, verify-ca, or verify-full (WIRE-001)" $profile) -}}
{{- end -}}
{{- end -}}
{{- range $envName := list "PROBECTL_PATHSTORE_URL" "PROBECTL_FLOWSTORE_URL" "PROBECTL_OTELSTORE_URL" "PROBECTL_EBPFSTORE_URL" "PROBECTL_ENDPOINTSTORE_URL" -}}
{{- with (get $extraEnv $envName) -}}
{{- $chURL := printf "%v" . -}}
{{- if and $chURL (not (regexMatch "^https://" $chURL)) -}}
{{- fail (printf "PROBECTL_DEPLOYMENT_PROFILE=%s requires %s to be an https:// ClickHouse endpoint (WIRE-001)" $profile $envName) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- with (get $extraEnv "PROBECTL_DATAPLANES") -}}
{{- $dataPlanes := printf "%v" . -}}
{{- if regexMatch "(^|[=;])http://" $dataPlanes -}}
{{- fail (printf "PROBECTL_DEPLOYMENT_PROFILE=%s requires PROBECTL_DATAPLANES entries to use https:// ClickHouse endpoints (WIRE-001)" $profile) -}}
{{- end -}}
{{- end -}}
{{- if eq (printf "%v" (get $extraEnv "PROBECTL_AUDIT_RETENTION")) "0" -}}
{{- fail (printf "PROBECTL_DEPLOYMENT_PROFILE=%s requires finite PROBECTL_AUDIT_RETENTION; omit it for the 8760h default or set a positive duration (PRIVACY-001)" $profile) -}}
{{- end -}}
{{- if not (get $extraEnv "PROBECTL_AUDIT_WORM_DIR") -}}
{{- fail (printf "PROBECTL_DEPLOYMENT_PROFILE=%s requires PROBECTL_AUDIT_WORM_DIR so provider audit retention has a WORM export watermark (PRIVACY-001)" $profile) -}}
{{- end -}}
{{- if and (not (get $extraEnv "PROBECTL_WORM_SIGNING_KEY_FILE")) (not .Values.secrets.existingSecret) -}}
{{- fail (printf "PROBECTL_DEPLOYMENT_PROFILE=%s requires PROBECTL_WORM_SIGNING_KEY_FILE or a secrets.existingSecret containing PROBECTL_WORM_SIGNING_KEY for stable WORM watermarks (PRIVACY-001)" $profile) -}}
{{- end -}}
{{- if ne (printf "%v" (get $extraEnv "PROBECTL_SIEM_ENABLED")) "true" -}}
{{- fail (printf "PROBECTL_DEPLOYMENT_PROFILE=%s requires PROBECTL_SIEM_ENABLED=true so tenant audit retention has SIEM delivery watermarks (PRIVACY-001)" $profile) -}}
{{- end -}}
{{- if not (get $extraEnv "PROBECTL_SIEM_ENDPOINT") -}}
{{- fail (printf "PROBECTL_DEPLOYMENT_PROFILE=%s requires PROBECTL_SIEM_ENDPOINT so tenant audit retention has SIEM delivery watermarks (PRIVACY-001)" $profile) -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "probectl.fullname" . }}-config
  labels:
    {{- include "probectl.labels" . | nindent 4 }}
data:
  # Fail closed (TENANT-106/SEC-002): never silently write plaintext at rest.
  PROBECTL_REQUIRE_AT_REST_ENCRYPTION: {{ .Values.requireAtRestEncryption | quote }}
  # SEC-009: both the public ingress and the app listener serve TLS, so cookies
  # remain protected on the ingress-to-pod hop too.
  PROBECTL_PUBLIC_TLS: {{ .Values.publicTLS | quote }}
  # WIRE-004: plaintext stays disabled when the required TLS listener is active.
  PROBECTL_ALLOW_PLAINTEXT_HTTP: {{ and (not .Values.control.tls.enabled) .Values.allowPlaintextHTTP | quote }}
  PROBECTL_HTTP_ADDR: ":8080"
  {{- if .Values.control.tls.enabled }}
  # RUNOPS-004: the control process terminates TLS, so ServiceMonitor, probes,
  # Service, and ingress all target the same HTTPS listener.
  PROBECTL_TLS_CERT_FILE: "{{ .Values.control.tls.mountPath }}/tls.crt"
  PROBECTL_TLS_KEY_FILE: "{{ .Values.control.tls.mountPath }}/tls.key"
  {{- end }}
  # OPS-009: HSTS is emitted by the application (the header passes through the
  # ingress), NOT via a configuration-snippet annotation that modern
  # ingress-nginx disables by default. The max-age tracks the chart's
  # ingress.hstsMaxAge so operators tune one value.
  PROBECTL_HSTS_ENABLED: "true"
  PROBECTL_HSTS_MAX_AGE: {{ printf "%ds" (int64 .Values.ingress.hstsMaxAge) | quote }}
  PROBECTL_LOG_FORMAT: {{ .Values.control.logFormat | quote }}
  PROBECTL_LOG_LEVEL: {{ .Values.control.logLevel | quote }}
  PROBECTL_AUTH_MODE: {{ .Values.control.authMode | quote }}
  PROBECTL_SECURITY_CONTACT: {{ .Values.control.securityContact | quote }}
  {{- if .Values.objectStore.enabled }}
  PROBECTL_OBJECTSTORE_DIR: {{ .Values.objectStore.mountPath | quote }}
  {{- end }}
  {{- if .Values.oidc.issuer }}
  PROBECTL_OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  PROBECTL_OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  PROBECTL_OIDC_REDIRECT_URL: {{ .Values.oidc.redirectUrl | quote }}
  {{- end }}
  {{- range $k, $v := .Values.control.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
