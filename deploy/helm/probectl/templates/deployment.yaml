apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "probectl.fullname" . }}
  labels:
    {{- include "probectl.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "probectl.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "probectl.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control
      annotations:
        # Roll the pods when non-secret config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "probectl.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.migrateOnBoot .Values.control.credentialFiles.existingSecret (and .Values.control.agentListener.enabled (not (include "probectl.agentListener.caSecret" .))) }}
      initContainers:
        {{- if .Values.control.credentialFiles.existingSecret }}
        # DPR-030: stage operator credential files as private mode-0600 regular
        # files owned by the runtime user; a projected Secret volume cannot be.
        - name: stage-credentials
          image: {{ include "probectl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/app"]
          args: ["stage-credentials", "/etc/probectl/credentials-source", {{ .Values.control.credentialFiles.mountPath | quote }}]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: credentials-source
              mountPath: /etc/probectl/credentials-source
              readOnly: true
            - name: credentials
              mountPath: {{ .Values.control.credentialFiles.mountPath | quote }}
        {{- end }}
        {{- if .Values.migrateOnBoot }}
        - name: migrate
          image: {{ include "probectl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: {{ include "probectl.fullname" . }}-config
            - secretRef:
                name: {{ include "probectl.secretName" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.control.trustBundle.existingConfigMap }}
          env:
            # DPR-026: the migration reaches the database with the same trust.
            - name: SSL_CERT_FILE
              value: {{ printf "%s/%s" .Values.control.trustBundle.mountPath .Values.control.trustBundle.key | quote }}
          {{- end }}
          {{- if or .Values.control.tls.enabled .Values.control.trustBundle.existingConfigMap .Values.control.credentialFiles.existingSecret }}
          volumeMounts:
            {{- if .Values.control.tls.enabled }}
            - name: control-tls
              mountPath: {{ .Values.control.tls.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.control.trustBundle.existingConfigMap }}
            - name: trust-bundle
              mountPath: {{ .Values.control.trustBundle.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.control.credentialFiles.existingSecret }}
            - name: credentials
              mountPath: {{ .Values.control.credentialFiles.mountPath | quote }}
              readOnly: true
            {{- end }}
          {{- end }}
        {{- end }}
        {{- if and .Values.control.agentListener.enabled (not (include "probectl.agentListener.caSecret" .)) }}
        # DPR-046: export the agent CA's PUBLIC trust bundle from the database
        # into a memory volume so the listener can verify enrolling agents.
        # Fails (and keeps the pod from serving) until `agent-ca init` has run.
        - name: export-agent-ca
          image: {{ include "probectl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["agent-ca", "export", {{ include "probectl.agentListener.caFile" . | quote }}]
          envFrom:
            - configMapRef:
                name: {{ include "probectl.fullname" . }}-config
            - secretRef:
                name: {{ include "probectl.secretName" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.control.trustBundle.existingConfigMap }}
          env:
            - name: SSL_CERT_FILE
              value: {{ printf "%s/%s" .Values.control.trustBundle.mountPath .Values.control.trustBundle.key | quote }}
          {{- end }}
          volumeMounts:
            - name: agent-ca
              mountPath: {{ include "probectl.agentListener.caMountPath" . | quote }}
            {{- if .Values.control.trustBundle.existingConfigMap }}
            - name: trust-bundle
              mountPath: {{ .Values.control.trustBundle.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.control.credentialFiles.existingSecret }}
            - name: credentials
              mountPath: {{ .Values.control.credentialFiles.mountPath | quote }}
              readOnly: true
            {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: control
          image: {{ include "probectl.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: {{ include "probectl.servicePortName" . }}
              containerPort: 8080
            {{- if .Values.control.agentListener.enabled }}
            - name: agent-grpc
              containerPort: {{ include "probectl.agentListener.port" . }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "probectl.fullname" . }}-config
            - secretRef:
                name: {{ include "probectl.secretName" . }}
          {{- if or .Values.license.existingSecret .Values.control.trustBundle.existingConfigMap (.Values.control.slo | default dict).existingConfigMap }}
          env:
            {{- if (.Values.control.slo | default dict).existingConfigMap }}
            # DPR-064: OpenSLO definitions, mounted from the operator's ConfigMap.
            # The path defaults here too: a --reuse-values upgrade from a release
            # that predates control.slo carries no mountPath.
            - name: PROBECTL_SLO_DIR
              value: {{ (.Values.control.slo | default dict).mountPath | default "/etc/probectl/slo" | quote }}
            {{- end }}
            {{- if .Values.license.existingSecret }}
            # DPR-006: the offline-signed Enterprise/MSP license, verified locally.
            - name: PROBECTL_LICENSE_FILE
              value: {{ printf "%s/%s" .Values.license.mountPath .Values.license.key | quote }}
            {{- end }}
            {{- if .Values.control.trustBundle.existingConfigMap }}
            # DPR-026: operator CA bundle for outbound TLS (IdP, database, SIEM, CMDB).
            - name: SSL_CERT_FILE
              value: {{ printf "%s/%s" .Values.control.trustBundle.mountPath .Values.control.trustBundle.key | quote }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ include "probectl.servicePortName" . }}
              scheme: {{ include "probectl.probeScheme" . }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ include "probectl.servicePortName" . }}
              scheme: {{ include "probectl.probeScheme" . }}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if or .Values.control.tls.enabled (and .Values.objectStore.enabled (eq .Values.objectStore.mode "filesystem")) (((.Values.audit | default dict).worm | default dict).enabled) .Values.license.existingSecret .Values.control.trustBundle.existingConfigMap .Values.control.credentialFiles.existingSecret .Values.control.agentListener.enabled (.Values.control.slo | default dict).existingConfigMap .Values.control.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.control.tls.enabled }}
            - name: control-tls
              mountPath: {{ .Values.control.tls.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.control.agentListener.enabled }}
            - name: agent-ca
              mountPath: {{ include "probectl.agentListener.caMountPath" . | quote }}
              readOnly: true
            {{- end }}
            {{- if (.Values.control.slo | default dict).existingConfigMap }}
            - name: slo-definitions
              mountPath: {{ (.Values.control.slo | default dict).mountPath | default "/etc/probectl/slo" | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.control.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.control.trustBundle.existingConfigMap }}
            - name: trust-bundle
              mountPath: {{ .Values.control.trustBundle.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.control.credentialFiles.existingSecret }}
            - name: credentials
              mountPath: {{ .Values.control.credentialFiles.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if and .Values.objectStore.enabled (eq .Values.objectStore.mode "filesystem") }}
            - name: tenant-objects
              mountPath: {{ .Values.objectStore.mountPath | quote }}
            {{- end }}
            {{- if ((.Values.audit | default dict).worm | default dict).enabled }}
            # DPR-116: the WORM segments' own object-lock claim.
            - name: audit-worm
              mountPath: {{ default "/var/lib/probectl/audit-worm" .Values.audit.worm.mountPath | quote }}
            {{- end }}
            {{- if .Values.license.existingSecret }}
            - name: license
              mountPath: {{ .Values.license.mountPath | quote }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.control.tls.enabled (and .Values.objectStore.enabled (eq .Values.objectStore.mode "filesystem")) (((.Values.audit | default dict).worm | default dict).enabled) .Values.license.existingSecret .Values.control.trustBundle.existingConfigMap .Values.control.credentialFiles.existingSecret .Values.control.agentListener.enabled (.Values.control.slo | default dict).existingConfigMap .Values.control.extraVolumes }}
      volumes:
        {{- if (.Values.control.slo | default dict).existingConfigMap }}
        # DPR-064: OpenSLO definitions (every key of the ConfigMap is a file).
        - name: slo-definitions
          configMap:
            name: {{ (.Values.control.slo | default dict).existingConfigMap | quote }}
        {{- end }}
        {{- with .Values.control.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.control.agentListener.enabled }}
        - name: agent-ca
          {{- if (include "probectl.agentListener.caSecret" .) }}
          secret:
            secretName: {{ include "probectl.agentListener.caSecret" . | quote }}
            items:
              - key: {{ include "probectl.agentListener.caKey" . | quote }}
                path: {{ include "probectl.agentListener.caKey" . | quote }}
          {{- else }}
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
          {{- end }}
        {{- end }}
        {{- if .Values.control.credentialFiles.existingSecret }}
        - name: credentials-source
          secret:
            secretName: {{ .Values.control.credentialFiles.existingSecret | quote }}
            defaultMode: 0400
        - name: credentials
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
        {{- if .Values.control.trustBundle.existingConfigMap }}
        - name: trust-bundle
          configMap:
            name: {{ .Values.control.trustBundle.existingConfigMap | quote }}
            items:
              - key: {{ .Values.control.trustBundle.key | quote }}
                path: {{ .Values.control.trustBundle.key | quote }}
        {{- end }}
        {{- if .Values.license.existingSecret }}
        - name: license
          secret:
            secretName: {{ .Values.license.existingSecret | quote }}
            items:
              - key: {{ .Values.license.key | quote }}
                path: {{ .Values.license.key | quote }}
        {{- end }}
        {{- if .Values.control.tls.enabled }}
        - name: control-tls
          secret:
            secretName: {{ required "control.tls.existingSecret is required when control.tls.enabled=true" .Values.control.tls.existingSecret | quote }}
            items:
              - key: {{ .Values.control.tls.certKey | quote }}
                path: tls.crt
              - key: {{ .Values.control.tls.keyKey | quote }}
                path: tls.key
        {{- end }}
        {{- if and .Values.objectStore.enabled (eq .Values.objectStore.mode "filesystem") }}
        - name: tenant-objects
          {{- if .Values.objectStore.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.objectStore.existingClaim | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if ((.Values.audit | default dict).worm | default dict).enabled }}
        # DPR-116: WORM segments live on their own object-lock claim, whatever
        # the tenant artifact store is doing.
        - name: audit-worm
          persistentVolumeClaim:
            claimName: {{ required "audit.worm.existingClaim is required when audit.worm.enabled=true" .Values.audit.worm.existingClaim | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
