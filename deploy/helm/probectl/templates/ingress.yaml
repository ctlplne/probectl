{{- if .Values.ingress.enabled }}
{{- $ingressClassName := required "ingress.className is required and must be nginx when ingress is enabled" .Values.ingress.className -}}
{{- if ne $ingressClassName "nginx" }}
{{- fail (printf "ingress.className %q is unsupported: the chart's verified backend TLS contract requires nginx" $ingressClassName) }}
{{- end }}
{{- $ingressAnnotations := .Values.ingress.annotations | default dict -}}
{{- range $annotation := list
  "nginx.ingress.kubernetes.io/ssl-redirect"
  "nginx.ingress.kubernetes.io/force-ssl-redirect"
  "nginx.ingress.kubernetes.io/backend-protocol"
  "nginx.ingress.kubernetes.io/proxy-ssl-verify"
  "nginx.ingress.kubernetes.io/proxy-ssl-secret"
  "nginx.ingress.kubernetes.io/proxy-ssl-server-name"
  "nginx.ingress.kubernetes.io/proxy-ssl-name"
-}}
{{- if hasKey $ingressAnnotations $annotation }}
{{- fail (printf "ingress.annotations[%s] is reserved by the chart's verified TLS contract" $annotation) }}
{{- end }}
{{- end }}
{{- if not .Values.ingress.tlsSecretName }}
{{- fail "ingress.tlsSecretName is required (HTTPS-by-default): provide a TLS secret or use cert-manager" }}
{{- end }}
{{- $backendTrustSecret := "" -}}
{{- $backendServerName := "" -}}
{{- if .Values.control.tls.enabled }}
{{- $backendTrustSecret = required "ingress.backendTLS.trustSecret is required when ingress and control TLS are enabled" .Values.ingress.backendTLS.trustSecret -}}
{{- $backendServerName = required "ingress.backendTLS.serverName is required when ingress and control TLS are enabled" .Values.ingress.backendTLS.serverName -}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "probectl.fullname" . }}
  labels:
    {{- include "probectl.labels" . | nindent 4 }}
  annotations:
    # HTTPS-by-default: force redirect to TLS. These are first-class
    # ingress-nginx annotations (NOT snippet annotations), so they apply even
    # when allow-snippet-annotations is false (the default since ingress-nginx
    # v1.9, post CVE-2023-5043/5044).
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # OPS-009: HSTS is emitted by the APPLICATION (PROBECTL_HSTS_ENABLED, wired
    # from the ConfigMap; the header passes straight through the ingress) rather
    # than via a configuration-snippet annotation — modern ingress-nginx ignores
    # snippet annotations by default, so a snippet-delivered HSTS would silently
    # vanish. The app path is on-by-default and ingress-controller-agnostic.
    {{- if .Values.control.tls.enabled }}
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    # CRYPTO-bced5da5: encrypting the backend hop is insufficient unless the
    # ingress controller also verifies the control listener's chain and name.
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-secret: {{ printf "%s/%s" .Release.Namespace $backendTrustSecret | quote }}
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: {{ $backendServerName | quote }}
    {{- end }}
    {{- with $ingressAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ $ingressClassName | quote }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "probectl.fullname" . }}
                port:
                  name: {{ include "probectl.servicePortName" . }}
{{- end }}
