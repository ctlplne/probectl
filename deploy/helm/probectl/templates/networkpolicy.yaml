{{- if .Values.networkPolicy.enabled }}
{{- if empty .Values.networkPolicy.ingressFrom }}
{{- fail "networkPolicy.ingressFrom must name at least one ingress-controller source when networkPolicy.enabled=true (WIRE-002: do not expose the in-cluster API broadly)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "probectl.fullname" . }}
  labels:
    {{- include "probectl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "probectl.controlSelectorLabels" . | nindent 6 }}
  # Default-deny: selecting both policy types with the rules below means anything
  # not explicitly allowed is dropped.
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
      from:
        {{- with .Values.networkPolicy.ingressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.browserAgent.enabled }}
        # This release's OWN browser agent enrols and rotates through this port
        # too, and the chart knows both ends, so it is named here rather than
        # left to an operator to guess.
        - podSelector:
            matchLabels:
              {{- include "probectl.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: browser-agent
        {{- end }}
        {{- with .Values.networkPolicy.agentEnrollmentFrom }}
        # DPR-174: agent enrolment and identity ROTATION are HTTP endpoints on
        # this port, and rotation cannot use the mTLS listener because the
        # certificate it exists to replace is the one about to expire. Without a
        # path here, every in-cluster agent dies one identity lifetime after it
        # enrols.
        {{- toYaml . | nindent 8 }}
        {{- end }}
    {{- if .Values.control.agentListener.enabled }}
    # DPR-046: producers reach the mTLS listener from customer networks; the
    # SVID handshake is the authentication, so the default source is any.
    - ports:
        - protocol: TCP
          port: {{ include "probectl.agentListener.port" . }}
      {{- with .Values.control.agentListener.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- if eq (include "probectl.otlp.enabled" .) "true" }}
    {{- if empty .Values.control.otlp.ingressFrom }}
    {{- fail "control.otlp.ingressFrom must name at least one collector source when the OTLP receiver is enabled with networkPolicy.enabled=true — the ingest surface is not the API and its sources are named deliberately (DPR-117)" }}
    {{- end }}
    # DPR-117: OTLP ingest from the named collectors only. The per-tenant token
    # is the authentication; this is the network boundary around it.
    - ports:
        {{- if .Values.control.otlp.httpPort }}
        - protocol: TCP
          port: {{ int .Values.control.otlp.httpPort }}
        {{- end }}
        {{- if .Values.control.otlp.grpcPort }}
        - protocol: TCP
          port: {{ int .Values.control.otlp.grpcPort }}
        {{- end }}
      from:
        {{- toYaml .Values.control.otlp.ingressFrom | nindent 8 }}
    {{- end }}
  egress:
    # DNS is always required (cluster service discovery).
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with .Values.networkPolicy.egressTo }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    # No explicit egress allow-list configured ⇒ permit all other egress (the
    # datastores/bus/IdP/feeds are reachable). Tighten this in production by
    # setting networkPolicy.egressTo.
    - {}
    {{- end }}
{{- end }}
