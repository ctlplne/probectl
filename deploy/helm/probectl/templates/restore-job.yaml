{{- if .Values.restore.enabled }}
{{- $restoreBackupFile := required "restore.backupFile is required when restore.enabled=true" .Values.restore.backupFile }}
# OPS-007: parameterized restore Job for Kubernetes, mirroring the compose
# restore scripts (verify checksum → backup-open to ephemeral workdir → drop →
# restore → migrate → readyz).
# It is a one-shot Job (NOT a CronJob): an operator sets restore.enabled=true
# and restore.backupFile to the sealed dump on the backups PVC, applies, and
# deletes it after. Drilled on kind in CI (the backup-drill job) so the path
# can't silently rot. See docs/ops/backup-restore.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "probectl.fullname" . }}-restore
  labels:
    {{- include "probectl.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook-weight": "0"
spec:
  backoffLimit: 0   # a restore must not silently retry-and-clobber; fail loud
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        # DPR-088: runAsNonRoot alone cannot start the root-default postgres image;
        # pin the image's postgres uid, as the backup CronJob does.
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Stage the control-plane binary so backup-open can decrypt the sealed
        # dump into the restore-only emptyDir after checksum verification —
        # plaintext never lands on the backups PVC (OPS-002 symmetry).
        - name: stage-probectl
          image: {{ include "probectl.image" . }}
          securityContext:
            {{- include "probectl.jobContainerSecurityContext" . | nindent 12 }}
          # The control-plane image installs its single static binary at
          # /usr/local/bin/app (deploy/docker/Dockerfile); stage it under a
          # stable name the restore container invokes.
          command: ["/usr/local/bin/app"]
          args: ["stage-binary", "/shared/probectl-control"]
          volumeMounts:
            - { name: shared, mountPath: /shared }
      containers:
        - name: restore
          {{- /* SUPPLY-006: default to the SAME digest-pinned ref as the backup
             CronJob (values.yaml backup.postgres.image), never a tag-only
             postgres:16 — a mutable tag drifts the restore tool out from under a
             sealed dump. An operator override is still honoured. */}}
          image: {{ .Values.restore.image | default .Values.backup.postgres.image }}
          securityContext:
            {{- include "probectl.jobContainerSecurityContext" . | nindent 12 }}
          command: ["/bin/bash", "-euo", "pipefail", "-c"]
          args:
            - |
              echo "restore: verifying backup is readable…"
              backup_file="{{ $restoreBackupFile }}"
              backup="/backups/${backup_file}"
              sha="${backup}.sha256"
              work="/restore-work/postgres.dump"
              trap 'rm -f "${work}"' EXIT
              test -s "${backup}"
              test -s "${sha}"
              (cd /backups && sha256sum -c "${backup_file}.sha256" >/dev/null)
              echo "restore: checksum verified"
              echo "restore: decrypting into an ephemeral work volume…"
              # backup-open is a stdin→stdout decryption filter; it takes the KEK
              # from PROBECTL_ENVELOPE_KEY (env, below) — it has NO --in/--out flags.
              /shared/probectl-control backup-open < "${backup}" > "${work}"
              test -s "${work}"
              echo "restore: restoring into ${PGDATABASE} on ${PGHOST}:${PGPORT}…"
              pg_restore --clean --if-exists --no-owner \
                -h "${PGHOST}" -p "${PGPORT}" -U "$PGUSER" -d "${PGDATABASE}" \
                "${work}"
              echo "restore: applying migrations to ${PGDATABASE} (idempotent)…"
              # DPR-107: migrate the database this Job just restored, never the
              # release's live DSN — restore.host/restore.database exist so a
              # rehearsal can land in a scratch database, and a migrate against
              # the live URL would both miss the restored copy and touch
              # production. Credentials stay in PGUSER/PGPASSWORD, never in the
              # URL (§7.6); the driver reads them from the environment.
              export PROBECTL_DATABASE_URL="postgres://${PGHOST}:${PGPORT}/${PGDATABASE}"
              /shared/probectl-control migrate
              echo "restore: done. Verify /readyz on the control plane before resuming traffic."
          env:
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: {{ .Values.backup.credentialsSecret }}, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.backup.credentialsSecret }}, key: password } }
            # The restore target, as libpq environment: pg_restore and the
            # migrate step both read it, so they can never disagree.
            - name: PGHOST
              value: {{ .Values.restore.host | quote }}
            - name: PGPORT
              value: {{ .Values.restore.port | default 5432 | quote }}
            - name: PGDATABASE
              value: {{ .Values.restore.database | quote }}
            # DPR-108: restore the tenant database over an encrypted, verified
            # session — pg_restore and the migrate step both read this (§7.12).
            - name: PGSSLMODE
              value: {{ include "probectl.restorePGSSLMode" . | quote }}
            {{- if .Values.control.trustBundle.existingConfigMap }}
            - name: PGSSLROOTCERT
              value: {{ include "probectl.trustBundlePath" . | quote }}
            {{- end }}
            - name: PROBECTL_ENVELOPE_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.backup.encryption.keySecret }}, key: {{ .Values.backup.encryption.keySecretKey }} } }
          volumeMounts:
            - { name: backups, mountPath: /backups, readOnly: true }
            - { name: shared, mountPath: /shared }
            - { name: restore-work, mountPath: /restore-work }
            {{- if .Values.control.trustBundle.existingConfigMap }}
            - { name: trust-bundle, mountPath: {{ .Values.control.trustBundle.mountPath | quote }}, readOnly: true }
            {{- end }}
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: {{ .Values.backup.persistence.claimName | default (printf "%s-backups" (include "probectl.fullname" .)) }}
        - name: shared
          emptyDir: {}
        - name: restore-work
          emptyDir: {}
        {{- if .Values.control.trustBundle.existingConfigMap }}
        - name: trust-bundle
          configMap:
            name: {{ .Values.control.trustBundle.existingConfigMap | quote }}
            items:
              - { key: {{ .Values.control.trustBundle.key | quote }}, path: {{ .Values.control.trustBundle.key | quote }} }
        {{- end }}
{{- end }}
{{- if .Values.restore.clickhouse.enabled }}
---
# OPS-007 / RESIL-001: chart-managed ClickHouse restore Job, mirroring the CH
# backup CronJob. RESTORE runs SERVER-SIDE: the path below is read by the
# ClickHouse server. For sealed .zip.pbk artifacts, this Job mounts the SAME
# server-visible backup PVC path, opens the .pbk into a temporary .zip on that
# path, then asks ClickHouse to restore that server-visible .zip.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "probectl.fullname" . }}-clickhouse-restore
  labels:
    {{- include "probectl.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook-weight": "0"
spec:
  backoffLimit: 0   # a restore must not silently retry-and-clobber; fail loud
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # the clickhouse image's clickhouse uid
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.backup.encryption.enabled }}
      initContainers:
        - name: stage-probectl
          image: {{ include "probectl.image" . }}
          securityContext:
            {{- include "probectl.jobContainerSecurityContext" . | nindent 12 }}
          command: ["/usr/local/bin/app"]
          args: ["stage-binary", "/tools/probectl-control"]
          volumeMounts:
            - { name: tools, mountPath: /tools }
      {{- end }}
      containers:
        - name: ch-restore
          image: {{ .Values.restore.clickhouse.image | default .Values.backup.clickhouse.image | quote }}
          securityContext:
            {{- include "probectl.jobContainerSecurityContext" . | nindent 12 }}
          command: ["/bin/bash", "-euo", "pipefail", "-c"]
          args:
            - |
              server_backup_path="{{ required "restore.clickhouse.serverBackupPath is required" .Values.restore.clickhouse.serverBackupPath }}"
              backup_file="{{ required "restore.clickhouse.backupFile is required" .Values.restore.clickhouse.backupFile }}"
              echo "ch-restore: ClickHouse server {{ .Values.restore.clickhouse.host }} must already see ${server_backup_path}/${backup_file}"
              backup="${server_backup_path}/${backup_file}"
              sha="${backup}.sha256"
              test -s "${backup}"
              test -s "${sha}"
              (cd "${server_backup_path}" && sha256sum -c "${backup_file}.sha256" >/dev/null)
              restore_file="${backup_file}"
              case "${backup_file}" in
                *.pbk)
                  restore_file="${backup_file%.pbk}.restore-open"
                  /tools/probectl-control backup-open --key-file=/keys/envelope.key < "${backup}" > "${server_backup_path}/${restore_file}"
                  test -s "${server_backup_path}/${restore_file}"
                  ;;
              esac
              echo "ch-restore: dropping + restoring {{ .Values.restore.clickhouse.database }} (DESTRUCTIVE)…"
              ch=(clickhouse-client --host "{{ .Values.restore.clickhouse.host }}"
                  --port {{ include "probectl.restoreCHPort" . }}
                  {{- if eq (include "probectl.restoreCHSecure" .) "true" }}
                  --secure --config-file=/etc/probectl/ch/client.xml
                  {{- end }}
                  --user "$CH_USER" --password "$CH_PASSWORD")
              "${ch[@]}" --query "DROP DATABASE IF EXISTS {{ .Values.restore.clickhouse.database }} SYNC"
              "${ch[@]}" --query "RESTORE DATABASE {{ .Values.restore.clickhouse.database }} FROM File('${server_backup_path}/${restore_file}')"
              case "${restore_file}" in
                *.restore-open) rm -f "${server_backup_path}/${restore_file}" ;;
              esac
              echo "ch-restore: done. Verify /readyz on the control plane before resuming traffic."
          env:
            - name: CH_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.backup.credentialsSecret }}, key: ch-username } }
            - name: CH_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.backup.credentialsSecret }}, key: ch-password } }
          volumeMounts:
            - name: backups
              mountPath: {{ required "restore.clickhouse.serverBackupPath is required" .Values.restore.clickhouse.serverBackupPath | quote }}
            {{- if .Values.backup.encryption.enabled }}
            - { name: tools, mountPath: /tools, readOnly: true }
            - { name: envelope-key, mountPath: /keys, readOnly: true }
            {{- end }}
            {{- if eq (include "probectl.restoreCHSecure" .) "true" }}
            - { name: ch-client, mountPath: /etc/probectl/ch, readOnly: true }
            {{- end }}
            {{- if .Values.control.trustBundle.existingConfigMap }}
            - { name: trust-bundle, mountPath: {{ .Values.control.trustBundle.mountPath | quote }}, readOnly: true }
            {{- end }}
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: {{ .Values.backup.persistence.claimName | default (printf "%s-backups" (include "probectl.fullname" .)) }}
        {{- if .Values.backup.encryption.enabled }}
        - name: tools
          emptyDir: {}
        - name: envelope-key
          secret:
            secretName: {{ .Values.backup.encryption.keySecret }}
            items:
              - { key: {{ .Values.backup.encryption.keySecretKey }}, path: envelope.key }
        {{- end }}
        {{- if eq (include "probectl.restoreCHSecure" .) "true" }}
        - name: ch-client
          configMap:
            name: {{ include "probectl.fullname" . }}-ch-client
        {{- end }}
        {{- if .Values.control.trustBundle.existingConfigMap }}
        - name: trust-bundle
          configMap:
            name: {{ .Values.control.trustBundle.existingConfigMap | quote }}
            items:
              - { key: {{ .Values.control.trustBundle.key | quote }}, path: {{ .Values.control.trustBundle.key | quote }} }
        {{- end }}
{{- end }}
