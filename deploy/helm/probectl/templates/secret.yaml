{{- /* RTO-14: for the regulated profile, surface the complete required-value list before this template's own checks. */ -}}
{{- include "probectl.regulatedPreflight" . -}}
{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.envelopeKey }}
{{- fail "secrets.envelopeKey is required (base64 32-byte KEK) unless secrets.existingSecret is set" }}
{{- end }}
{{- if not .Values.secrets.sessionHMACKey }}
{{- fail "secrets.sessionHMACKey is required (hex 32-byte session HMAC key) unless secrets.existingSecret is set" }}
{{- end }}
{{- if and .Values.objectStore.enabled (eq .Values.objectStore.mode "s3") (not .Values.secrets.objectStoreS3SecretKey) }}
{{- fail "secrets.objectStoreS3SecretKey is required for objectStore.mode=s3 unless secrets.existingSecret is set" }}
{{- end }}
{{- if not (regexMatch "^[0-9a-fA-F]{64}$" .Values.secrets.sessionHMACKey) }}
{{- fail "secrets.sessionHMACKey must be exactly 64 hex characters (openssl rand -hex 32)" }}
{{- end }}
{{- if not .Values.database.url }}
{{- fail "database.url is required (full Postgres DSN) unless secrets.existingSecret is set — no default credential ships (OPS-001)" }}
{{- end }}
{{- if contains "probectl:probectl@" .Values.database.url }}
{{- fail "database.url ships the dev credential probectl:probectl — set a real DSN with a strong password (OPS-001, fail closed)" }}
{{- end }}
{{- with .Values.secrets.testSyncSigningKey }}
{{- if not (contains "-----BEGIN PRIVATE KEY-----" (b64dec .)) }}
{{- fail "secrets.testSyncSigningKey must be base64 of a PKCS#8 PEM Ed25519 private key (openssl genpkey -algorithm ed25519 | base64 | tr -d '\\n') (G9)" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "probectl.fullname" . }}-secrets
  labels:
    {{- include "probectl.labels" . | nindent 4 }}
type: Opaque
stringData:
  PROBECTL_ENVELOPE_KEY: {{ .Values.secrets.envelopeKey | quote }}
  PROBECTL_SESSION_HMAC_KEY: {{ .Values.secrets.sessionHMACKey | quote }}
  {{- if .Values.secrets.evidenceSigningKey }}
  PROBECTL_EVIDENCE_SIGNING_KEY: {{ .Values.secrets.evidenceSigningKey | quote }}
  {{- end }}
  {{- if .Values.secrets.testSyncSigningKey }}
  # G9: one deployment-wide test-bundle signing identity for every replica.
  PROBECTL_TESTSYNC_SIGNING_KEY: {{ .Values.secrets.testSyncSigningKey | quote }}
  {{- end }}
  {{- if .Values.secrets.objectStoreS3SecretKey }}
  PROBECTL_OBJECTSTORE_S3_SECRET_KEY: {{ .Values.secrets.objectStoreS3SecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.objectStoreS3SessionToken }}
  PROBECTL_OBJECTSTORE_S3_SESSION_TOKEN: {{ .Values.secrets.objectStoreS3SessionToken | quote }}
  {{- end }}
  PROBECTL_DATABASE_URL: {{ .Values.database.url | quote }}
  {{- if .Values.oidc.clientSecret }}
  PROBECTL_OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
