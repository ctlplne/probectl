apiVersion: v1
kind: Service
metadata:
  name: {{ include "probectl.fullname" . }}
  labels:
    {{- include "probectl.labels" . | nindent 4 }}
spec:
  # ClusterIP by default: the API is reachable externally only through the
  # TLS ingress, and this Service targets the pod's HTTPS listener.
  type: {{ .Values.service.type }}
  # DPR-085 follow-up: the Services keep the release-wide selector on purpose.
  # A Service selector is applied the instant `helm upgrade` runs, before a
  # single new pod exists; narrowing it to a label the RUNNING pods lack
  # orphaned every old replica for 14 s on the lab (27 failed requests). The
  # named targetPort already keeps the agent pods out of the endpoints — they
  # expose no port by that name — so the Service needs no component selector.
  selector:
    {{- include "probectl.selectorLabels" . | nindent 4 }}
  ports:
    - name: {{ include "probectl.servicePortName" . }}
      port: {{ .Values.service.port }}
      targetPort: {{ include "probectl.servicePortName" . }}
      protocol: TCP
{{- if .Values.control.agentListener.enabled }}
---
# DPR-046: the agent gRPC/mTLS listener gets its own Service so it can be
# exposed to probe hosts outside the cluster (NodePort/LoadBalancer) without
# widening the API Service, which stays behind the TLS ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "probectl.fullname" . }}-agents
  labels:
    {{- include "probectl.labels" . | nindent 4 }}
  {{- with (dig "service" "annotations" nil .Values.control.agentListener) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ include "probectl.agentListener.serviceType" . }}
  # DPR-085 follow-up: the Services keep the release-wide selector on purpose.
  # A Service selector is applied the instant `helm upgrade` runs, before a
  # single new pod exists; narrowing it to a label the RUNNING pods lack
  # orphaned every old replica for 14 s on the lab (27 failed requests). The
  # named targetPort already keeps the agent pods out of the endpoints — they
  # expose no port by that name — so the Service needs no component selector.
  selector:
    {{- include "probectl.selectorLabels" . | nindent 4 }}
  ports:
    - name: agent-grpc
      port: {{ include "probectl.agentListener.port" . }}
      targetPort: agent-grpc
      protocol: TCP
      {{- with (dig "service" "nodePort" nil .Values.control.agentListener) }}
      nodePort: {{ int . }}
      {{- end }}
{{- end }}
