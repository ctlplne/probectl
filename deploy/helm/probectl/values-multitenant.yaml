# MULTI-TENANT / PROVIDER (MSP) reference overrides.
#
#   helm install probectl deploy/helm/probectl \
#     -f deploy/helm/probectl/values-multitenant.yaml \
#     --set ingress.host=probectl.msp.example \
#     --set ingress.backendTLS.trustSecret=probectl-backend-ca \
#     --set ingress.backendTLS.serverName=probectl.msp.example \
#     --set control.tls.existingSecret=probectl-msp-tls \
#     --set-string image.digest='sha256:<release-digest>' \
#     --set database.url=...
#
# REQUIRED with this profile (the chart refuses to render without it, PRIVACY-001):
# a SIEM export endpoint. Provider profiles prune tenant audit rows only below
# the SIEM delivery watermark, so pass BOTH on the command line — the two keys
# are left unset here because no default endpoint can be right:
#     --set-string control.extraEnv.PROBECTL_SIEM_ENABLED=true \
#     --set-string control.extraEnv.PROBECTL_SIEM_ENDPOINT=https://siem.example/ingest
#
# ALSO REQUIRED: durable stores. The control plane refuses this profile on the
# in-memory bus/TSDB/event stores (DPR-029). Wire Kafka (SASL_SSL), a
# Prometheus-compatible TSDB and ClickHouse over TLS, e.g.
#     --set-string control.extraEnv.PROBECTL_BUS_MODE=kafka \
#     --set-string control.extraEnv.PROBECTL_BUS_BROKERS=kafka-0.kafka.probectl.svc.cluster.local:9093 \
#     --set-string control.extraEnv.PROBECTL_BUS_TLS_ENABLED=true \
#     --set-string control.extraEnv.PROBECTL_BUS_TLS_CA_FILE=/etc/probectl/trust/ca-bundle.crt \
#     --set-string control.extraEnv.PROBECTL_BUS_SASL_MECHANISM=plain \
#     --set-string control.extraEnv.PROBECTL_BUS_SASL_USER=probectl \
#     --set-string control.extraEnv.PROBECTL_TSDB_MODE=prometheus \
#     --set-string control.extraEnv.PROBECTL_TSDB_URL=https://prometheus.probectl.svc.cluster.local:9090 \
#     --set-string control.extraEnv.PROBECTL_TSDB_BASIC_AUTH_FILE=/etc/probectl/credentials/prom-basic-auth.json \
#     --set-string control.extraEnv.PROBECTL_PATHSTORE_MODE=clickhouse ... (flow/otel/ebpf/endpoint alike) \
#     --set-string control.extraEnv.PROBECTL_CLICKHOUSE_BASIC_AUTH_FILE=/etc/probectl/credentials/ch-basic-auth.json
# with PROBECTL_BUS_SASL_PASSWORD in secrets.existingSecret, the two basic-auth
# files in control.credentialFiles and the CA in control.trustBundle (README).
#
# PRODUCERS: turn the agent gRPC/mTLS listener on after the one-time
#     kubectl -n probectl exec deploy/probectl -- /usr/local/bin/app agent-ca init
# with  --set control.agentListener.enabled=true --set control.agentListener.service.type=LoadBalancer
# (DPR-046; README "The agent listener").
#
# SILOED / RESIDENCY TENANTS: each ClickHouse data plane needs its own
# credential file in control.credentialFiles, named by
#     --set-string control.extraEnv.PROBECTL_DATAPLANES=eu=https://ch-eu.example:8443 \
#     --set-string control.extraEnv.PROBECTL_DATAPLANE_BASIC_AUTH_FILES=eu=/etc/probectl/credentials/ch-eu.json
# (a plane on the pooled ClickHouse names the pooled ch-basic-auth.json; DPR-044).
#
# ALSO SET control.trustedProxies to the ingress controller's pod CIDR (e.g.
#     --set 'control.trustedProxies={10.244.0.0/16}'
# ) so login rate limiting keys on real clients, not on the ingress pod
# (DPR-039): otherwise one misbehaving client locks SSO for every tenant.
#
# Same HTTPS-by-default posture as single-tenant; the difference is scale +
# provider operation. Postgres-resident tenant data is isolated by always-on
# FORCE-RLS regardless of deployment shape, but the ClickHouse row-policies and
# the bus strict-lane are gated on PROBECTL_DEPLOYMENT_PROFILE — so a provider
# deployment MUST set it to multi-tenant (below), or the control plane refuses to
# serve more than one tenant (RED-001, fail closed).

replicaCount: 3

# CONFIG-09e06212: all provider replicas share one runtime Secret. It MUST
# contain PROBECTL_ENVELOPE_KEY, PROBECTL_SESSION_HMAC_KEY,
# PROBECTL_DATABASE_URL, and one base64-encoded PROBECTL_WORM_SIGNING_KEY.
# The chart rejects a pod-local PROBECTL_WORM_SIGNING_KEY_FILE in HA.
secrets:
  existingSecret: probectl-provider-runtime

# Signed WORM segments are shared state, not pod scratch space. Pre-create this
# ReadWriteMany claim on an encrypted object-lock-backed CSI/storage class; the
# chart deliberately will not fall back to emptyDir while WORM export is on.
objectStore:
  enabled: true
  mountPath: /var/lib/probectl/objects
  existingClaim: probectl-provider-objects-rwx

control:
  authMode: session      # provider deployments always use real SSO
  # AIRCA-003: in a multi-tenant/MSP deployment, mask hostnames before any
  # prompt egresses to a remote LLM (a tenant's internal hostnames are
  # sensitive across the shared platform). Single-tenant keeps the default
  # (false) where hostnames are usually the question's subject; here we close
  # the egress hole by default. Override only with explicit tenant consent.
  extraEnv:
    PROBECTL_AI_REDACT_HOSTNAMES: "true"
    # RED-001: enable ClickHouse row-policies + bus strict-lane for multi-tenant.
    # Without this the single-profile default leaves them OFF and boot fails closed.
    PROBECTL_DEPLOYMENT_PROFILE: "multi-tenant"
    # PRIVACY-001: provider profiles default audit retention to 8760h and fail
    # closed unless raw in-DB audit rows have durable export watermarks before
    # pruning. The WORM directory is a child of the shared objectStore mount.
    # The signing key comes only from secrets.existingSecret in this HA profile.
    PROBECTL_AUDIT_WORM_DIR: "/var/lib/probectl/objects/audit-worm"
    # DPR-011: provider-plane admission also needs the operator-owned IR public
    # keyring (<tenant-uuid>.pem per tenant, created empty on first start). It
    # lives on the same shared mount so every replica seals break-glass
    # attribution to the same keys.
    PROBECTL_IR_PUBLIC_KEY_DIR: "/var/lib/probectl/objects/ir-keys"
    # PROBECTL_SIEM_ENABLED: "true"
    # PROBECTL_SIEM_ENDPOINT: "https://siem.example/ingest"
    # RED-001: every ClickHouse-backed lane needs the scoped reader user whose
    # setting-scoped row policy is installed at boot. Operators may split these
    # by plane; the reference profile uses one SELECT-only reader account.
    PROBECTL_PATHSTORE_READER_USER: "probectl_reader"
    PROBECTL_FLOWSTORE_READER_USER: "probectl_reader"
    PROBECTL_OTELSTORE_READER_USER: "probectl_reader"
    PROBECTL_EBPFSTORE_READER_USER: "probectl_reader"
    PROBECTL_ENDPOINTSTORE_READER_USER: "probectl_reader"

# Keep a quorum during the S34 rolling upgrade / node drains.
podDisruptionBudget:
  enabled: true
  minAvailable: 2

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Spread replicas across nodes for availability.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: probectl

ingress:
  enabled: true
  className: nginx
  # Additional deployment hostnames terminate at the same probectl-branded UI;
  # this is the provider/admin entry host.
  host: probectl.msp.example.com
  tlsSecretName: probectl-msp-tls
