# probectl — STRICT / regulated profile (OPS-004).
#
# The DEFAULT profile (values.yaml, U-086/WIRE-002) ships NetworkPolicy on with
# the API ingress already narrowed to the named ingress controller. It still has
# allow-all egress so a first install can reach its database, IdP, bus, and
# feeds. THIS profile closes the remaining egress hole for regulated/air-gapped
# deployments and adds a monitoring namespace ingress selector for /metrics.
# Nothing else is reachable unless it is named here.
#
# OPERATOR-SUPPLIED VALUES (RTO-14): this overlay sets PROBECTL_DEPLOYMENT_PROFILE
# =regulated (below), which makes the control plane validate a full production
# surface at STARTUP — verified-TLS Postgres, durable bus/stores, WORM/SIEM audit
# watermarks. Those inputs are operator- and environment-specific, so the overlay
# cannot ship defaults for them. The chart therefore REFUSES TO RENDER until every
# one is supplied and prints the full list in a single message
# (templates/_helpers.tpl `probectl.regulatedPreflight`): a bare
# `helm template -f values-strict.yaml` fails LOUDLY and completely instead of
# rendering a config the pod then rejects at boot ("deployed" → CrashLoopBackOff).
# A complete, installable invocation (match every value to your cluster):
#
#   helm install probectl deploy/helm/probectl -f deploy/helm/probectl/values-strict.yaml \
#     --set-string image.digest='sha256:<release-digest>' \
#     --set control.tls.existingSecret=probectl-metrics-tls \
#     --set ingress.host=probectl.example.com \
#     --set ingress.backendTLS.trustSecret=probectl-backend-ca \
#     --set ingress.backendTLS.serverName=probectl.example.com \
#     --set 'control.trustedProxies={10.244.0.0/16}' \
#     --set secrets.existingSecret=probectl-runtime \
#     --set audit.worm.enabled=true \
#     --set-string audit.worm.existingClaim=probectl-audit-worm \
#     --set-string control.extraEnv.PROBECTL_SIEM_ENABLED=true \
#     --set-string control.extraEnv.PROBECTL_SIEM_ENDPOINT=https://siem.example/ingest \
#     --set-string control.extraEnv.PROBECTL_BUS_MODE=kafka \
#     --set-string control.extraEnv.PROBECTL_BUS_BROKERS=kafka.probectl.svc:9093 \
#     --set-string control.extraEnv.PROBECTL_BUS_TLS_ENABLED=true \
#     --set-string control.extraEnv.PROBECTL_TSDB_MODE=prometheus \
#     --set-string control.extraEnv.PROBECTL_TSDB_URL=https://prometheus.probectl.svc:9090 \
#     --set-string control.extraEnv.PROBECTL_PATHSTORE_MODE=clickhouse \
#     --set-string control.extraEnv.PROBECTL_PATHSTORE_URL=https://clickhouse.probectl.svc:8443 \
#     --set-string control.extraEnv.PROBECTL_FLOWSTORE_MODE=clickhouse \
#     --set-string control.extraEnv.PROBECTL_FLOWSTORE_URL=https://clickhouse.probectl.svc:8443 \
#     --set-string control.extraEnv.PROBECTL_OTELSTORE_MODE=clickhouse \
#     --set-string control.extraEnv.PROBECTL_OTELSTORE_URL=https://clickhouse.probectl.svc:8443 \
#     --set-string control.extraEnv.PROBECTL_EBPFSTORE_MODE=clickhouse \
#     --set-string control.extraEnv.PROBECTL_EBPFSTORE_URL=https://clickhouse.probectl.svc:8443 \
#     --set-string control.extraEnv.PROBECTL_ENDPOINTSTORE_MODE=clickhouse \
#     --set-string control.extraEnv.PROBECTL_ENDPOINTSTORE_URL=https://clickhouse.probectl.svc:8443
#
# The secrets.existingSecret above MUST contain PROBECTL_DATABASE_URL (with
# sslmode=verify-ca or verify-full and sslrootcert — plain `require` is rejected
# for this profile), PROBECTL_ENVELOPE_KEY, PROBECTL_SESSION_HMAC_KEY, and a
# base64 PROBECTL_WORM_SIGNING_KEY. The ClickHouse scoped-reader users are shipped
# below (RED-001); point the bus/TSDB/store endpoints at TLS listeners.
#
# REVIEW BEFORE APPLYING: the selectors + CIDRs below are a REFERENCE that
# you MUST match to your cluster (ingress-controller namespace, monitoring
# namespace, datastore CIDRs/ports). A wrong selector fails CLOSED — the API
# becomes unreachable — which is the safe direction for this profile.
# Referenced from docs/hardening.md as the regulated-profile recommendation.

allowPlaintextHTTP: false

networkPolicy:
  enabled: true
  # HOLE 1 CLOSED: only the named ingress controller (and the monitoring
  # namespace, for /metrics scraping) may reach the API port. Replace the
  # namespace labels with YOUR cluster's.
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  # HOLE 2 CLOSED: egress beyond DNS is restricted to the datastores, bus,
  # IdP, and feeds this deployment actually reaches. Tune CIDRs/ports to your
  # environment. (DNS 53 is always allowed by the template.)
  egressTo:
    - to:
        - ipBlock: { cidr: 10.0.0.0/8 } # in-cluster / private datastore range
      ports:
        - { protocol: TCP, port: 5432 } # PostgreSQL with sslmode=require/verify-* on the same port
        - { protocol: TCP, port: 8443 } # ClickHouse HTTPS
        - { protocol: TCP, port: 9440 } # ClickHouse native TLS
        - { protocol: TCP, port: 9093 } # Kafka TLS
        - { protocol: TCP, port: 443 }  # Prometheus/VictoriaMetrics HTTPS remote-write
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 } # IdP / OIDC + open-data/threat feeds
      ports:
        - { protocol: TCP, port: 443 } # HTTPS only — no plaintext egress

# OPS-005: scrape /metrics via the Prometheus Operator (the monitoring
# namespace is the second ingress selector above).
# OPS-012/WIRE-003: every profile serves HTTPS directly from
# control.tls.existingSecret. This regulated overlay additionally gives
# Prometheus an explicit CA reference; Service, probes, ingress, and
# ServiceMonitor still target the same HTTPS listener.
metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
    scheme: https
    tlsConfig:
      # The CA the control listener's serving cert chains to. Provide this
      # secret out-of-band for Prometheus; insecureSkipVerify MUST stay false
      # (fail closed on an unverifiable cert).
      ca:
        secret:
          name: probectl-metrics-ca
          key: ca.crt
      serverName: probectl-metrics
      insecureSkipVerify: false
  prometheusRule:
    enabled: true

# OPS-009: backups ON in the regulated profile. Supply the credentials
# secret out-of-band; let the chart create the backups PVC.
backup:
  enabled: true
  clickhouse:
    encryptedTargetAck: encrypted-clickhouse-backup-target
  persistence:
    create: true
    size: 100Gi

# H8: the regulated reference keeps tenant objects and signed WORM segments on
# one encrypted operator-owned PVC so the object backup CronJob can snapshot it.
# Create this claim out-of-band with the cluster's encrypted StorageClass.
objectStore:
  enabled: true
  mountPath: /var/lib/probectl
  existingClaim: probectl-objects

# Strict pod hardening (mirrors the seccomp/strict guidance — keep these in
# step with your platform's PodSecurity "restricted" admission).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# AIRCA-003: the regulated profile masks hostnames before any prompt egresses
# to a remote LLM (internal hostnames are sensitive in regulated/air-gapped
# orgs). The product default is false (hostnames are usually the question's
# subject); this profile flips it closed. Combine with a local/sovereign model
# adapter to keep telemetry fully on-network.
control:
  tls:
    enabled: true
    existingSecret: probectl-metrics-tls
  extraEnv:
    # RUNOPS-003: this profile is the regulated reference profile, so the
    # control plane must boot with the production-like tenant, datastore, audit,
    # and strict-lane validators instead of silently defaulting to "single".
    PROBECTL_DEPLOYMENT_PROFILE: "regulated"
    PROBECTL_AI_REDACT_HOSTNAMES: "true"
    # RED-001: every ClickHouse-backed lane needs its scoped SELECT-only reader
    # whose setting-scoped row policy is installed at boot. Shipped here (not an
    # environment value) so a regulated ClickHouse deployment is not left to
    # discover the missing reader only at pod startup. Operators may split these
    # per plane; the reference uses one reader account.
    PROBECTL_PATHSTORE_READER_USER: "probectl_reader"
    PROBECTL_FLOWSTORE_READER_USER: "probectl_reader"
    PROBECTL_OTELSTORE_READER_USER: "probectl_reader"
    PROBECTL_EBPFSTORE_READER_USER: "probectl_reader"
    PROBECTL_ENDPOINTSTORE_READER_USER: "probectl_reader"
