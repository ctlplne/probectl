# Default values for probectl — SINGLE-TENANT (sovereign) reference.
#
# HTTPS on every hop by default: the control process serves TLS directly, while
# the ingress also terminates public TLS and sets HSTS. Service, probes, ingress,
# and ServiceMonitor all target the same HTTPS pod listener. Operators must
# provide control.tls.existingSecret; rendering fails closed when it is absent.
# See values-strict.yaml for the closed-egress regulated profile and
# values-multitenant.yaml for the MSP / provider reference.

image:
  repository: ghcr.io/ctlplne/probectl-control
  # Required: immutable digest from the signed release or approved mirror.
  digest: "" # sha256:<64 lowercase hex>
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Optional Python BGP intelligence sidecar (W1). Disabled means no Python
# runtime and no outbound BGP feed connection exist. When enabled, provide an
# immutable probectl-bgp-analyzer image digest, a Secret containing one
# tenant-bound analyzer JSON config, and explicit Kafka/TLS egress settings.
bgpAnalyzer:
  enabled: false
  image:
    repository: ghcr.io/ctlplne/probectl-bgp-analyzer
    digest: "" # required when enabled; sha256:<64 hex>
    pullPolicy: IfNotPresent
  configSecret: "" # key below must contain analyzer JSON with tenant_id
  configKey: analyzer.json
  source: "" # required when enabled: ris-live | mrt | replay
  sourceFile: "" # required by the runner for mrt/replay; mount it below
  restart: true
  # Optional Secret containing ONLY PROBECTL_BUS_* auth/TLS environment keys.
  busSecret: ""
  # Non-secret PROBECTL_BUS_* settings, e.g. mode=kafka, brokers, TLS CA path.
  extraEnv:
    PROBECTL_BUS_MODE: kafka
    PROBECTL_BUS_BROKERS: ""
    PROBECTL_BUS_TLS_ENABLED: "true"
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  networkPolicy:
    enabled: true
    # Required/non-empty when enabled: allow only Kafka, configured RPKI, and
    # RIS Live destinations approved for this deployment. DNS is added below.
    egressTo: []

# Optional rendered-browser synthetic agent (W2). The image packages the
# tenant-bound Go agent and listener-free Playwright worker together so the
# stdin/stdout ExecDriver contract stays inside one pod. Supply a Secret whose
# agent.yml references the mTLS identity files carried in that same Secret.
browserAgent:
  enabled: false
  image:
    repository: ghcr.io/ctlplne/probectl-browser-agent
    digest: "" # required when enabled; sha256:<64 hex>
    pullPolicy: IfNotPresent
  configSecret: ""
  configKey: agent.yml
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }
  extraEnv: {}
  extraVolumes: []
  extraVolumeMounts: []
  nodeSelector: {}
  tolerations: []
  networkPolicy:
    enabled: true
    # Required/non-empty when enabled: allow only the mTLS control plane and
    # the public/private targets this tenant has explicitly approved.
    egressTo: []

replicaCount: 1

# Apply database migrations from an init container before the server starts.
migrateOnBoot: true

control:
  # Identity mode: "session" (real OIDC SSO — set oidc.* below) or "dev"
  # (all-access; NEVER in production).
  authMode: session
  logFormat: json
  logLevel: info
  # RFC 9116 disclosure contact served at /.well-known/security.txt.
  securityContact: "mailto:security@your-org.example"
  # The control process serves TLS directly on service.port. Service, probes,
  # ingress backend, and ServiceMonitor all use the named "https" target.
  # existingSecret is required and must contain tls.crt/tls.key, unless certKey
  # and keyKey are overridden to match the operator-managed Secret.
  tls:
    enabled: true
    existingSecret: ""
    certKey: tls.crt
    keyKey: tls.key
    mountPath: /etc/probectl/http-tls
  # Extra CA certificates the control plane trusts for OUTBOUND TLS (DPR-026):
  # a private-PKI identity provider, SIEM, CMDB, secrets backend, or a managed
  # Postgres reached with sslmode=verify-ca/verify-full. Name a ConfigMap in the
  # release namespace holding one PEM bundle; the chart mounts it read-only into
  # the migrate init container and the control container and points
  # SSL_CERT_FILE at it. Go keeps loading the image's system roots from
  # /etc/ssl/certs as well, so public endpoints stay verifiable. Empty = system
  # roots only.
  #   kubectl -n probectl create configmap probectl-trust-bundle --from-file=ca-bundle.crt=./corp-ca.pem
  #   --set control.trustBundle.existingConfigMap=probectl-trust-bundle
  trustBundle:
    existingConfigMap: ""
    key: ca-bundle.crt
    mountPath: /etc/probectl/trust
  # Proxies whose X-Forwarded-For / X-Real-IP the authentication limiters may
  # believe (DPR-039): the ingress controller pods or the load balancer in
  # front of the control plane, as CIDRs or addresses. Behind an ingress the
  # control plane otherwise sees every user as the ingress pod's IP, so five
  # failed logins by anyone lock SSO and provider login for the whole
  # deployment. Set it to the ingress controller's pod CIDR, e.g.
  #   --set 'control.trustedProxies={10.244.0.0/16}'
  # Forwarded headers from any other peer stay ignored.
  trustedProxies: []
  # Operator credential FILES the control plane must read as private, regular,
  # mode-0600 files (DPR-030): PROBECTL_TSDB_BASIC_AUTH_FILE,
  # PROBECTL_CLICKHOUSE_BASIC_AUTH_FILE, broker mTLS client keys. A Kubernetes
  # Secret volume cannot satisfy that shape (projected symlinks, group-readable
  # under fsGroup), so name a Secret here: the chart stages every key of it
  # into a private in-memory volume with `probectl-control stage-credentials`
  # before migrate and control start, then mounts that volume read-only. Point
  # the file settings at <mountPath>/<key> through control.extraEnv, e.g.
  #   kubectl -n probectl create secret generic probectl-store-credentials \
  #     --from-file=prom-basic-auth.json --from-file=ch-basic-auth.json
  #   --set control.credentialFiles.existingSecret=probectl-store-credentials \
  #   --set-string control.extraEnv.PROBECTL_TSDB_BASIC_AUTH_FILE=/etc/probectl/credentials/prom-basic-auth.json
  credentialFiles:
    existingSecret: ""
    mountPath: /etc/probectl/credentials
  # Extra PROBECTL_* env vars, as a map of name: value. Names owned by typed
  # chart values or the chart Secret are rejected so this map cannot override
  # TLS, authentication, encryption, HSTS, listener, or credential settings.
  extraEnv: {}

oidc:
  issuer: ""
  clientId: ""
  # The secret is stored in the chart Secret (or supply via existingSecret).
  clientSecret: ""
  redirectUrl: ""

# Enterprise / MSP license (DPR-006). The control plane verifies the
# offline-signed file locally against the trust anchors compiled into its
# binary — never phone-home. Empty = Community (the full core, free forever).
#   kubectl -n probectl create secret generic probectl-license --from-file=license.json=./license.json
#   --set license.existingSecret=probectl-license
license:
  # Name of a pre-created Secret holding the license file.
  existingSecret: ""
  # Key inside that Secret that carries the file.
  key: license.json
  # Where the file is mounted read-only; PROBECTL_LICENSE_FILE points here.
  mountPath: /etc/probectl/license

# Secret material. Prefer existingSecret in production (managed externally).
# Multi-replica WORM export requires it: every replica must receive the same
# PROBECTL_WORM_SIGNING_KEY from this Secret; a per-pod signing-key file is
# rejected because it cannot preserve one signing identity across replicas.
secrets:
  # Name of a pre-created Secret holding PROBECTL_ENVELOPE_KEY,
  # PROBECTL_SESSION_HMAC_KEY, PROBECTL_DATABASE_URL, and optionally
  # PROBECTL_OIDC_CLIENT_SECRET, PROBECTL_WORM_SIGNING_KEY,
  # PROBECTL_EVIDENCE_SIGNING_KEY, and the offline PROBECTL_IR_UNLOCK_KEY. When
  # set, the chart does NOT create its own.
  existingSecret: ""
  # base64-encoded 32-byte envelope KEK (openssl rand -base64 32). Required.
  envelopeKey: ""
  # hex-encoded 32-byte session-token HMAC key (openssl rand -hex 32). Required.
  sessionHMACKey: ""
  # Base64 of a PKCS#8 PEM Ed25519 private key. It is shared by all replicas and
  # provides one stable, out-of-band-pinnable evidence-export identity.
  evidenceSigningKey: ""
  # S3/MinIO signing material. Prefer existingSecret in production.
  objectStoreS3SecretKey: ""
  objectStoreS3SessionToken: ""

# At-rest encryption is REQUIRED by default (SEC-002): the chart refuses to
# template without the required keys, and the control plane refuses to start
# keyless (TENANT-106 fail-closed). Bulk telemetry volumes (Postgres,
# ClickHouse, object store) are encrypted by the OPERATOR's storage layer —
# see docs/hardening.md and `probectl-control preflight --strict`.
requireAtRestEncryption: true

# Tenant object artifacts (browser screenshots/waterfalls, future blobs). Enable
# only with operator-owned encrypted storage. When enabled, the same mounted path
# is wired to PROBECTL_OBJECTSTORE_DIR and tenant lifecycle export/erase covers
# the tenant-prefixed object namespace. Setting PROBECTL_AUDIT_WORM_DIR makes
# enabled=true and a non-empty existingClaim mandatory; WORM never uses emptyDir.
# The WORM directory must be this exact mountPath or a canonical child of it.
objectStore:
  enabled: false
  mode: filesystem # filesystem | s3
  mountPath: /var/lib/probectl/objects
  existingClaim: "" # empty uses ephemeral emptyDir only when WORM is disabled
  s3:
    endpoint: "" # verified https:// S3 or MinIO endpoint
    bucket: ""
    region: us-east-1
    accessKey: ""
    prefix: probectl

# SEC-009/WIRE-002: both the public ingress and the in-cluster control listener
# serve TLS, so session/OAuth cookies remain protected on every hop.
publicTLS: true

# WIRE-004: plaintext is disabled. Keeping this explicit value also makes a
# future accidental control.tls.enabled=false fail closed at process startup.
allowPlaintextHTTP: false

# Kafka bus tls policy (optional; PROBECTL_BUS_MODE=kafka): production runs the
# broker hop over TLS — plaintext kafka is refused by the control plane unless
# the explicit dev-only PROBECTL_BUS_ALLOW_PLAINTEXT=true is set (U-010).
# Wire via control.extraEnv, e.g.:
#   PROBECTL_BUS_MODE: kafka
#   PROBECTL_BUS_BROKERS: kafka-0.kafka:9093
#   PROBECTL_BUS_TLS_ENABLED: "true"
#   PROBECTL_BUS_TLS_CA_FILE: /etc/probectl/kafka-ca.crt   # mounted CA bundle
#   PROBECTL_BUS_SASL_MECHANISM: scram-sha-512
#   PROBECTL_BUS_SASL_USER: probectl
#   PROBECTL_BUS_SASL_PASSWORD: vault:kafka/probectl#password  # S41 secret ref

database:
  # Full DSN — REQUIRED. No default credential ships (OPS-001): rendering fails
  # closed unless you set this (or secrets.existingSecret). Point at your managed
  # Postgres. TLS in transit is expected in production (sslmode=require), e.g.:
  #   --set database.url='postgres://probectl:<STRONG_PASSWORD>@host:5432/probectl?sslmode=require'
  url: ""

service:
  type: ClusterIP
  port: 8080

# HTTPS-by-default ingress. Public TLS terminates here, HSTS is set, HTTP is
# redirected to HTTPS, and the ingress uses HTTPS to the control pod too.
ingress:
  enabled: true
  # The built-in Ingress supports ingress-nginx only. Its controller-specific
  # proxy-ssl annotations enforce backend certificate chain + name verification.
  # Disable this Ingress and supply an equivalently verified one for other controllers.
  className: nginx
  host: probectl.example.com
  # TLS secret holding the cert for `host`. Use cert-manager (annotations below)
  # or pre-create the secret. HTTPS-by-default requires this to be set.
  tlsSecretName: probectl-tls
  # The ingress controller separately verifies the HTTPS control listener.
  # trustSecret is a Secret in this release namespace satisfying ingress-nginx's
  # proxy-ssl Secret contract: tls.crt, tls.key, and ca.crt for the listener's issuer.
  # serverName must be present in the control listener certificate's SANs.
  backendTLS:
    trustSecret: ""
    serverName: ""
  # Integer seconds. The template renders this explicitly as a Go duration
  # (31536000s); 0 is preserved as 0s so operators can deliberately clear HSTS.
  hstsMaxAge: 31536000
  # Extra annotations merged into the Ingress. Chart-owned redirect and backend
  # TLS annotations are rejected here so they cannot be duplicated or weakened.
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Hardened pod/container security context (non-root, read-only root FS). The
# image is distroless `nonroot` (uid/gid 65532), so we pin the numeric ids too —
# pod admission (restricted PSS) and many policy engines require an explicit
# runAsUser, not just runAsNonRoot.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  name: ""
  # The control plane needs no Kubernetes API access — don't mount the token.
  automountServiceAccountToken: false

# PodDisruptionBudget keeps a quorum available during voluntary disruptions (node
# drains, the S34 rolling upgrade). Enable it whenever replicaCount > 1 — the M/L
# reference values do.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1   # set one OR the other, not both

# HorizontalPodAutoscaler. When enabled the Deployment's replicas field is omitted
# so the HPA owns scaling.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80

# NetworkPolicy: default-deny ingress + egress, with explicit allows. ON by
# default (U-086/WIRE-002). The policy allows the HTTPS API only from the named
# ingress-controller namespace. It still carries one DOCUMENTED HOLE until you
# tighten egress per deployment:
#   HOLE: egressTo EMPTY ⇒ all egress is allowed (plus DNS, always allowed).
#           Set the datastore/bus/IdP/feed allow-list to close it —
#           values-large.yaml ships a filled reference list.
# Requires a CNI that enforces NetworkPolicy (Calico/Cilium/...); without one
# the object is inert. Set enabled: false only with an equivalent external
# control (and note it in your hardening review).
networkPolicy:
  enabled: true
  # Sources allowed to reach the API on the container port. This must stay
  # non-empty when networkPolicy.enabled=true; the template fails closed if it
  # is empty. Adjust the namespace label to your ingress controller.
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  # Egress beyond DNS (which is always allowed): the Postgres/bus/IdP/SIEM/feeds
  # this deployment must reach. EMPTY ⇒ the HOLE above (allow-all egress); see
  # values-large.yaml for the filled reference allow-list.
  egressTo: []
    # - to:
    #     - ipBlock: { cidr: 10.0.0.0/8 }
    #   ports:
    #     - { protocol: TCP, port: 5432 }

# Spread + scheduling. M/L reference values set anti-affinity / spread for HA.
topologySpreadConstraints: []
nodeSelector: {}
tolerations: []
affinity: {}

# OPS-005: Prometheus self-metrics (/metrics on the control plane). The
# endpoint is process/aggregate health only — never tenant data — so it is
# served unauthenticated like /healthz; scrape access is scoped at the
# NetworkPolicy + ServiceMonitor layer (see values-strict.yaml).
metrics:
  serviceMonitor:
    # Requires the Prometheus Operator CRDs. Off by default (no CRDs ⇒ the
    # object would not apply); regulated profiles enable it.
    enabled: false
    interval: 30s
    # Must match the rendered HTTPS Service target.
    scheme: https
    labels: {}
    tlsConfig: {}
  prometheusRule:
    # OPS-004: opt-in self-alert pack for the same process/cluster metrics the
    # ServiceMonitor scrapes. Off by default because PrometheusRule is also a
    # Prometheus Operator CRD; regulated profiles enable it.
    enabled: false
    labels: {}
    runbookBaseURL: https://github.com/ctlplne/probectl/blob/main/docs/runbooks/probectl-self-alerts.md
    thresholds:
      noSelfMetricsFor: 5m
      highGoroutines: 5000
      highGoroutinesFor: 10m
      highMemoryBytes: 4294967296 # 4 GiB process sys memory
      highMemoryFor: 10m
      writesPausedFor: 2m
      replicaLagSeconds: 30
      replicaLagFor: 5m
      dlqGrowthWindow: 5m
      dlqGrowthEvents: 0
      dlqGrowthFor: 2m
      busErrorWindow: 5m
      busErrorEvents: 0
      busErrorFor: 2m
      clickhouseFailureWindow: 5m
      clickhouseFailureEvents: 0
      clickhouseFailureFor: 2m
      agentDarkFleetFraction: 0.25
      agentDarkFleetFor: 10m
      fairnessWindow: 5m
      fairnessEvents: 0
      fairnessFor: 5m
      wormExportGapSeconds: 7200 # 2h; default WORM export cadence is 1h
      wormExportGapFor: 10m
      wormVerifyFailureWindow: 5m
      wormVerifyFailures: 0
      wormVerifyFailureFor: 2m

# OPS-009/H8: chart-managed PG + CH + object-store/WORM backup CronJobs (folded in from
# deploy/backup/, U-030). OFF by default — opt in, then supply the
# credentials secret (and either an existing backups PVC or persistence.create).
backup:
  enabled: false
  # Break-glass only: set exactly to allow-plaintext-tenant-backup when
  # backup.encryption.enabled=false and you intentionally want a raw .dump.
  plaintextAck: ""
  # Secret holding username/password (Postgres) and ch-username/ch-password
  # (ClickHouse). Operator-provided.
  credentialsSecret: probectl-db-credentials
  # OPS-002/CRYPTO-001: envelope-encrypt the Postgres dump in-pipe and the
  # ClickHouse native zip immediately after server-side staging. The KEK is the
  # SAME deployment envelope key (Sprint 8) — restore on a fresh node only needs
  # it. The ClickHouse staging volume must still be encrypted (docs/hardening.md
  # §0c) because the server briefly writes a raw tenant-telemetry zip there.
  encryption:
    enabled: true
    keySecret: probectl-secrets       # secret holding the envelope KEK
    keySecretKey: PROBECTL_ENVELOPE_KEY # base64 KEK under this key
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  persistence:
    create: false       # true ⇒ the chart creates the backups PVC
    claimName: ""        # else point at an existing PVC (default: <release>-backups)
    size: 50Gi
    storageClass: ""
  postgres:
    enabled: true
    schedule: "0 2 * * *"
    host: probectl-postgres
    database: probectl
    image: postgres:16@sha256:4b7183ac05f8ef417db21fd72d71047a4238340c261d3cc3ddb6d579ab5071ae # digest-pinned (U-061)
  clickhouse:
    enabled: true
    # Required when backup.enabled=true and clickhouse.enabled=true. ClickHouse
    # BACKUP TO File writes a server-side .zip before the CronJob seals it to
    # .zip.pbk, so this ack means the server backup path and any raw fallback
    # target are encrypted operator-controlled storage.
    encryptedTargetAck: ""
    # Telemetry regional DR profile: off-region backup. With the shipped
    # nightly schedule below, ClickHouse telemetry RPO is <=24h plus the time it
    # takes your backup controller to copy this .zip.pbk and .sha256 to encrypted
    # off-region storage. Tighten this schedule or use ClickHouse incrementals
    # for a smaller telemetry RPO; this is separate from Postgres metadata RPO.
    schedule: "30 2 * * *"
    host: probectl-clickhouse
    database: probectl
    serverBackupPath: /backups # server-visible path also mounted by backup/restore Jobs for .pbk seal/open
    image: clickhouse/clickhouse-server:24.8@sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b # digest-pinned (U-061)
  objectStore:
    enabled: true
    schedule: "45 2 * * *"
    # Read-only source PVC containing PROBECTL_OBJECTSTORE_DIR and, when WORM
    # is configured below that mount, signed audit segments + signing material.
    # Supply this PVC out-of-band; no object-store credentials live in values.
    sourceClaim: probectl-objects
    mountPath: /objects
    # Empty reuses the digest-pinned Postgres image (shell + tar + sha256sum).
    image: ""

# OPS-007: one-shot restore Job. OFF by default — set enabled=true and
  # backupFile to the sealed dump on the backups PVC, `helm upgrade`, then delete
  # the Job. Uses the same credentials + envelope key as the backup CronJobs.
restore:
  enabled: false
  backupFile: ""              # filename on the backups PVC (e.g. pg-2026-06-13.sql.sealed)
  host: probectl-postgres
  database: probectl
  image: ""                   # SUPPLY-006: defaults to the digest-pinned backup.postgres.image
  # OPS-007: chart-managed ClickHouse restore (mirrors the PG restore Job and the
  # CH backup CronJob). Set clickhouse.enabled=true and clickhouse.backupFile to
  # the sealed .zip.pbk on the ClickHouse SERVER's backup path. The Job opens it
  # into that same server-visible path, then RESTORE runs SERVER-SIDE
  # (clickhouse-client RESTORE DATABASE ... FROM File(...)). DESTRUCTIVE: the
  # database is dropped first.
  clickhouse:
    enabled: false
    backupFile: ""            # filename on the ClickHouse server backup path (e.g. clickhouse-probectl-...zip.pbk)
    serverBackupPath: /backups # server-visible path shared with the restore Job for .pbk open
    host: probectl-clickhouse
    database: probectl
    image: ""                 # defaults to backup.clickhouse.image
