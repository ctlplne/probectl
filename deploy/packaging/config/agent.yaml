# probectl canary agent configuration (shipped as a CONFFILE in the deb/rpm so
# operator edits survive upgrades). Fill in the control-plane address and point
# tls.* / enrollment at the material the registration step provisioned.
# Full key reference: docs/configuration.md.
apiVersion: probectl.io/agent/v1
control_plane:
  # The control plane's agent gRPC/mTLS listener (PROBECTL_AGENT_GRPC_ADDR,
  # 9443 in the shipped stacks): host:port, no scheme. Never plaintext.
  grpc_addr: "CONTROL-HOST:9443"
tls:
  # Exactly what `probectl-agent enroll --dir /var/lib/probectl-agent/identity`
  # writes (DPR-034): the SVID, its key, and the trust the enrollment verified
  # the control plane with (server-ca.pem) — NOT ca.pem, the agent-CA bundle.
  cert_file: /var/lib/probectl-agent/identity/cert.pem
  key_file: /var/lib/probectl-agent/identity/key.pem
  ca_file: /var/lib/probectl-agent/identity/server-ca.pem
  server_name: ""                          # SNI/cert name if it differs from the host
identity:
  server: https://CONTROL-HOST:8443        # the API; enables automatic SVID rotation
agent:
  hostname: ""                             # defaults to the OS hostname
  capabilities: []
  labels: {}                               # local region/site declarations; no geo lookup
  heartbeat_interval: 30s
artifact_store:
  mode: filesystem                        # s3 selects durable S3/MinIO (see docs/configuration.md)
  dir: ""                                  # optional: browser artifacts under tenant/<id>/browser/
browser:
  driver: http                             # HTTP transaction; rendered browser needs the dedicated image/worker
# The one-time enrollment token is NOT stored here. Provide it once to
# `probectl-agent enroll` (or the Ansible vault lookup); the agent then keeps
# only its issued certificate under tls.* above.
