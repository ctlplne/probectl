# OPS-004: nfpm config that builds a signed deb AND rpm for ONE agent type.
# release.yml loops it per agent (AGENT=agent|ebpf-agent|flow-agent|
# device-agent|endpoint), each producing a package that bundles the static
# binary, its systemd unit, and an /etc/probectl/<agent>.yaml conffile, then
# pushes to the signed apt/yum repos. This is the baseline every other
# automation tool (Ansible/Puppet/Chef) shells out to.
#
# OPS-002: two distinct version vars — the release build names binaries with the
# v-PREFIXED tag (dist/probectl-control_v0.2.0_linux_amd64), so `src` below must
# use FILE_TAG (the v-prefixed tag). The deb/rpm package `version`, by contrast,
# must be NUMERIC (no leading v), so it uses PKG_VERSION. Conflating the two made
# nfpm look for a v-stripped filename that never existed → no package built.
#
#   AGENT=ebpf-agent FILE_TAG=v0.2.0 PKG_VERSION=0.2.0 ARCH=amd64 \
#     nfpm package -f deploy/packaging/nfpm.yaml -p deb -t dist/
#
name: "probectl-${AGENT}"
arch: "${ARCH}"
version: "${PKG_VERSION}"
section: "net"
priority: "optional"
maintainer: "probectl <security@probectl.example>"
description: |
  probectl ${AGENT} — a single static probe/collector agent for the probectl
  network observability platform. Enrolls to a control plane over mTLS (or, for
  the bus-publishing collectors, a registered identity) and reports telemetry.
vendor: "probectl"
homepage: "https://docs.probectl.example"
# SUP-14: the agents are the BUSL-1.1 core (MPL-2.0 covers only pkg/, proto/ and
# examples/, which these packages do not ship). The package carries the matching
# LICENSE text under /usr/share/doc; scripts/check_package_license.sh gates this.
license: "BUSL-1.1"

contents:
  - src: ./dist/probectl-${AGENT}_${FILE_TAG}_linux_${ARCH}
    dst: /usr/bin/probectl-${AGENT}
    file_info:
      mode: 0755
  - src: ./LICENSE
    dst: /usr/share/doc/probectl-${AGENT}/LICENSE
  - src: ./deploy/packaging/systemd/probectl-${AGENT}.service
    dst: /lib/systemd/system/probectl-${AGENT}.service
  - src: ./deploy/packaging/config/${AGENT}.yaml
    dst: /etc/probectl/${AGENT}.yaml
    type: config|noreplace   # operator edits survive upgrades
    file_info:
      mode: 0640
      # RTO-22: the systemd unit runs as User=probectl; a root:root 0640 conffile
      # is unreadable by it ("read config: permission denied"). The preinstall
      # script creates this user before unpack, and postinstall chowns the tree
      # as a belt-and-suspenders in case the owner name did not resolve at unpack.
      owner: probectl
      group: probectl

# SUP-05: the maintainer scripts are rendered PER AGENT (postinstall/preremove
# bake in ${AGENT} so each package touches only its own unit) and dropped in
# ${PROBECTL_SCRIPTS} by the same build step that renders this file. Pointing
# nfpm straight at ./deploy/packaging/scripts/*.sh would ship the un-rendered
# template with a literal ${AGENT}, so always render first (release.yml and
# scripts/packaging-smoke.sh both do).
overrides:
  deb:
    scripts:
      preinstall: ${PROBECTL_SCRIPTS}/preinstall.sh
      postinstall: ${PROBECTL_SCRIPTS}/postinstall.sh
      preremove: ${PROBECTL_SCRIPTS}/preremove.sh
  rpm:
    scripts:
      preinstall: ${PROBECTL_SCRIPTS}/preinstall.sh
      postinstall: ${PROBECTL_SCRIPTS}/postinstall.sh
      preremove: ${PROBECTL_SCRIPTS}/preremove.sh

# Signed repos: release.yml signs the packages (cosign keyless: a .sig + .pem
# per artifact) and publishes them to the apt/yum repositories. cosign
# verification is wired into the installers (SUPPLY-002): install.sh verifies a
# local eBPF binary by default before install, and the
# Ansible role's package_url method runs `cosign verify-blob` gated on
# probectl_verify_cosign (fail-closed) before installing. apt/yum repo installs
# rely on the repository's own signed-metadata trust (signed-by= keyring).
