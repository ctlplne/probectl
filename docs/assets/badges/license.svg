  <title>license: BUSL-1.1 core · MPL-2.0 client · commercial ee/</title>
  <!-- A static, self-contained badge: no external fonts, images or links.
       It states LICENSE's "SCOPE OF THIS LICENSE"; REUSE.toml is the
       machine-readable form and scripts/check_reuse_licensing.sh gates it. -->
  <linearGradient id="shine" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="round">
    <rect width="348" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#round)">
    <rect width="51" height="20" fill="#555"/>
    <rect x="51" width="297" height="20" fill="#0a5fa8"/>
    <rect width="348" height="20" fill="url(#shine)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="25.5" y="14" textLength="41" lengthAdjust="spacingAndGlyphs">license</text>
