syntax = "proto3";

// AgentService is the agent <-> control-plane transport. Every RPC requires
// mTLS; the caller's tenant and agent id are derived from the verified client
// certificate's SPIFFE id (spiffe://probectl/tenant/<t>/<plane>/<a>) — never
// trusted from the request body. Existing agent and eBPF RPCs remain plane
// scoped; D-179's entity-plane credential can call only SubmitEntityEvidence.
// Every result or evidence claim is tenant-attributable at the source.
//
// Backward compatibility: fields are additive-only. Never renumber or reuse a
// field tag; a CI `buf breaking` check enforces this.
package probectl.agent.v1;

option go_package = "github.com/ctlplne/probectl/internal/gen/probectl/agent/v1;agentv1";

service AgentService {
  // Register announces an agent (idempotent upsert into the registry).
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Attest re-proves the agent's identity (placeholder for SPIFFE node/workload
  // attestation; SVID issuance is S-EE1).
  rpc Attest(AttestRequest) returns (AttestResponse);
  // Heartbeat reports liveness and the agent's current config epoch.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // StreamConfig is an EXPLICIT DENY (U-044, ARCH-003) — config push is NOT a
  // shipped capability. The server returns codes.Unimplemented immediately: no
  // frame is sent and no stream is held open (see service.go StreamConfig).
  // Agents load config from local YAML/env only (deliberate: no remote
  // config/control channel, matching the no-agent-self-update posture). Kept in
  // the schema for wire compatibility; implementing real push requires a signed
  // config-push ADR first (docs/adr/config-push.md).
  rpc StreamConfig(StreamConfigRequest) returns (stream StreamConfigResponse);
  // StreamResults streams probe results to the control plane (agent -> server).
  rpc StreamResults(stream StreamResultsRequest) returns (StreamResultsResponse);
  // PollCoordination returns the next pending agent-to-agent task for the
  // calling agent (none when empty). The control plane brokers roles (which
  // agent listens vs initiates) and rendezvous; agents poll for their task.
  rpc PollCoordination(PollCoordinationRequest) returns (PollCoordinationResponse);
  // ReportEndpoint lets a responder announce where it is listening for a
  // session, so the control plane can hand the address to the initiator.
  rpc ReportEndpoint(ReportEndpointRequest) returns (ReportEndpointResponse);
  // FetchTestBundle is the agent PULL of its tenant's central synthetic test
  // set (docs/adr/central-test-distribution.md, D-41). The tenant comes from the
  // client certificate only. The bundle is signed with the deployment's
  // test-bundle key; the agent verifies it against the public key it received at
  // enrollment and refuses an unverifiable, foreign-tenant or non-newer bundle.
  // The server answers FailedPrecondition when central test distribution is not
  // configured. This is not config push: StreamConfig stays an explicit deny.
  rpc FetchTestBundle(FetchTestBundleRequest) returns (FetchTestBundleResponse);
  // FetchL7Policy returns the calling agent's tenant's L7 capture redaction
  // floor (D-43, refinement 3): the loosest redaction mode the tenant allows.
  // The tenant comes from the client certificate only; the request carries
  // nothing. The eBPF agent refuses to start capture when its local
  // l7_capture_redaction is looser than the floor, and applies metadata when
  // it received none. Policy only — not config push (StreamConfig stays an
  // explicit deny): nothing here can turn capture on or widen its scope.
  rpc FetchL7Policy(FetchL7PolicyRequest) returns (FetchL7PolicyResponse);
  // ReportL7Posture records the calling agent's L7 capture posture (enabled,
  // consent tenant, scope, redaction mode) on its registry row. The control
  // plane appends agent.l7_capture.posture to the tenant's hash-chained audit
  // stream when an agent first reports consented capture or changes mode.
  rpc ReportL7Posture(ReportL7PostureRequest) returns (ReportL7PostureResponse);
  // SubmitEntityEvidence accepts a bounded batch of observational identifiers
  // from the evidence-only mTLS certificate plane (D-179). The verified peer
  // supplies tenant and agent; the operator-owned registry supplies context
  // and canonical entity. No field in this request may choose those identities.
  rpc SubmitEntityEvidence(SubmitEntityEvidenceRequest) returns (SubmitEntityEvidenceResponse);
}

message RegisterRequest {
  string hostname = 1;
  string agent_version = 2;
  repeated string capabilities = 3; // compiled-in canary plugin types
  map<string, string> labels = 4;
}

message RegisterResponse {
  string agent_id = 1;  // authoritative, from the verified certificate
  string tenant_id = 2; // authoritative, from the verified certificate
  uint64 config_epoch = 3; // the tenant's current central test-set version (0 = distribution off)
  uint32 heartbeat_interval_seconds = 4;
  string control_version = 5; // control-plane version used for the skew check
  string protocol_version = 6; // agent wire protocol revision, e.g. "probectl.agent.v1"
  repeated string accepted_capabilities = 7; // requested agent capabilities this server supports
  repeated string server_capabilities = 8; // behavior-level RPC/schema capabilities supported by this server
}

message AttestRequest {
  bytes nonce = 1;
  map<string, string> platform = 2;
}

message AttestResponse {
  bool ok = 1;
  string message = 2;
}

message HeartbeatRequest {
  string agent_id = 1;     // cross-check only; the certificate is authoritative
  // The epoch the agent currently holds: the version of the central test set
  // it has verified and applied (0 = none). Recorded per agent and compared
  // with the tenant's current version.
  uint64 config_epoch = 2;
}

message HeartbeatResponse {
  // The agent should re-pull: its tenant's central test set is newer than the
  // config_epoch it reported, so it calls FetchTestBundle now instead of waiting
  // for its poll interval.
  bool config_stale = 1;
  uint32 heartbeat_interval_seconds = 2;
}

message StreamConfigRequest {
  uint64 known_epoch = 1;
}

message StreamConfigResponse {
  uint64 epoch = 1;
  // RESERVED for a future signed config-push design (U-044): always empty
  // today — see the StreamConfig rpc comment.
  bytes payload = 2;
}

message StreamResultsRequest {
  // type is an advisory hint; observed_unix_nanos is the agent's observation
  // time. payload carries a marshaled probectl.result.v1.Result (see
  // proto/result.proto), which the server unmarshals and re-stamps with the
  // authoritative tenant/agent from the mTLS certificate (service.go ingest()).
  string type = 1;
  bytes payload = 2;
  int64 observed_unix_nanos = 3;
}

message StreamResultsResponse {
  uint64 accepted = 1;
}

// A2ARole is an agent's role in one agent-to-agent measurement session.
enum A2ARole {
  A2A_ROLE_UNSPECIFIED = 0;
  A2A_ROLE_RESPONDER = 1; // opens a listener and echoes probes
  A2A_ROLE_INITIATOR = 2; // connects to the responder and measures
}

message PollCoordinationRequest {}

message PollCoordinationResponse {
  bool has_task = 1;
  A2ATask task = 2;
}

// A2ATask is one brokered agent-to-agent assignment for the calling agent.
message A2ATask {
  string session_id = 1;
  A2ARole role = 2;
  string mode = 3; // "udp" | "tcp"
  uint32 count = 4; // probes the initiator sends
  // Set for the initiator only: where the responder is listening.
  string responder_host = 5;
  uint32 responder_port = 6;
  string peer_agent_id = 7; // the other agent in the session (for labeling)
}

message ReportEndpointRequest {
  string session_id = 1;
  string host = 2;
  uint32 port = 3;
}

message ReportEndpointResponse {
  bool accepted = 1;
}

message FetchTestBundleRequest {
  // The test-set version the agent has verified and applied (0 = none). When
  // the tenant's current version equals it, the server answers not_modified
  // without signing or sending a bundle.
  uint64 known_version = 1;
}

message FetchTestBundleResponse {
  bool not_modified = 1;
  // The tenant's current test-set version (the bundle's epoch). Advisory: the
  // agent trusts only the epoch inside the verified bundle.
  uint64 version = 2;
  // The signed bundle (internal/testsync Signed JSON); empty when not_modified.
  bytes signed_bundle = 3;
}

message FetchL7PolicyRequest {}

message FetchL7PolicyResponse {
  // The tenant's floor: length | metadata | headers | full. metadata when the
  // tenant made no statement; never looser than metadata under the regulated
  // deployment profile.
  string redaction_floor = 1;
  // D-65: store and show only the registered domain of a DNS question name
  // (the regulated profile). false: labels left of it are templated.
  bool dns_registered_domain_only = 2;
}

// L7CapturePosture is an agent's L7 capture state as it reports it. Every
// field is untrusted agent input: the control plane bounds and validates it,
// and keeps the consent tenant only when it equals the certificate's tenant.
message L7CapturePosture {
  bool enabled = 1;               // l7_capture_enabled
  string consent_tenant = 2;      // l7_capture_consent_tenant
  repeated string scope = 3;      // l7_capture_scope (pid:/exe:/cgroup:)
  string redaction_mode = 4;      // the agent's local l7_capture_redaction
  string effective_mode = 5;      // the mode capture runs under ("" when not capturing)
  string redaction_floor = 6;     // the floor the agent applied ("" = none received)
  bool active = 7;                // a capture source is attached
  // off | refused_consent | refused_floor | attach_failed | capturing | replaying
  string state = 8;
}

message ReportL7PostureRequest {
  L7CapturePosture posture = 1;
}

message ReportL7PostureResponse {
  // true when the report changed the recorded posture (and, when material,
  // appended agent.l7_capture.posture to the tenant's audit chain).
  bool changed = 1;
}

// A collector-generated observation UUID is an idempotency key within its
// authenticated source. It is never a tenant, agent, context or entity key.
// Presence distinguishes a complete empty set from legacy/withheld metadata.
// These local host IPs never select tenant, context or canonical identity.
message AgentAddressSnapshot {
  repeated string addresses = 1;
}

// A complete supported RFC4293 prefix walk from the configured device.
// Rows are observations, never canonical interface or routing authority.
message SnmpInterfacePrefix {
  uint32 if_index = 1;
  string prefix = 2;
  bool on_link = 3;
}

// Absent is unavailable/legacy. A present empty unsupported walk is invalid,
// rather than an authoritative removal of previously observed prefixes.
message SnmpInterfacePrefixSnapshot {
  repeated SnmpInterfacePrefix prefixes = 1;
}

message EntityEvidenceObservation {
  string observation_id = 1;
  string source_kind = 2;       // device_target | flow_exporter | path_agent | bmp_peer | agent_site
  string configured_ref = 3;   // must match the operator-owned assignment
  string alias_kind = 4;        // typed observation, e.g. address or snmp_device_id
  string alias_value = 5;       // untrusted; validated and normalized server-side
  string source_ref = 6;        // original plane identifier retained for provenance
  int64 observed_unix_nanos = 7;
  string origin_serial = 8;     // BMP only: exact verified router SVID serial
  string interface_name = 9;    // SNMP interface claim only: observed ifName
  string interface_description = 10; // SNMP interface claim only: observed ifDescr
  string neighbor_protocol = 11; // LLDP or CDP, never routing authority
  uint32 neighbor_local_if_index = 12; // full SNMP ifIndex on the local device
  string neighbor_local_port_id = 13;
  string neighbor_remote_port_id = 14;
  string neighbor_chassis_id = 15;
  string neighbor_device_name = 16;
  string neighbor_management_address = 17; // observed IP, not a context selector
  string system_description = 18; // bounded SNMP sysDescr on the configured-target address claim only
  optional string system_name = 19; // raw bounded sysName; absent is legacy, present empty clears
  AgentAddressSnapshot agent_addresses = 20; // agent_site claim only; complete local IP metadata
  SnmpInterfacePrefixSnapshot snmp_interface_prefixes = 21; // configured-target device address claim only
}

// A bounded fault observation shares the evidence-only RPC and live mTLS
// sender. No tenant, agent, context, canonical entity or arbitrary severity is
// accepted from the payload; the server derives those or leaves identity
// unresolved. The UUID makes retries idempotent.
message EntityFaultObservation {
  string observation_id = 1;
  string source_kind = 2;      // device_target | flow_exporter; BMP needs router-origin proof
  string configured_ref = 3;  // operator-assigned source, never context authority
  string target_address = 4;  // observed IP, not a context selector
  string kind = 5;            // bounded server-known fault kind for that source
  int64 observed_unix_nanos = 6;
}

// Complete untrusted BMP Peer Up bytes. Tenant, collector, context and router
// come from mTLS and current operator assignments, never this payload. The
// observation UUID is a retry identity only; it grants no source authority.
message BmpRoutingPeerUp {
  string observation_id = 1;
  string configured_ref = 2;
  string origin_serial = 3;
  int64 observed_unix_nanos = 4;
  bytes message = 5;
}

// One complete ordered source message within a private staging generation.
// Heartbeat/reset retain complete source lifecycle bytes. Reset may omit bytes
// for an authenticated collector socket closure. No tenant,
// router, context, interpreted paths or client-selected family is accepted.
message BmpRoutingMessage {
  string configured_ref = 1;
  string origin_serial = 2;
  string generation = 3;
  int64 observed_unix_nanos = 4;
  int64 sequence = 5;
  bytes message = 6;
  bool heartbeat = 7;
  bool source_reset = 8;
}

message BmpRoutingMessageReceipt {
  string status = 1; // applied | replayed | invalidated; never a live grant
  string generation = 2;
  int64 sequence = 3;
}

message BmpRoutingStagingReceipt {
  string status = 1; // staged | replayed | invalidated; never publication
  repeated BmpRoutingViewReference views = 2;
}

message BmpRoutingViewReference {
  string id = 1;
  string generation = 2;
  uint32 afi = 3;
  uint32 safi = 4;
}

// A complete original TABLE_DUMP_V2 peer-index record. The source reference
// selects only a current operator assignment; tenant and collector come from
// the evidence mTLS identity. Staging does not make any route current.
message PublicRoutingPeerTable {
  string observation_id = 1;
  string configured_ref = 2;
  int64 observed_unix_nanos = 3;
  bytes source_record = 4;
}

// One original MRT RIB record or an exclusive whole-file EOF/reset marker.
// The sender validates complete file framing before EOF. The receiver decodes
// every record against the stored peer table and never accepts interpreted
// paths, peer-selected view handles, tenant, context or router identifiers.
message PublicRoutingMessage {
  string configured_ref = 1;
  string snapshot_id = 2;
  int64 observed_unix_nanos = 3;
  int64 sequence = 4;
  bytes record = 5;
  bool complete = 6;
  bool source_reset = 7;
}

message PublicRoutingStagingReceipt {
  string status = 1; // staged | replayed | invalidated; never a read grant
  string snapshot_id = 2;
}

message PublicRoutingMessageReceipt {
  string status = 1; // applied | replayed | invalidated
  string snapshot_id = 2;
  int64 sequence = 3;
}

// Original flow dimensions witnessed by the restricted evidence mTLS peer.
// The digest covers the entire original bus record; this separate tuple binds
// routing inputs to that digest. No tenant, sender, context or router is accepted.
message FlowRoutingWitness {
  bytes raw_digest = 1;
  string exporter_address = 2;
  uint32 observation_domain = 3;
  string flow_protocol = 4;
  string source_address = 5;
  string destination_address = 6;
}

message FlowRoutingWitnessBatch {
  string contract_version = 1; // flow_capture_v1
  repeated FlowRoutingWitness observations = 2;
}

// Identifies a durable first observation, including unavailable/erased results.
// Neither the key nor its processing clock grants access to routing evidence.
message FlowRoutingCapture {
  bytes key = 1;
  int64 captured_unix_nanos = 2;
}

message FlowRoutingCaptureBatch {
  repeated FlowRoutingCapture captures = 1; // same complete order as the request
}

message SubmitEntityEvidenceRequest {
  repeated EntityEvidenceObservation observations = 1;
  repeated EntityFaultObservation faults = 2; // 1–64 combined; message size is also bounded
  BmpRoutingPeerUp routing_peer_up = 3; // exclusive; complete staging only
  BmpRoutingMessage routing_message = 4; // exclusive; complete ordered source message
  FlowRoutingWitnessBatch flow_routing = 5; // exclusive; certified sender only
  PublicRoutingPeerTable public_routing_peer_table = 6; // exclusive original source metadata
  PublicRoutingMessage public_routing_message = 7; // exclusive original MRT record or EOF/reset
}

message SubmitEntityEvidenceResponse {
  uint32 accepted = 1;   // canonical claims persisted or idempotent replays
  uint32 unresolved = 2; // no current source/anchor or ambiguous server-side match
  uint32 faults_persisted = 3; // persisted in the tenant incident stream, including unresolved identity
  BmpRoutingStagingReceipt routing = 4;
  BmpRoutingMessageReceipt routing_message = 5;
  FlowRoutingCaptureBatch flow_routing = 6;
  PublicRoutingStagingReceipt public_routing = 7;
  PublicRoutingMessageReceipt public_routing_message = 8;
}
