# D-107: pinned vendor binaries are local CI fixtures only. No vendor source,
# template, or export is checked into probectl. The CI runner records the
# pulled image IDs before use, then removes this exact Compose project.
services:
  librenms-db:
    image: mariadb:11.8.3@sha256:ae6119716edac6998ae85508431b3d2e666530ddf4e94c61a10710caec9b0f71
    platform: linux/amd64
    environment:
      MARIADB_ROOT_PASSWORD: ${LIBRENMS_DB_ROOT_PASSWORD:?}
      MARIADB_DATABASE: librenms
      MARIADB_USER: librenms
      MARIADB_PASSWORD: ${LIBRENMS_DB_PASSWORD:?}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30
    networks: [vendor]

  librenms:
    image: librenms/librenms:26.10.2@sha256:66f586a84355b6c80758e373aaa7c0b230284d1d22588b29b3706540041e2806
    platform: linux/amd64
    depends_on:
      librenms-db:
        condition: service_healthy
    environment:
      DB_HOST: librenms-db
      DB_NAME: librenms
      DB_USER: librenms
      DB_PASSWORD: ${LIBRENMS_DB_PASSWORD:?}
    networks: [vendor]

  zabbix-db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    platform: linux/amd64
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?}
      POSTGRES_DB: zabbix
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 5s
      retries: 30
    networks: [vendor]

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:7.4.16-alpine@sha256:546f7cae8f04b287ab4ffd3cc81193f2ea99f2da1d0564217b65d93438f44454
    platform: linux/amd64
    depends_on:
      zabbix-db:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?}
      POSTGRES_DB: zabbix
    networks: [vendor]

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:7.4.16-alpine@sha256:62ffffb395b9ecd63e9260263dcd9bb4038668fd691e0be1e396bc0182bf77ba
    platform: linux/amd64
    depends_on:
      zabbix-server:
        condition: service_started
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?}
      POSTGRES_DB: zabbix
      PHP_TZ: UTC
    networks: [vendor]

networks:
  vendor:
    internal: true
